        input:focus, select:focus { outline: none; border-color: var(--primary); }
        .result-hero { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); padding: 40px; border-radius: 16px; text-align: center; margin: 20px 0; }

        .result-hero-label { color: rgba(255,255,255,0.9); font-size: 1.2rem; }

<body>
    </div>
    </div>

    <header class="header">
        <h1>🏠 Siding Calculator</h1>
    </header>

    <div class="main-container">
        <div class="content-area">
            <div class="card">
                <h2>🧱 Siding Type</h2>
                <div class="type-grid">
                    <button class="type-btn active" onclick="setType('vinyl', this)"><span class="emoji">🔲</span>Vinyl</button>
                    <button class="type-btn" onclick="setType('fiber', this)"><span class="emoji">🪵</span>Fiber Cement</button>
                    <button class="type-btn" onclick="setType('wood', this)"><span class="emoji">🌲</span>Wood</button>
                    <button class="type-btn" onclick="setType('aluminum', this)"><span class="emoji">🔩</span>Aluminum</button>
                    <button class="type-btn" onclick="setType('steel', this)"><span class="emoji">⬜</span>Steel</button>
                    <button class="type-btn" onclick="setType('stucco', this)"><span class="emoji">🏛️</span>Stucco</button>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label>Wall Height (feet)</label>
                        <input type="number" id="height" value="9" step="1" oninput="calculate()">
                    </div>
                    <div class="form-group">
                        <label>Total Wall Length (feet)</label>
                        <input type="number" id="length" value="150" step="10" oninput="calculate()">
                    </div>
                    <div class="form-group">
                        <label>Gable Area (sq ft)</label>
                        <input type="number" id="gables" value="200" step="25" oninput="calculate()">
                    </div>
                    <div class="form-group">
                        <label>Window/Door Area (sq ft)</label>
                        <input type="number" id="openings" value="200" step="25" oninput="calculate()">
                    </div>
                </div>
            </div>

            <div class="result-hero">
                <div class="result-hero-label">Estimated Cost</div>
                <div class="result-hero-value" id="totalCost">$0</div>
            </div>

            <div class="results-grid">
                <div class="result-card">
                    <div class="result-value" id="totalSqFt">0</div>
                    <div class="result-label">Square Feet</div>
                </div>
                <div class="result-card">
                    <div class="result-value" id="squares">0</div>
                    <div class="result-label">Squares (100 sq ft)</div>
                </div>
                <div class="result-card">
                    <div class="result-value" id="materialCost">$0</div>
                    <div class="result-label">Material Only</div>
                </div>
            </div>

            <div class="card">
                <h2>📊 Cost Breakdown</h2>
                <div class="breakdown-row"><span>Siding Material</span><span id="sidingCost">$0</span></div>
                <div class="breakdown-row"><span>Underlayment/Wrap</span><span id="wrapCost">$0</span></div>
                <div class="breakdown-row"><span>Trim & Accessories</span><span id="trimCost">$0</span></div>
                <div class="breakdown-row"><span>Labor (estimated)</span><span id="laborCost">$0</span></div>
                <div class="breakdown-row"><span><strong>Total Installed</strong></span><span id="grandTotal"><strong>$0</strong></span></div>
            </div>

            </div>

            <div class="card">
                <h2>🔗 Related Tools</h2>
                <div class="related-tools">
                    <a href="paint-calculator.html" class="related-link">🎨 Paint Calculator</a>
                    <a href="roofing-calculator.html" class="related-link">🏠 Roofing</a>
                    <a href="insulation-calculator.html" class="related-link">🧊 Insulation</a>
                    <a href="home-renovation-calculator.html" class="related-link">🔨 Renovation</a>
                </div>
            </div>
        </div>

        <div class="sidebar">
            </div>
        </div>
    </div>

    <script>
        const sidingTypes = {
            vinyl: { materialLow: 3, materialHigh: 8, laborLow: 2, laborHigh: 4 },
            fiber: { materialLow: 6, materialHigh: 12, laborLow: 4, laborHigh: 8 },
            wood: { materialLow: 8, materialHigh: 15, laborLow: 5, laborHigh: 10 },
            aluminum: { materialLow: 4, materialHigh: 8, laborLow: 3, laborHigh: 5 },
            steel: { materialLow: 5, materialHigh: 12, laborLow: 4, laborHigh: 7 },
            stucco: { materialLow: 6, materialHigh: 10, laborLow: 5, laborHigh: 9 }
        };

        let currentType = 'vinyl';

        function setType(type, btn) {
            currentType = type;
            document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            calculate();
        }

        function calculate() {
            const height = parseFloat(document.getElementById('height').value) || 0;
            const length = parseFloat(document.getElementById('length').value) || 0;
            const gables = parseFloat(document.getElementById('gables').value) || 0;
            const openings = parseFloat(document.getElementById('openings').value) || 0;
            
            const wallArea = height * length;
            const totalArea = wallArea + gables - openings;
            const squares = totalArea / 100;
            
            // Add 10% for waste
            const orderArea = totalArea * 1.1;
            
            const type = sidingTypes[currentType];
            const materialAvg = (type.materialLow + type.materialHigh) / 2;
            const laborAvg = (type.laborLow + type.laborHigh) / 2;
            
            const sidingCost = orderArea * materialAvg;
            const wrapCost = totalArea * 0.50; // House wrap
            const trimCost = totalArea * 1.50; // Trim, corners, J-channels
            const laborCost = totalArea * laborAvg;
            
            const totalCost = sidingCost + wrapCost + trimCost + laborCost;
            const materialOnly = sidingCost + wrapCost + trimCost;
            
            document.getElementById('totalSqFt').textContent = Math.round(totalArea).toLocaleString();
            document.getElementById('squares').textContent = squares.toFixed(1);
            document.getElementById('materialCost').textContent = '$' + Math.round(materialOnly).toLocaleString();
            document.getElementById('totalCost').textContent = '$' + Math.round(totalCost).toLocaleString();
            
            document.getElementById('sidingCost').textContent = '$' + Math.round(sidingCost).toLocaleString();
            document.getElementById('wrapCost').textContent = '$' + Math.round(wrapCost).toLocaleString();
            document.getElementById('trimCost').textContent = '$' + Math.round(trimCost).toLocaleString();
            document.getElementById('laborCost').textContent = '$' + Math.round(laborCost).toLocaleString();
            document.getElementById('grandTotal').innerHTML = '<strong>$' + Math.round(totalCost).toLocaleString() + '</strong>';
        }
        
        calculate();
    </script>
</body>
