            <div class="card">
                <h2>📅 Enter First Day of Last Period</h2>
                <div class="form-group">
                    <label>First Day of Last Menstrual Period (LMP)</label>
                    <input type="date" id="lmpDate" oninput="calculate()">
                </div>

                <div class="result-hero">
                    <div class="result-hero-label">Estimated Due Date</div>
                    <div class="result-hero-value" id="dueDate">--</div>
                </div>

                <div class="progress-container">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                        <span>Pregnancy Progress</span>
                        <span id="progressPct">0%</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
                    </div>
                </div>

                    <div class="result-card">
                        <div class="result-value" id="currentWeek">Week 0</div>

                    </div>
                    <div class="result-card">
                        <div class="result-value" id="trimester">--</div>
                        <div class="result-label">Trimester</div>
                    </div>
                    <div class="result-card">
                        <div class="result-value" id="daysRemaining">0</div>
                        <div class="result-label">Days Remaining</div>
                    </div>
                    <div class="result-card">
                        <div class="result-value" id="weeksRemaining">0</div>
                        <div class="result-label">Weeks Remaining</div>
                    </div>
                </div>

    <script>
        const today = new Date();
        const defaultLMP = new Date(today);
        defaultLMP.setDate(today.getDate() - 84);
        document.getElementById('lmpDate').value = defaultLMP.toISOString().split('T')[0];

        function calculate() {
            const lmpInput = document.getElementById('lmpDate').value;
            if (!lmpInput) return;

            const lmp = new Date(lmpInput);
            const dueDate = new Date(lmp);
            dueDate.setDate(lmp.getDate() + 280);

            const today = new Date();
            const daysSinceLMP = Math.floor((today - lmp) / (1000 * 60 * 60 * 24));
            const weeksPregnant = Math.floor(daysSinceLMP / 7);
            const daysInWeek = daysSinceLMP % 7;
            const daysRemaining = Math.max(0, Math.floor((dueDate - today) / (1000 * 60 * 60 * 24)));
            const weeksRemaining = Math.floor(daysRemaining / 7);
            const progressPct = Math.min(100, (daysSinceLMP / 280) * 100);

            let trimester = '1st Trimester';
            if (weeksPregnant >= 28) trimester = '3rd Trimester';
            else if (weeksPregnant >= 13) trimester = '2nd Trimester';

            const options = { month: 'long', day: 'numeric', year: 'numeric' };
            document.getElementById('dueDate').textContent = dueDate.toLocaleDateString('en-US', options);
            document.getElementById('currentWeek').textContent = 'Week ' + weeksPregnant + ', Day ' + daysInWeek;
            document.getElementById('trimester').textContent = trimester;
            document.getElementById('daysRemaining').textContent = daysRemaining + ' days';
            document.getElementById('weeksRemaining').textContent = weeksRemaining + ' weeks';
            document.getElementById('progressPct').textContent = progressPct.toFixed(0) + '%';
            document.getElementById('progressFill').style.width = progressPct + '%';

            const milestones = [
                { week: 8, label: 'First Prenatal Visit' },
                { week: 12, label: 'End of 1st Trimester' },
                { week: 20, label: 'Anatomy Scan' },
                { week: 24, label: 'Viability Milestone' },
                { week: 28, label: 'Start of 3rd Trimester' },
                { week: 37, label: 'Full Term Begins' },
                { week: 40, label: 'Due Date' }
            ];

            let milestonesHtml = '';
            milestones.forEach(m => {
                const mDate = new Date(lmp);
                mDate.setDate(lmp.getDate() + m.week * 7);
                const status = weeksPregnant >= m.week ? '✅' : '⏳';
                milestonesHtml += '<div class="breakdown-row"><span>' + status + ' Week ' + m.week + ' - ' + m.label + '</span><span>' + mDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + '</span></div>';
            });
            document.getElementById('milestones').innerHTML = milestonesHtml;
        }
        calculate();
    </script>
