    <style>
        :root { --primary: #6366f1; --primary-dark: #4f46e5; --secondary: #22d3ee; --accent: #f59e0b; --bg-dark: #0f172a; --bg-card: #1e293b; --bg-input: #334155; --text-primary: #f1f5f9; --text-secondary: #94a3b8; --border: #475569; --success: #10b981; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg-dark); color: var(--text-primary); min-height: 100vh; line-height: 1.6; }
        .ad-container { background: var(--bg-card); padding: 10px; text-align: center; margin: 10px 0; border-radius: 8px; }
        .ad-label { font-size: 10px; color: var(--text-secondary); margin-bottom: 5px; }
        .header { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); padding: 40px 20px; text-align: center; }
        .header h1 { font-size: 2.5rem; margin-bottom: 10px; }
        .main-container { max-width: 1200px; margin: 0 auto; padding: 20px; display: grid; grid-template-columns: 1fr 160px; gap: 20px; }
        .content-area { display: flex; flex-direction: column; gap: 20px; }
        .sidebar { display: flex; flex-direction: column; gap: 20px; }
        .card { background: var(--bg-card); border-radius: 16px; padding: 24px; }
        .card h2 { color: var(--secondary); margin-bottom: 20px; font-size: 1.3rem; }
        .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: var(--text-secondary); }
        input, select { width: 100%; padding: 15px; border: 2px solid var(--border); border-radius: 10px; font-size: 1rem; background: var(--bg-input); color: var(--text-primary); }
        input:focus, select:focus { outline: none; border-color: var(--primary); }
        .result-hero { background: linear-gradient(135deg, var(--success), #059669); padding: 35px; border-radius: 16px; text-align: center; margin: 20px 0; }
        .result-hero-value { font-size: 3rem; font-weight: 800; color: white; }
        .result-hero-label { color: rgba(255,255,255,0.8); font-size: 1.1rem; }
        .results-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-top: 20px; }
        .result-card { background: var(--bg-input); padding: 20px; border-radius: 12px; text-align: center; }
        .result-value { font-size: 1.4rem; font-weight: 700; color: var(--secondary); }
        .result-label { color: var(--text-secondary); margin-top: 5px; font-size: 0.85rem; }
        .comparison { margin-top: 20px; }
        .comparison-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 10px; }
        .comparison-item { background: var(--bg-input); padding: 15px; border-radius: 10px; display: flex; justify-content: space-between; }
        .related-tools { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-top: 15px; }
        .related-link { display: block; padding: 12px 16px; background: var(--bg-input); border-radius: 8px; color: var(--text-primary); text-decoration: none; }
        .related-link:hover { background: var(--primary); }
        @media (max-width: 968px) { .main-container { grid-template-columns: 1fr; } .sidebar { display: none; } }
        @media (max-width: 640px) { .form-grid { grid-template-columns: 1fr; } .results-grid { grid-template-columns: repeat(2, 1fr); } .comparison-row { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="ad-container">
        <div class="ad-label">Advertisement</div>
        <script type="text/javascript">atOptions = { 'key': 'b43e7cf5057864a264961884e1f34530', 'format': 'iframe', 'height': 90, 'width': 728, 'params': {} };</script>
        <script type="text/javascript" src="//www.highperformanceformat.com/b43e7cf5057864a264961884e1f34530/invoke.js"></script>
    </div>
    <div class="ad-container" style="display: none;">
        <div class="ad-label">Advertisement</div>
        <script type="text/javascript">atOptions = { 'key': '9f6b66d433cad4c02b643bdd4b7eefc0', 'format': 'iframe', 'height': 50, 'width': 320, 'params': {} };</script>
        <script type="text/javascript" src="//www.highperformanceformat.com/9f6b66d433cad4c02b643bdd4b7eefc0/invoke.js"></script>
    </div>
    <style>@media (max-width: 728px) { .ad-container:first-child { display: none !important; } .ad-container:nth-child(2) { display: block !important; } }</style>
    
    <header class="header">
        <h1>💰 Hourly to Salary Calculator</h1>
    </header>

    <div class="main-container">
        <div class="content-area">
            <div class="card">
                <h2>⏰ Your Hourly Rate</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Hourly Wage ($)</label>
                        <input type="number" id="hourlyRate" value="25" step="0.25" oninput="calculate()">
                    </div>
                    <div class="form-group">
                        <label>Hours Per Week</label>
                        <input type="number" id="hoursPerWeek" value="40" oninput="calculate()">
                    </div>
                    <div class="form-group">
                        <label>Weeks Per Year</label>
                        <input type="number" id="weeksPerYear" value="52" oninput="calculate()">
                    </div>
                    <div class="form-group">
                        <label>Vacation Weeks (Unpaid)</label>
                        <input type="number" id="vacationWeeks" value="2" oninput="calculate()">
                    </div>
                </div>
                
                <div class="result-hero">
                    <div class="result-hero-value" id="annualSalary">$0</div>
                    <div class="result-hero-label">Annual Salary</div>
                </div>
                
                <div class="results-grid">
                    <div class="result-card">
                        <div class="result-value" id="monthly">$0</div>
                        <div class="result-label">Monthly</div>
                    </div>
                    <div class="result-card">
                        <div class="result-value" id="biweekly">$0</div>
                        <div class="result-label">Bi-Weekly</div>
                    </div>
                    <div class="result-card">
                        <div class="result-value" id="weekly">$0</div>
                        <div class="result-label">Weekly</div>
                    </div>
                    <div class="result-card">
                        <div class="result-value" id="daily">$0</div>
                        <div class="result-label">Daily</div>
                    </div>
                </div>
            </div>

            <div class="card">
                <h2>📊 Compare Hourly Rates</h2>
                <div class="comparison" id="comparison"></div>
            </div>

            <div class="ad-container">
                <div class="ad-label">Advertisement</div>
                <script type="text/javascript">atOptions = { 'key': 'ee368c7cdf94f06bc71fdf57fe4124b8', 'format': 'iframe', 'height': 250, 'width': 300, 'params': {} };</script>
                <script type="text/javascript" src="//www.highperformanceformat.com/ee368c7cdf94f06bc71fdf57fe4124b8/invoke.js"></script>
            </div>

            <div class="card">
                <h2>🔗 Related Tools</h2>
                <div class="related-tools">
                    <a href="salary-calculator.html" class="related-link">💵 Salary Calculator</a>
                    <a href="paycheck-calculator.html" class="related-link">💰 Paycheck Calculator</a>
                    <a href="overtime-calculator.html" class="related-link">⏰ Overtime Calculator</a>
                    <a href="tax-bracket-calculator.html" class="related-link">📋 Tax Brackets</a>
                </div>
            </div>
        </div>

        <div class="sidebar">
            <div class="ad-container">
                <div class="ad-label">Advertisement</div>
                <script type="text/javascript">atOptions = { 'key': 'd4702b3e9743f9cd914a00e5026493f3', 'format': 'iframe', 'height': 600, 'width': 160, 'params': {} };</script>
                <script type="text/javascript" src="//www.highperformanceformat.com/d4702b3e9743f9cd914a00e5026493f3/invoke.js"></script>
            </div>
        </div>
    </div>

    <script>
        function calculate() {
            const hourlyRate = parseFloat(document.getElementById('hourlyRate').value) || 0;
            const hoursPerWeek = parseFloat(document.getElementById('hoursPerWeek').value) || 0;
            const weeksPerYear = parseFloat(document.getElementById('weeksPerYear').value) || 52;
            const vacationWeeks = parseFloat(document.getElementById('vacationWeeks').value) || 0;
            
            const workWeeks = weeksPerYear - vacationWeeks;
            const annualSalary = hourlyRate * hoursPerWeek * workWeeks;
            const monthly = annualSalary / 12;
            const biweekly = annualSalary / 26;
            const weekly = hourlyRate * hoursPerWeek;
            const daily = weekly / 5;
            
            document.getElementById('annualSalary').textContent = '$' + annualSalary.toLocaleString(undefined, {maximumFractionDigits: 0});
            document.getElementById('monthly').textContent = '$' + monthly.toLocaleString(undefined, {maximumFractionDigits: 0});
            document.getElementById('biweekly').textContent = '$' + biweekly.toLocaleString(undefined, {maximumFractionDigits: 0});
            document.getElementById('weekly').textContent = '$' + weekly.toLocaleString(undefined, {maximumFractionDigits: 0});
            document.getElementById('daily').textContent = '$' + daily.toLocaleString(undefined, {maximumFractionDigits: 0});
            
            // Generate comparison
            const rates = [15, 20, 25, 30, 35, 40, 50, 75, 100];
            let compHtml = '';
            for (let i = 0; i < rates.length; i += 2) {
                compHtml += '<div class="comparison-row">';
                for (let j = i; j < Math.min(i + 2, rates.length); j++) {
                    const rate = rates[j];
                    const annual = rate * hoursPerWeek * workWeeks;
                    const isCurrent = Math.abs(rate - hourlyRate) < 0.5;
                    compHtml += `<div class="comparison-item" style="${isCurrent ? 'background: var(--primary);' : ''}">
                        <span>$${rate}/hr</span>
                        <span style="font-weight: 700;">$${annual.toLocaleString()}/yr</span>
                    </div>`;
                }
                compHtml += '</div>';
            }
            document.getElementById('comparison').innerHTML = compHtml;
        }
        
        calculate();
    </script>
</body>
</html>
