    <header class="header">
        <h1>🍽️ Tip Calculator</h1>

    <div class="main-container">
        <div class="content-area">
            <div class="card">
                <h2>💵 Calculate Your Tip</h2>
                <div class="form-group">
                    <label>Bill Amount ($)</label>
                    <input type="number" id="billAmount" value="85" step="0.01" oninput="calculate()">
                </div>
                
                <label style="display: block; margin-bottom: 10px; color: var(--text-secondary);">Tip Percentage</label>
                <div class="tip-buttons">
                    <button class="tip-btn" onclick="setTip(10)">10%</button>
                    <button class="tip-btn" onclick="setTip(15)">15%</button>
                    <button class="tip-btn" onclick="setTip(18)">18%</button>
                    <button class="tip-btn active" onclick="setTip(20)">20%</button>
                    <button class="tip-btn" onclick="setTip(25)">25%</button>
                </div>
                
                <div class="form-grid">
                    <div class="form-group">
                        <label>Custom Tip (%)</label>
                        <input type="number" id="tipPercent" value="20" step="1" oninput="calculate()">
                    </div>
                    <div class="form-group">
                        <label>Split Between</label>
                        <input type="number" id="splitCount" value="1" min="1" oninput="calculate()">
                    </div>
                </div>

                <div class="result-hero">
                    <div class="result-hero-label">Total Per Person</div>
                    <div class="result-hero-value" id="perPerson">$0</div>
                </div>

                <div class="results-grid">
                    <div class="result-card">
                        <div class="result-value" id="tipAmount">$0</div>
                        <div class="result-label">Tip Amount</div>
                    </div>
                    <div class="result-card">
                        <div class="result-value" id="totalBill">$0</div>
                        <div class="result-label">Total Bill</div>
                    </div>
                    <div class="result-card">
                        <div class="result-value" id="tipPerPerson">$0</div>
                        <div class="result-label">Tip Per Person</div>
                    </div>
                    <div class="result-card">
                        <div class="result-value" id="billPerPerson">$0</div>
                        <div class="result-label">Bill Per Person</div>
                    </div>
                </div>
            </div>

            <div class="card">
                <h2>📊 Tip Comparison</h2>
                <div id="tipComparison"></div>
            </div>

    <script>
        function setTip(pct) {
            document.getElementById('tipPercent').value = pct;
            document.querySelectorAll('.tip-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            calculate();
        }

        function calculate() {
            const bill = parseFloat(document.getElementById('billAmount').value) || 0;
            const tipPct = parseFloat(document.getElementById('tipPercent').value) / 100 || 0;
            const split = parseInt(document.getElementById('splitCount').value) || 1;

            const tipAmount = bill * tipPct;
            const totalBill = bill + tipAmount;
            const perPerson = totalBill / split;
            const tipPerPerson = tipAmount / split;
            const billPerPerson = bill / split;

            document.getElementById('perPerson').textContent = '$' + perPerson.toFixed(2);
            document.getElementById('tipAmount').textContent = '$' + tipAmount.toFixed(2);
            document.getElementById('totalBill').textContent = '$' + totalBill.toFixed(2);
            document.getElementById('tipPerPerson').textContent = '$' + tipPerPerson.toFixed(2);
            document.getElementById('billPerPerson').textContent = '$' + billPerPerson.toFixed(2);

            const tips = [10, 15, 18, 20, 25, 30];
            let compHtml = '';
            tips.forEach(t => {
                const tip = bill * (t / 100);
                const total = bill + tip;
                compHtml += '<div class="breakdown-row"><span>' + t + '%</span><span>Tip: $' + tip.toFixed(2) + '</span><span>Total: $' + total.toFixed(2) + '</span></div>';
            });
            document.getElementById('tipComparison').innerHTML = compHtml;
        }
        calculate();
    </script>
