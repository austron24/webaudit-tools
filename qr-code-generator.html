    <header class="header">
        <h1>📱 QR Code Generator</h1>
        <p>Create QR codes instantly for URLs, text, WiFi, and more. Free and easy to use.</p>
    </header>

    <div class="main-container">
        <div class="content-area">
            <div class="card">
                <h2>🔲 Create QR Code</h2>
                <div class="qr-container">
                    <div>
                        <div class="type-tabs">
                            <div class="type-tab active" onclick="setType('url')">🔗 URL</div>
                            <div class="type-tab" onclick="setType('text')">📝 Text</div>
                            <div class="type-tab" onclick="setType('wifi')">📶 WiFi</div>
                            <div class="type-tab" onclick="setType('email')">✉️ Email</div>
                        </div>
                        
                        <div id="urlForm" class="type-content active">
                            <div class="form-group">
                                <label>Website URL</label>
                                <input type="url" id="urlInput" placeholder="https://example.com" oninput="generate()">
                            </div>
                        </div>
                        
                        <div id="textForm" class="type-content">
                            <div class="form-group">
                                <label>Text Content</label>
                                <textarea id="textInput" placeholder="Enter any text here..." oninput="generate()"></textarea>
                            </div>
                        </div>
                        
                        <div id="wifiForm" class="type-content">
                            <div class="form-group">
                                <label>Network Name (SSID)</label>
                                <input type="text" id="ssid" placeholder="My WiFi Network" oninput="generate()">
                            </div>
                            <div class="form-group">
                                <label>Password</label>
                                <input type="text" id="wifiPassword" placeholder="WiFi password" oninput="generate()">
                            </div>
                            <div class="form-group">
                                <label>Encryption</label>
                                <select id="encryption" onchange="generate()">
                                    <option value="WPA">WPA/WPA2</option>
                                    <option value="WEP">WEP</option>
                                    <option value="nopass">None</option>
                                </select>
                            </div>
                        </div>
                        
                        <div id="emailForm" class="type-content">
                            <div class="form-group">
                                <label>Email Address</label>
                                <input type="email" id="emailAddress" placeholder="email@example.com" oninput="generate()">
                            </div>
                            <div class="form-group">
                                <label>Subject (optional)</label>
                                <input type="text" id="emailSubject" placeholder="Email subject" oninput="generate()">
                            </div>
                        </div>
                        
                        <button class="generate-btn" onclick="generate()">Generate QR Code</button>
                    </div>
                    
                    <div class="qr-display">
                        <div id="qrcode"></div>
                        <button class="download-btn" onclick="downloadQR()">📥 Download PNG</button>
                    </div>
                </div>
            </div>

            </div>
            </div>

    </div>

    <script>
        let currentType = 'url';
        let qr = null;

        function setType(type) {
            currentType = type;
            document.querySelectorAll('.type-tab').forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');
            document.querySelectorAll('.type-content').forEach(form => form.classList.remove('active'));
            document.getElementById(type + 'Form').classList.add('active');
            generate();
        }

        function getContent() {
            switch (currentType) {
                case 'url':
                    return document.getElementById('urlInput').value || 'https://example.com';
                case 'text':
                    return document.getElementById('textInput').value || 'Hello World';
                case 'wifi':
                    const ssid = document.getElementById('ssid').value;
                    const password = document.getElementById('wifiPassword').value;
                    const encryption = document.getElementById('encryption').value;
                    return `WIFI:T:${encryption};S:${ssid};P:${password};;`;
                case 'email':
                    const email = document.getElementById('emailAddress').value;
                    const subject = document.getElementById('emailSubject').value;
                    return subject ? `mailto:${email}?subject=${encodeURIComponent(subject)}` : `mailto:${email}`;
                default:
                    return 'https://example.com';
            }
        }

        function generate() {
            const content = getContent();
            const container = document.getElementById('qrcode');
            container.innerHTML = '';
            
            qr = new QRCode(container, {
                text: content,
                width: 200,
                height: 200,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });
        }

        function downloadQR() {
            const canvas = document.querySelector('#qrcode canvas');
            if (canvas) {
                const link = document.createElement('a');
                link.download = 'qrcode.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            }
        }

        generate();
    </script>
