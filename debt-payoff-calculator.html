    <style>
        :root { --primary: #dc2626; --primary-dark: #b91c1c; --secondary: #22d3ee; --accent: #f59e0b; --bg-dark: #0f172a; --bg-card: #1e293b; --bg-input: #334155; --text-primary: #f1f5f9; --text-secondary: #94a3b8; --border: #475569; --success: #10b981; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg-dark); color: var(--text-primary); min-height: 100vh; line-height: 1.6; }
        .ad-container { background: var(--bg-card); padding: 10px; text-align: center; margin: 10px 0; border-radius: 8px; }
        .ad-label { font-size: 10px; color: var(--text-secondary); margin-bottom: 5px; }

        .header h1 { font-size: 2.5rem; margin-bottom: 10px; }
        .main-container { max-width: 1200px; margin: 0 auto; padding: 20px; display: grid; grid-template-columns: 1fr 160px; gap: 20px; }
        .content-area { display: flex; flex-direction: column; gap: 20px; }
        .sidebar { display: flex; flex-direction: column; gap: 20px; }
        .card { background: var(--bg-card); border-radius: 16px; padding: 24px; }
        .card h2 { color: var(--secondary); margin-bottom: 20px; font-size: 1.3rem; }
        .form-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 8px; color: var(--text-secondary); font-size: 0.9rem; }
        input, select { width: 100%; padding: 12px; border: 2px solid var(--border); border-radius: 10px; font-size: 1rem; background: var(--bg-input); color: var(--text-primary); }
        input:focus, select:focus { outline: none; border-color: var(--primary); }
        .result-hero { background: linear-gradient(135deg, var(--success), #059669); padding: 35px; border-radius: 16px; text-align: center; margin: 20px 0; }
        .result-hero-value { font-size: 3rem; font-weight: 800; color: white; }
        .result-hero-label { color: rgba(255,255,255,0.8); }
        .results-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-top: 20px; }
        .result-card { background: var(--bg-input); padding: 20px; border-radius: 12px; text-align: center; }
        .result-value { font-size: 1.3rem; font-weight: 700; color: var(--secondary); }
        .result-label { color: var(--text-secondary); margin-top: 5px; font-size: 0.85rem; }
        .debt-list { margin-top: 15px; }
        .debt-item { display: grid; grid-template-columns: 1fr auto auto auto auto; gap: 10px; padding: 15px; background: var(--bg-input); border-radius: 8px; margin-bottom: 10px; align-items: center; }
        .add-btn { padding: 12px 24px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; }
        .remove-btn { padding: 8px 12px; background: var(--bg-dark); color: var(--text-secondary); border: none; border-radius: 6px; cursor: pointer; }
        .related-tools { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-top: 15px; }
        .related-link { display: block; padding: 12px 16px; background: var(--bg-input); border-radius: 8px; color: var(--text-primary); text-decoration: none; }
        .related-link:hover { background: var(--primary); }
        @media (max-width: 968px) { .main-container { grid-template-columns: 1fr; } .sidebar { display: none; } }
        @media (max-width: 640px) { .form-grid, .results-grid { grid-template-columns: 1fr 1fr; } .debt-item { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="ad-container">
        <div class="ad-label">Advertisement</div>
        <script type="text/javascript">atOptions = { 'key': 'b43e7cf5057864a264961884e1f34530', 'format': 'iframe', 'height': 90, 'width': 728, 'params': {} };</script>
        <script type="text/javascript" src="//www.highperformanceformat.com/b43e7cf5057864a264961884e1f34530/invoke.js"></script>
    </div>
    <div class="ad-container" style="display: none;">
        <div class="ad-label">Advertisement</div>
        <script type="text/javascript">atOptions = { 'key': '9f6b66d433cad4c02b643bdd4b7eefc0', 'format': 'iframe', 'height': 50, 'width': 320, 'params': {} };</script>
        <script type="text/javascript" src="//www.highperformanceformat.com/9f6b66d433cad4c02b643bdd4b7eefc0/invoke.js"></script>
    </div>
    <style>@media (max-width: 728px) { .ad-container:first-child { display: none !important; } .ad-container:nth-child(2) { display: block !important; } }</style>
    
    <header class="header">
        <h1>💳 Debt Payoff Calculator</h1>
    </header>

    <div class="main-container">
        <div class="content-area">
            <div class="card">
                <h2>📝 Your Debts</h2>
                <div id="debtList">
                    <div class="debt-item">
                        <input type="text" placeholder="Name" value="Credit Card 1">
                        <input type="number" placeholder="Balance" value="5000" style="width: 120px;">
                        <input type="number" placeholder="APR %" value="22" style="width: 80px;">
                        <input type="number" placeholder="Min Payment" value="100" style="width: 100px;">
                        <button class="remove-btn" onclick="removeDebt(this)">✕</button>
                    </div>
                    <div class="debt-item">
                        <input type="text" placeholder="Name" value="Credit Card 2">
                        <input type="number" placeholder="Balance" value="3000" style="width: 120px;">
                        <input type="number" placeholder="APR %" value="18" style="width: 80px;">
                        <input type="number" placeholder="Min Payment" value="60" style="width: 100px;">
                        <button class="remove-btn" onclick="removeDebt(this)">✕</button>
                    </div>
                    <div class="debt-item">
                        <input type="text" placeholder="Name" value="Car Loan">
                        <input type="number" placeholder="Balance" value="12000" style="width: 120px;">
                        <input type="number" placeholder="APR %" value="6" style="width: 80px;">
                        <input type="number" placeholder="Min Payment" value="300" style="width: 100px;">
                        <button class="remove-btn" onclick="removeDebt(this)">✕</button>
                    </div>
                </div>
                <button class="add-btn" onclick="addDebt()" style="margin-top: 15px;">+ Add Debt</button>
                
                <div class="form-grid" style="margin-top: 20px; grid-template-columns: 1fr 1fr;">
                    <div class="form-group">
                        <label>Extra Monthly Payment ($)</label>
                        <input type="number" id="extraPayment" value="200" oninput="calculate()">
                    </div>
                    <div class="form-group">
                        <label>Payoff Strategy</label>
                        <select id="strategy" onchange="calculate()">
                            <option value="avalanche" selected>Avalanche (Highest Interest First)</option>
                            <option value="snowball">Snowball (Lowest Balance First)</option>
                        </select>
                    </div>
                </div>
                
                <div class="result-hero">
                    <div class="result-hero-label">Debt-Free In</div>
                    <div class="result-hero-value" id="payoffTime">0 months</div>
                </div>
                
                <div class="results-grid">
                    <div class="result-card">
                        <div class="result-value" id="totalDebt">$0</div>
                        <div class="result-label">Total Debt</div>
                    </div>
                    <div class="result-card">
                        <div class="result-value" id="totalInterest">$0</div>
                        <div class="result-label">Total Interest</div>
                    </div>
                    <div class="result-card">
                        <div class="result-value" id="monthlyPayment">$0</div>
                        <div class="result-label">Monthly Payment</div>
                    </div>
                    <div class="result-card">
                        <div class="result-value" id="interestSaved">$0</div>
                        <div class="result-label">Interest Saved</div>
                    </div>
                </div>
            </div>

            <div class="ad-container">
                <div class="ad-label">Advertisement</div>

                <script type="text/javascript" src="//www.highperformanceformat.com/ee368c7cdf94f06bc71fdf57fe4124b8/invoke.js"></script>
            </div>

            <div class="card">
                <h2>🔗 Related Tools</h2>
                <div class="related-tools">
                    <a href="loan-calculator.html" class="related-link">🏦 Loan Calculator</a>
                    <a href="budget-calculator.html" class="related-link">📊 Budget Planner</a>
                    <a href="savings-goal-calculator.html" class="related-link">💰 Savings Goal</a>
                    <a href="credit-card-payoff-calculator.html" class="related-link">💳 Credit Card Payoff</a>
                </div>
            </div>
        </div>

        <div class="sidebar">
            <div class="ad-container">
                <div class="ad-label">Advertisement</div>
                <script type="text/javascript">atOptions = { 'key': 'd4702b3e9743f9cd914a00e5026493f3', 'format': 'iframe', 'height': 600, 'width': 160, 'params': {} };</script>
                <script type="text/javascript" src="//www.highperformanceformat.com/d4702b3e9743f9cd914a00e5026493f3/invoke.js"></script>
            </div>
        </div>
    </div>

    <script>
        function addDebt() {
            const list = document.getElementById('debtList');
            const item = document.createElement('div');
            item.className = 'debt-item';
            item.innerHTML = `
                <input type="text" placeholder="Name" value="New Debt">
                <input type="number" placeholder="Balance" value="1000" style="width: 120px;">
                <input type="number" placeholder="APR %" value="15" style="width: 80px;">
                <input type="number" placeholder="Min Payment" value="50" style="width: 100px;">
                <button class="remove-btn" onclick="removeDebt(this)">✕</button>
            `;
            list.appendChild(item);
            calculate();
        }
        
        function removeDebt(btn) {
            btn.parentElement.remove();
            calculate();
        }
        
        function getDebts() {
            const items = document.querySelectorAll('.debt-item');
            return Array.from(items).map(item => {
                const inputs = item.querySelectorAll('input');
                return {
                    name: inputs[0].value,
                    balance: parseFloat(inputs[1].value) || 0,
                    apr: parseFloat(inputs[2].value) || 0,
                    minPayment: parseFloat(inputs[3].value) || 0
                };
            });
        }
        
        function calculate() {
            const debts = getDebts();
            const extraPayment = parseFloat(document.getElementById('extraPayment').value) || 0;
            const strategy = document.getElementById('strategy').value;
            
            const totalDebt = debts.reduce((sum, d) => sum + d.balance, 0);
            const minPayments = debts.reduce((sum, d) => sum + d.minPayment, 0);
            const monthlyPayment = minPayments + extraPayment;
            
            let workingDebts = debts.map(d => ({...d}));
            let months = 0;
            let totalInterest = 0;
            const maxMonths = 600;
            
            while (workingDebts.some(d => d.balance > 0) && months < maxMonths) {
                months++;
                
                if (strategy === 'avalanche') {
                    workingDebts.sort((a, b) => b.apr - a.apr);
                } else {
                    workingDebts.sort((a, b) => a.balance - b.balance);
                }
                
                let availableExtra = extraPayment;
                
                workingDebts.forEach(debt => {
                    if (debt.balance > 0) {
                        const monthlyRate = debt.apr / 100 / 12;
                        const interest = debt.balance * monthlyRate;
                        totalInterest += interest;
                        debt.balance += interest;
                        
                        let payment = debt.minPayment;
                        if (debt === workingDebts.find(d => d.balance > 0)) {
                            payment += availableExtra;
                            availableExtra = 0;
                        }
                        
                        const actualPayment = Math.min(payment, debt.balance);
                        debt.balance -= actualPayment;
                        
                        if (debt.balance < 0.01) {
                            debt.balance = 0;
                        }
                    }
                });
            }
            
            let minOnlyMonths = 0;
            let minOnlyInterest = 0;
            let minDebts = debts.map(d => ({...d}));
            while (minDebts.some(d => d.balance > 0) && minOnlyMonths < maxMonths) {
                minOnlyMonths++;
                minDebts.forEach(debt => {
                    if (debt.balance > 0) {
                        const interest = debt.balance * (debt.apr / 100 / 12);
                        minOnlyInterest += interest;
                        debt.balance += interest - debt.minPayment;
                        if (debt.balance < 0) debt.balance = 0;
                    }
                });
            }
            
            const interestSaved = Math.max(0, minOnlyInterest - totalInterest);
            
            const years = Math.floor(months / 12);
            const remainingMonths = months % 12;
            const timeText = years > 0 ? `${years}y ${remainingMonths}m` : `${months} months`;
            
            document.getElementById('payoffTime').textContent = timeText;
            document.getElementById('totalDebt').textContent = '$' + Math.round(totalDebt).toLocaleString();
            document.getElementById('totalInterest').textContent = '$' + Math.round(totalInterest).toLocaleString();
            document.getElementById('monthlyPayment').textContent = '$' + Math.round(monthlyPayment).toLocaleString();
            document.getElementById('interestSaved').textContent = '$' + Math.round(interestSaved).toLocaleString();
        }
        
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('input', calculate);
        });
        
        calculate();
    </script>
</body>
