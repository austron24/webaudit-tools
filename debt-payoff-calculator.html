    <style>
        :root { --primary: #6366f1; --primary-dark: #4f46e5; --secondary: #22d3ee; --accent: #f59e0b; --bg-dark: #0f172a; --bg-card: #1e293b; --bg-input: #334155; --text-primary: #f1f5f9; --text-secondary: #94a3b8; --border: #475569; --success: #10b981; --error: #ef4444; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg-dark); color: var(--text-primary); min-height: 100vh; line-height: 1.6; }
        .ad-container { background: var(--bg-card); padding: 10px; text-align: center; margin: 10px 0; border-radius: 8px; }
        .ad-label { font-size: 10px; color: var(--text-secondary); margin-bottom: 5px; }
        .header { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); padding: 40px 20px; text-align: center; }
        .header h1 { font-size: 2.5rem; margin-bottom: 10px; }
        .main-container { max-width: 1200px; margin: 0 auto; padding: 20px; display: grid; grid-template-columns: 1fr 160px; gap: 20px; }
        .content-area { display: flex; flex-direction: column; gap: 20px; }
        .sidebar { display: flex; flex-direction: column; gap: 20px; }
        .card { background: var(--bg-card); border-radius: 16px; padding: 24px; }
        .card h2 { color: var(--secondary); margin-bottom: 20px; font-size: 1.3rem; }
        .form-row { display: grid; grid-template-columns: repeat(3, 1fr) auto; gap: 10px; margin-bottom: 15px; align-items: end; }
        .form-group { margin-bottom: 0; }
        .form-group label { display: block; margin-bottom: 8px; color: var(--text-secondary); font-size: 0.9rem; }
        input { width: 100%; padding: 12px; border: 2px solid var(--border); border-radius: 8px; font-size: 1rem; background: var(--bg-input); color: var(--text-primary); }
        input:focus { outline: none; border-color: var(--primary); }
        .add-btn, .remove-btn { padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .add-btn { background: var(--success); color: white; }
        .remove-btn { background: var(--error); color: white; }
        .results-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 20px; }
        .result-card { background: var(--bg-input); padding: 25px; border-radius: 12px; text-align: center; }
        .result-card.highlight { background: linear-gradient(135deg, var(--success), #059669); }
        .result-value { font-size: 2rem; font-weight: 800; color: var(--secondary); }
        .result-card.highlight .result-value { color: white; }
        .result-label { color: var(--text-secondary); margin-top: 5px; }
        .result-card.highlight .result-label { color: rgba(255,255,255,0.8); }
        .extra-payment { margin-top: 20px; padding: 20px; background: var(--bg-input); border-radius: 12px; }
        .extra-payment h3 { color: var(--accent); margin-bottom: 15px; }
        .debt-list { margin-top: 15px; }
        .debt-item { background: var(--bg-input); padding: 15px; border-radius: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .related-tools { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-top: 15px; }
        .related-link { display: block; padding: 12px 16px; background: var(--bg-input); border-radius: 8px; color: var(--text-primary); text-decoration: none; }
        .related-link:hover { background: var(--primary); }
        @media (max-width: 968px) { .main-container { grid-template-columns: 1fr; } .sidebar { display: none; } }
        @media (max-width: 768px) { .form-row { grid-template-columns: 1fr; } .results-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="ad-container">
        <div class="ad-label">Advertisement</div>
        <script type="text/javascript">atOptions = { 'key': 'b43e7cf5057864a264961884e1f34530', 'format': 'iframe', 'height': 90, 'width': 728, 'params': {} };</script>
        <script type="text/javascript" src="//www.highperformanceformat.com/b43e7cf5057864a264961884e1f34530/invoke.js"></script>
    </div>
    <div class="ad-container" style="display: none;">
        <div class="ad-label">Advertisement</div>
        <script type="text/javascript">atOptions = { 'key': '9f6b66d433cad4c02b643bdd4b7eefc0', 'format': 'iframe', 'height': 50, 'width': 320, 'params': {} };</script>
        <script type="text/javascript" src="//www.highperformanceformat.com/9f6b66d433cad4c02b643bdd4b7eefc0/invoke.js"></script>
    </div>
    <style>@media (max-width: 728px) { .ad-container:first-child { display: none !important; } .ad-container:nth-child(2) { display: block !important; } }</style>
    
    <header class="header">
        <h1>💸 Debt Payoff Calculator</h1>
    </header>

    <div class="main-container">
        <div class="content-area">
            <div class="card">
                <h2>📝 Add Your Debts</h2>
                <div class="form-row">
                    <div class="form-group">
                        <label>Debt Name</label>
                        <input type="text" id="debtName" placeholder="Credit Card">
                    </div>
                    <div class="form-group">
                        <label>Balance ($)</label>
                        <input type="number" id="debtBalance" placeholder="5000">
                    </div>
                    <div class="form-group">
                        <label>Interest Rate (%)</label>
                        <input type="number" id="debtRate" placeholder="18" step="0.1">
                    </div>
                    <button class="add-btn" onclick="addDebt()">+ Add</button>
                </div>
                
                <div class="debt-list" id="debtList"></div>
                
                <div class="extra-payment">
                    <h3>💰 Extra Monthly Payment</h3>
                    <div class="form-group" style="margin-top: 10px;">
                        <label>Extra Amount to Put Toward Debt</label>
                        <input type="number" id="extraPayment" value="200" oninput="calculate()">
                    </div>
                </div>
                
                <div class="results-grid">
                    <div class="result-card">
                        <div class="result-value" id="totalDebt">$0</div>
                        <div class="result-label">Total Debt</div>
                    </div>
                    <div class="result-card highlight">
                        <div class="result-value" id="payoffTime">0 mo</div>
                        <div class="result-label">Time to Debt Free</div>
                    </div>
                    <div class="result-card">
                        <div class="result-value" id="totalInterest">$0</div>
                        <div class="result-label">Total Interest</div>
                    </div>
                </div>
            </div>

            <div class="ad-container">
                <div class="ad-label">Advertisement</div>
                <script type="text/javascript">atOptions = { 'key': 'ee368c7cdf94f06bc71fdf57fe4124b8', 'format': 'iframe', 'height': 250, 'width': 300, 'params': {} };</script>
                <script type="text/javascript" src="//www.highperformanceformat.com/ee368c7cdf94f06bc71fdf57fe4124b8/invoke.js"></script>
            </div>

            <div class="card">
                <h2>🔗 Related Tools</h2>
                <div class="related-tools">
                    <a href="loan-calculator.html" class="related-link">💳 Loan Calculator</a>
                    <a href="mortgage-calculator.html" class="related-link">🏠 Mortgage Calculator</a>
                    <a href="savings-goal-calculator.html" class="related-link">🎯 Savings Goal</a>
                    <a href="compound-interest-calculator.html" class="related-link">📈 Compound Interest</a>
                </div>
            </div>
        </div>

        <div class="sidebar">
            <div class="ad-container">
                <div class="ad-label">Advertisement</div>
                <script type="text/javascript">atOptions = { 'key': 'd4702b3e9743f9cd914a00e5026493f3', 'format': 'iframe', 'height': 600, 'width': 160, 'params': {} };</script>
                <script type="text/javascript" src="//www.highperformanceformat.com/d4702b3e9743f9cd914a00e5026493f3/invoke.js"></script>
            </div>
        </div>
    </div>

    <script>
        let debts = [
            { name: 'Credit Card', balance: 5000, rate: 18 },
            { name: 'Car Loan', balance: 12000, rate: 6 }
        ];
        
        function addDebt() {
            const name = document.getElementById('debtName').value || 'Debt';
            const balance = parseFloat(document.getElementById('debtBalance').value) || 0;
            const rate = parseFloat(document.getElementById('debtRate').value) || 0;
            
            if (balance > 0) {
                debts.push({ name, balance, rate });
                document.getElementById('debtName').value = '';
                document.getElementById('debtBalance').value = '';
                document.getElementById('debtRate').value = '';
                renderDebts();
                calculate();
            }
        }
        
        function removeDebt(index) {
            debts.splice(index, 1);
            renderDebts();
            calculate();
        }
        
        function renderDebts() {
            document.getElementById('debtList').innerHTML = debts.map((d, i) => `
                <div class="debt-item">
                    <div>
                        <strong>${d.name}</strong>
                        <div style="color: var(--text-secondary); font-size: 0.9rem;">
                            $${d.balance.toLocaleString()} at ${d.rate}% APR
                        </div>
                    </div>
                    <button class="remove-btn" onclick="removeDebt(${i})">×</button>
                </div>
            `).join('');
        }
        
        function calculate() {
            const extra = parseFloat(document.getElementById('extraPayment').value) || 0;
            
            if (debts.length === 0) {
                document.getElementById('totalDebt').textContent = '$0';
                document.getElementById('payoffTime').textContent = '0 mo';
                document.getElementById('totalInterest').textContent = '$0';
                return;
            }
            
            // Avalanche method (highest interest first)
            let debtsCopy = debts.map(d => ({ ...d }));
            debtsCopy.sort((a, b) => b.rate - a.rate);
            
            const totalDebt = debtsCopy.reduce((sum, d) => sum + d.balance, 0);
            let totalInterest = 0;
            let months = 0;
            const maxMonths = 360; // 30 years max
            
            while (debtsCopy.some(d => d.balance > 0) && months < maxMonths) {
                months++;
                let extraAvailable = extra;
                
                for (let debt of debtsCopy) {
                    if (debt.balance <= 0) continue;
                    
                    const monthlyRate = debt.rate / 100 / 12;
                    const interest = debt.balance * monthlyRate;
                    totalInterest += interest;
                    debt.balance += interest;
                    
                    // Apply extra payment to highest interest debt
                    if (extraAvailable > 0 && debt === debtsCopy.find(d => d.balance > 0)) {
                        const payment = Math.min(debt.balance, extraAvailable);
                        debt.balance -= payment;
                        extraAvailable -= payment;
                    }
                }
            }
            
            document.getElementById('totalDebt').textContent = '$' + totalDebt.toLocaleString(undefined, {maximumFractionDigits: 0});
            document.getElementById('payoffTime').textContent = months >= maxMonths ? '30+ years' : months + ' months';
            document.getElementById('totalInterest').textContent = '$' + totalInterest.toLocaleString(undefined, {maximumFractionDigits: 0});
        }
        
        renderDebts();
        calculate();
    </script>
</body>
