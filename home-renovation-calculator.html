    <header class="header">
        <h1>🏠 Home Renovation Calculator</h1>
    </header>

    <div class="main-container">
        <div class="content-area">
            <div class="card">
                <h2>🔨 Renovation Type</h2>
                <div class="room-grid">
                    <button class="room-btn active" onclick="setRoom('kitchen', this)">
                        <span class="emoji">🍳</span>Kitchen
                    </button>
                    <button class="room-btn" onclick="setRoom('bathroom', this)">
                        <span class="emoji">🚿</span>Bathroom
                    </button>
                    <button class="room-btn" onclick="setRoom('basement', this)">
                        <span class="emoji">🏗️</span>Basement
                    </button>
                    <button class="room-btn" onclick="setRoom('bedroom', this)">
                        <span class="emoji">🛏️</span>Bedroom
                    </button>
                    <button class="room-btn" onclick="setRoom('living', this)">
                        <span class="emoji">🛋️</span>Living Room
                    </button>
                    <button class="room-btn" onclick="setRoom('whole', this)">
                        <span class="emoji">🏡</span>Whole House
                    </button>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label>Room Size (sq ft)</label>
                        <input type="number" id="sqft" value="200" step="50" oninput="calculate()">
                    </div>
                    <div class="form-group">
                        <label>Quality Level</label>
                        <select id="quality" onchange="calculate()">
                            <option value="budget">Budget</option>
                            <option value="mid" selected>Mid-Range</option>
                            <option value="upscale">Upscale</option>
                            <option value="luxury">Luxury</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Location Factor</label>
                        <select id="location" onchange="calculate()">
                            <option value="0.8">Low Cost Area</option>
                            <option value="1.0" selected>Average</option>
                            <option value="1.3">High Cost City</option>
                            <option value="1.5">Major Metro (NYC, SF)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>DIY vs Contractor</label>
                        <select id="labor" onchange="calculate()">
                            <option value="0.6">Mostly DIY</option>
                            <option value="0.8">Some DIY</option>
                            <option value="1.0" selected>Full Contractor</option>
                        </select>
                    </div>
                </div>

                <div class="result-hero">
                    <div class="result-hero-label">Estimated Renovation Cost</div>
                    <div class="result-hero-value" id="totalCost">$0 - $0</div>
                </div>

                <div class="results-grid">
                    <div class="result-card">
                        <div class="result-value" id="perSqft">$0</div>
                        <div class="result-label">Per Square Foot</div>
                    </div>
                    <div class="result-card">
                        <div class="result-value" id="laborCost">$0</div>
                        <div class="result-label">Labor (~40%)</div>
                    </div>
                    <div class="result-card">
                        <div class="result-value" id="materialsCost">$0</div>
                        <div class="result-label">Materials (~60%)</div>
                    </div>
                </div>
            </div>

            <div class="card">
                <h2>📊 Typical Cost Breakdown</h2>
                <div id="breakdown"></div>
            </div>

            </div>

            <div class="card">
                <h2>🔗 Related Tools</h2>
                <div class="related-tools">
                    <a href="paint-calculator.html" class="related-link">🎨 Paint Calculator</a>
                    <a href="flooring-calculator.html" class="related-link">🏠 Flooring</a>
                    <a href="home-value-calculator.html" class="related-link">💰 Home Value</a>
                    <a href="mortgage-calculator.html" class="related-link">🏦 Mortgage</a>
                </div>
            </div>
        </div>

        <div class="sidebar">
            </div>
        </div>
    </div>

    <script>
        const roomData = {
            kitchen: { 
                baseLow: 75, baseHigh: 250,
                breakdown: [
                    ['Cabinets', '30-35%'],
                    ['Countertops', '10-15%'],
                    ['Appliances', '15-20%'],
                    ['Flooring', '10%'],
                    ['Plumbing/Fixtures', '5-10%'],
                    ['Labor', '20-35%']
                ]
            },
            bathroom: { 
                baseLow: 100, baseHigh: 350,
                breakdown: [
                    ['Tile/Flooring', '15-20%'],
                    ['Vanity/Cabinets', '15-20%'],
                    ['Shower/Tub', '15-25%'],
                    ['Fixtures', '10-15%'],
                    ['Plumbing', '10-15%'],
                    ['Labor', '25-35%']
                ]
            },
            basement: { 
                baseLow: 30, baseHigh: 100,
                breakdown: [
                    ['Framing/Drywall', '25-30%'],
                    ['Flooring', '15-20%'],
                    ['Electrical', '10-15%'],
                    ['Plumbing (if any)', '10-15%'],
                    ['HVAC', '10%'],
                    ['Labor', '25-35%']
                ]
            },
            bedroom: { 
                baseLow: 20, baseHigh: 80,
                breakdown: [
                    ['Flooring', '30-40%'],
                    ['Paint/Walls', '15-20%'],
                    ['Lighting', '10%'],
                    ['Closet', '15-20%'],
                    ['Labor', '20-30%']
                ]
            },
            living: { 
                baseLow: 20, baseHigh: 80,
                breakdown: [
                    ['Flooring', '35-45%'],
                    ['Paint/Walls', '15-20%'],
                    ['Lighting', '10%'],
                    ['Built-ins', '10-15%'],
                    ['Labor', '20-30%']
                ]
            },
            whole: { 
                baseLow: 50, baseHigh: 200,
                breakdown: [
                    ['Kitchen', '25-30%'],
                    ['Bathrooms', '15-20%'],
                    ['Flooring Throughout', '15%'],
                    ['Painting', '5-10%'],
                    ['HVAC/Electrical', '10-15%'],
                    ['Other Rooms', '15-20%']
                ]
            }
        };
        
        let currentRoom = 'kitchen';
        
        function setRoom(room, btn) {
            currentRoom = room;
            document.querySelectorAll('.room-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            // Set typical sqft
            const sqftDefaults = { kitchen: 200, bathroom: 80, basement: 800, bedroom: 200, living: 300, whole: 2000 };
            document.getElementById('sqft').value = sqftDefaults[room];
            
            calculate();
        }

        function calculate() {
            const sqft = parseInt(document.getElementById('sqft').value) || 100;
            const quality = document.getElementById('quality').value;
            const locationFactor = parseFloat(document.getElementById('location').value) || 1;
            const laborFactor = parseFloat(document.getElementById('labor').value) || 1;
            
            const qualityMultipliers = { budget: 0.7, mid: 1.0, upscale: 1.5, luxury: 2.5 };
            const qualityMult = qualityMultipliers[quality];
            
            const room = roomData[currentRoom];
            const lowPerSqft = room.baseLow * qualityMult * locationFactor * laborFactor;
            const highPerSqft = room.baseHigh * qualityMult * locationFactor * laborFactor;
            
            const lowTotal = sqft * lowPerSqft;
            const highTotal = sqft * highPerSqft;
            const avgTotal = (lowTotal + highTotal) / 2;
            
            document.getElementById('totalCost').textContent = 
                '$' + Math.round(lowTotal).toLocaleString() + ' - $' + Math.round(highTotal).toLocaleString();
            document.getElementById('perSqft').textContent = 
                '$' + Math.round(lowPerSqft) + ' - $' + Math.round(highPerSqft);
            document.getElementById('laborCost').textContent = '$' + Math.round(avgTotal * 0.35).toLocaleString();
            document.getElementById('materialsCost').textContent = '$' + Math.round(avgTotal * 0.65).toLocaleString();
            
            // Update breakdown
            const breakdownHTML = room.breakdown.map(([item, pct]) => 
                `<div class="breakdown-row"><span>${item}</span><span>${pct}</span></div>`
            ).join('');
            document.getElementById('breakdown').innerHTML = breakdownHTML;
        }
        
        calculate();
    </script>
</body>
