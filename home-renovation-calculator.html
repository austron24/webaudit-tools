<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Renovation Calculator - Estimate Remodel Costs</title>
    <meta name="description" content="Free home renovation calculator. Estimate costs for kitchen, bathroom, and whole house remodels. Get budget ranges for your renovation project.">
    <meta name="keywords" content="home renovation calculator, remodel cost, kitchen renovation, bathroom remodel, house renovation">
    <link rel="canonical" href="https://austron24.github.io/webaudit-tools/home-renovation-calculator.html">
    <style>
        :root { --primary: #f97316; --primary-dark: #ea580c; --secondary: #22d3ee; --accent: #10b981; --bg-dark: #0f172a; --bg-card: #1e293b; --bg-input: #334155; --text-primary: #f1f5f9; --text-secondary: #94a3b8; --border: #475569; --success: #10b981; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg-dark); color: var(--text-primary); min-height: 100vh; line-height: 1.6; }
        .ad-container { background: var(--bg-card); padding: 10px; text-align: center; margin: 10px 0; border-radius: 8px; }
        .ad-label { font-size: 10px; color: var(--text-secondary); margin-bottom: 5px; }
        .header { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); padding: 40px 20px; text-align: center; }
        .header h1 { font-size: 2.5rem; margin-bottom: 10px; }
        .main-container { max-width: 1200px; margin: 0 auto; padding: 20px; display: grid; grid-template-columns: 1fr 160px; gap: 20px; }
        .content-area { display: flex; flex-direction: column; gap: 20px; }
        .sidebar { display: flex; flex-direction: column; gap: 20px; }
        .card { background: var(--bg-card); border-radius: 16px; padding: 24px; }
        .card h2 { color: var(--secondary); margin-bottom: 20px; font-size: 1.3rem; }
        .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 8px; color: var(--text-secondary); }
        input, select { width: 100%; padding: 15px; border: 2px solid var(--border); border-radius: 10px; font-size: 1rem; background: var(--bg-input); color: var(--text-primary); }
        input:focus, select:focus { outline: none; border-color: var(--primary); }
        .result-hero { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); padding: 40px; border-radius: 16px; text-align: center; margin: 20px 0; }
        .result-hero-value { font-size: 2.5rem; font-weight: 800; color: white; }
        .result-hero-label { color: rgba(255,255,255,0.9); font-size: 1.2rem; }
        .results-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 20px; }
        .result-card { background: var(--bg-input); padding: 20px; border-radius: 12px; text-align: center; }
        .result-value { font-size: 1.3rem; font-weight: 700; color: var(--secondary); }
        .result-label { color: var(--text-secondary); margin-top: 5px; font-size: 0.85rem; }
        .room-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .room-btn { padding: 15px; background: var(--bg-input); border: 2px solid var(--border); border-radius: 10px; color: var(--text-primary); cursor: pointer; text-align: center; }
        .room-btn:hover, .room-btn.active { background: var(--primary); border-color: var(--primary); }
        .room-btn .emoji { font-size: 1.5rem; display: block; margin-bottom: 5px; }
        .breakdown-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border); }
        .breakdown-row:last-child { border-bottom: none; }
        .related-tools { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-top: 15px; }
        .related-link { display: block; padding: 12px 16px; background: var(--bg-input); border-radius: 8px; color: var(--text-primary); text-decoration: none; }
        .related-link:hover { background: var(--primary); }
        @media (max-width: 968px) { .main-container { grid-template-columns: 1fr; } .sidebar { display: none; } }
        @media (max-width: 640px) { .form-grid, .room-grid { grid-template-columns: 1fr; } .results-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="ad-container">
        <div class="ad-label">Advertisement</div>
        <script type="text/javascript">atOptions = { 'key': 'b43e7cf5057864a264961884e1f34530', 'format': 'iframe', 'height': 90, 'width': 728, 'params': {} };</script>
        <script type="text/javascript" src="https://www.highperformanceformat.com/b43e7cf5057864a264961884e1f34530/invoke.js"></script>
    </div>
    <div class="ad-container" style="display: none;">
        <div class="ad-label">Advertisement</div>
        <script type="text/javascript">atOptions = { 'key': '9f6b66d433cad4c02b643bdd4b7eefc0', 'format': 'iframe', 'height': 50, 'width': 320, 'params': {} };</script>
        <script type="text/javascript" src="https://www.highperformanceformat.com/9f6b66d433cad4c02b643bdd4b7eefc0/invoke.js"></script>
    </div>
    <style>@media (max-width: 728px) { .ad-container:first-child { display: none !important; } .ad-container:nth-child(2) { display: block !important; } }</style>

    <header class="header">
        <h1>🏠 Home Renovation Calculator</h1>
    </header>

    <div class="main-container">
        <div class="content-area">
            <div class="card">
                <h2>🔨 Renovation Type</h2>
                <div class="room-grid">
                    <button class="room-btn active" onclick="setRoom('kitchen', this)">
                        <span class="emoji">🍳</span>Kitchen
                    </button>
                    <button class="room-btn" onclick="setRoom('bathroom', this)">
                        <span class="emoji">🚿</span>Bathroom
                    </button>
                    <button class="room-btn" onclick="setRoom('basement', this)">
                        <span class="emoji">🏗️</span>Basement
                    </button>
                    <button class="room-btn" onclick="setRoom('bedroom', this)">
                        <span class="emoji">🛏️</span>Bedroom
                    </button>
                    <button class="room-btn" onclick="setRoom('living', this)">
                        <span class="emoji">🛋️</span>Living Room
                    </button>
                    <button class="room-btn" onclick="setRoom('whole', this)">
                        <span class="emoji">🏡</span>Whole House
                    </button>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label>Room Size (sq ft)</label>
                        <input type="number" id="sqft" value="200" step="50" oninput="calculate()">
                    </div>
                    <div class="form-group">
                        <label>Quality Level</label>
                        <select id="quality" onchange="calculate()">
                            <option value="budget">Budget</option>
                            <option value="mid" selected>Mid-Range</option>
                            <option value="upscale">Upscale</option>
                            <option value="luxury">Luxury</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Location Factor</label>
                        <select id="location" onchange="calculate()">
                            <option value="0.8">Low Cost Area</option>
                            <option value="1.0" selected>Average</option>
                            <option value="1.3">High Cost City</option>
                            <option value="1.5">Major Metro (NYC, SF)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>DIY vs Contractor</label>
                        <select id="labor" onchange="calculate()">
                            <option value="0.6">Mostly DIY</option>
                            <option value="0.8">Some DIY</option>
                            <option value="1.0" selected>Full Contractor</option>
                        </select>
                    </div>
                </div>

                <div class="result-hero">
                    <div class="result-hero-label">Estimated Renovation Cost</div>
                    <div class="result-hero-value" id="totalCost">$0 - $0</div>
                </div>

                <div class="results-grid">
                    <div class="result-card">
                        <div class="result-value" id="perSqft">$0</div>
                        <div class="result-label">Per Square Foot</div>
                    </div>
                    <div class="result-card">
                        <div class="result-value" id="laborCost">$0</div>
                        <div class="result-label">Labor (~40%)</div>
                    </div>
                    <div class="result-card">
                        <div class="result-value" id="materialsCost">$0</div>
                        <div class="result-label">Materials (~60%)</div>
                    </div>
                </div>
            </div>

            <div class="card">
                <h2>📊 Typical Cost Breakdown</h2>
                <div id="breakdown"></div>
            </div>

            <div class="ad-container">
                <div class="ad-label">Advertisement</div>
                <script type="text/javascript">atOptions = { 'key': 'ee368c7cdf94f06bc71fdf57fe4124b8', 'format': 'iframe', 'height': 250, 'width': 300, 'params': {} };</script>
                <script type="text/javascript" src="https://www.highperformanceformat.com/ee368c7cdf94f06bc71fdf57fe4124b8/invoke.js"></script>
            </div>

            <div class="card">
                <h2>🔗 Related Tools</h2>
                <div class="related-tools">
                    <a href="paint-calculator.html" class="related-link">🎨 Paint Calculator</a>
                    <a href="flooring-calculator.html" class="related-link">🏠 Flooring</a>
                    <a href="home-value-calculator.html" class="related-link">💰 Home Value</a>
                    <a href="mortgage-calculator.html" class="related-link">🏦 Mortgage</a>
                </div>
            </div>
        </div>

        <div class="sidebar">
            <div class="ad-container">
                <div class="ad-label">Advertisement</div>
                <script type="text/javascript">atOptions = { 'key': 'd4702b3e9743f9cd914a00e5026493f3', 'format': 'iframe', 'height': 600, 'width': 160, 'params': {} };</script>
                <script type="text/javascript" src="https://www.highperformanceformat.com/d4702b3e9743f9cd914a00e5026493f3/invoke.js"></script>
            </div>
        </div>
    </div>

    <script>
        const roomData = {
            kitchen: { 
                baseLow: 75, baseHigh: 250,
                breakdown: [
                    ['Cabinets', '30-35%'],
                    ['Countertops', '10-15%'],
                    ['Appliances', '15-20%'],
                    ['Flooring', '10%'],
                    ['Plumbing/Fixtures', '5-10%'],
                    ['Labor', '20-35%']
                ]
            },
            bathroom: { 
                baseLow: 100, baseHigh: 350,
                breakdown: [
                    ['Tile/Flooring', '15-20%'],
                    ['Vanity/Cabinets', '15-20%'],
                    ['Shower/Tub', '15-25%'],
                    ['Fixtures', '10-15%'],
                    ['Plumbing', '10-15%'],
                    ['Labor', '25-35%']
                ]
            },
            basement: { 
                baseLow: 30, baseHigh: 100,
                breakdown: [
                    ['Framing/Drywall', '25-30%'],
                    ['Flooring', '15-20%'],
                    ['Electrical', '10-15%'],
                    ['Plumbing (if any)', '10-15%'],
                    ['HVAC', '10%'],
                    ['Labor', '25-35%']
                ]
            },
            bedroom: { 
                baseLow: 20, baseHigh: 80,
                breakdown: [
                    ['Flooring', '30-40%'],
                    ['Paint/Walls', '15-20%'],
                    ['Lighting', '10%'],
                    ['Closet', '15-20%'],
                    ['Labor', '20-30%']
                ]
            },
            living: { 
                baseLow: 20, baseHigh: 80,
                breakdown: [
                    ['Flooring', '35-45%'],
                    ['Paint/Walls', '15-20%'],
                    ['Lighting', '10%'],
                    ['Built-ins', '10-15%'],
                    ['Labor', '20-30%']
                ]
            },
            whole: { 
                baseLow: 50, baseHigh: 200,
                breakdown: [
                    ['Kitchen', '25-30%'],
                    ['Bathrooms', '15-20%'],
                    ['Flooring Throughout', '15%'],
                    ['Painting', '5-10%'],
                    ['HVAC/Electrical', '10-15%'],
                    ['Other Rooms', '15-20%']
                ]
            }
        };
        
        let currentRoom = 'kitchen';
        
        function setRoom(room, btn) {
            currentRoom = room;
            document.querySelectorAll('.room-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            // Set typical sqft
            const sqftDefaults = { kitchen: 200, bathroom: 80, basement: 800, bedroom: 200, living: 300, whole: 2000 };
            document.getElementById('sqft').value = sqftDefaults[room];
            
            calculate();
        }

        function calculate() {
            const sqft = parseInt(document.getElementById('sqft').value) || 100;
            const quality = document.getElementById('quality').value;
            const locationFactor = parseFloat(document.getElementById('location').value) || 1;
            const laborFactor = parseFloat(document.getElementById('labor').value) || 1;
            
            const qualityMultipliers = { budget: 0.7, mid: 1.0, upscale: 1.5, luxury: 2.5 };
            const qualityMult = qualityMultipliers[quality];
            
            const room = roomData[currentRoom];
            const lowPerSqft = room.baseLow * qualityMult * locationFactor * laborFactor;
            const highPerSqft = room.baseHigh * qualityMult * locationFactor * laborFactor;
            
            const lowTotal = sqft * lowPerSqft;
            const highTotal = sqft * highPerSqft;
            const avgTotal = (lowTotal + highTotal) / 2;
            
            document.getElementById('totalCost').textContent = 
                '$' + Math.round(lowTotal).toLocaleString() + ' - $' + Math.round(highTotal).toLocaleString();
            document.getElementById('perSqft').textContent = 
                '$' + Math.round(lowPerSqft) + ' - $' + Math.round(highPerSqft);
            document.getElementById('laborCost').textContent = '$' + Math.round(avgTotal * 0.35).toLocaleString();
            document.getElementById('materialsCost').textContent = '$' + Math.round(avgTotal * 0.65).toLocaleString();
            
            // Update breakdown
            const breakdownHTML = room.breakdown.map(([item, pct]) => 
                `<div class="breakdown-row"><span>${item}</span><span>${pct}</span></div>`
            ).join('');
            document.getElementById('breakdown').innerHTML = breakdownHTML;
        }
        
        calculate();
    </script>
</body>
</html>
