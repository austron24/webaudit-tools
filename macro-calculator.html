<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Macro Calculator - Calculate Your Macros</title>
    <meta name="description" content="Free macro calculator. Calculate your daily macronutrients - protein, carbs, and fats based on your goals.">
    <meta name="keywords" content="macro calculator, macronutrient calculator, protein carbs fat, IIFYM, flexible dieting">
    <link rel="canonical" href="https://austron24.github.io/webaudit-tools/macro-calculator.html">
    <style>
        :root { --primary: #8b5cf6; --primary-dark: #7c3aed; --secondary: #22d3ee; --accent: #f59e0b; --bg-dark: #0f172a; --bg-card: #1e293b; --bg-input: #334155; --text-primary: #f1f5f9; --text-secondary: #94a3b8; --border: #475569; --success: #10b981; --protein: #ef4444; --carbs: #3b82f6; --fat: #f59e0b; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg-dark); color: var(--text-primary); min-height: 100vh; line-height: 1.6; }
        .ad-container { background: var(--bg-card); padding: 10px; text-align: center; margin: 10px 0; border-radius: 8px; }
        .ad-label { font-size: 10px; color: var(--text-secondary); margin-bottom: 5px; }
        .header { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); padding: 40px 20px; text-align: center; }
        .header h1 { font-size: 2.5rem; margin-bottom: 10px; }
        .main-container { max-width: 1200px; margin: 0 auto; padding: 20px; display: grid; grid-template-columns: 1fr 160px; gap: 20px; }
        .content-area { display: flex; flex-direction: column; gap: 20px; }
        .sidebar { display: flex; flex-direction: column; gap: 20px; }
        .card { background: var(--bg-card); border-radius: 16px; padding: 24px; }
        .card h2 { color: var(--secondary); margin-bottom: 20px; font-size: 1.3rem; }
        .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: var(--text-secondary); }
        input, select { width: 100%; padding: 15px; border: 2px solid var(--border); border-radius: 10px; font-size: 1rem; background: var(--bg-input); color: var(--text-primary); }
        input:focus, select:focus { outline: none; border-color: var(--primary); }
        .result-hero { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); padding: 35px; border-radius: 16px; text-align: center; margin: 20px 0; }
        .result-hero-value { font-size: 3rem; font-weight: 800; color: white; }
        .result-hero-label { color: rgba(255,255,255,0.8); }
        .macro-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 20px; }
        .macro-card { padding: 25px; border-radius: 16px; text-align: center; }
        .macro-card.protein { background: linear-gradient(135deg, var(--protein), #dc2626); }
        .macro-card.carbs { background: linear-gradient(135deg, var(--carbs), #2563eb); }
        .macro-card.fat { background: linear-gradient(135deg, var(--fat), #d97706); }
        .macro-value { font-size: 2.5rem; font-weight: 800; color: white; }
        .macro-label { color: rgba(255,255,255,0.8); font-size: 0.9rem; margin-top: 5px; }
        .macro-calories { color: rgba(255,255,255,0.7); font-size: 0.85rem; margin-top: 8px; }
        .chart-container { display: flex; justify-content: center; align-items: center; margin-top: 20px; }
        .pie-chart { width: 200px; height: 200px; border-radius: 50%; position: relative; }
        .related-tools { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-top: 15px; }
        .related-link { display: block; padding: 12px 16px; background: var(--bg-input); border-radius: 8px; color: var(--text-primary); text-decoration: none; }
        .related-link:hover { background: var(--primary); }
        @media (max-width: 968px) { .main-container { grid-template-columns: 1fr; } .sidebar { display: none; } }
        @media (max-width: 640px) { .form-grid, .macro-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="ad-container">
        <div class="ad-label">Advertisement</div>
        <script type="text/javascript">atOptions = { 'key': 'b43e7cf5057864a264961884e1f34530', 'format': 'iframe', 'height': 90, 'width': 728, 'params': {} };</script>
        <script type="text/javascript" src="//www.highperformanceformat.com/b43e7cf5057864a264961884e1f34530/invoke.js"></script>
    </div>
    <div class="ad-container" style="display: none;">
        <div class="ad-label">Advertisement</div>
        <script type="text/javascript">atOptions = { 'key': '9f6b66d433cad4c02b643bdd4b7eefc0', 'format': 'iframe', 'height': 50, 'width': 320, 'params': {} };</script>
        <script type="text/javascript" src="//www.highperformanceformat.com/9f6b66d433cad4c02b643bdd4b7eefc0/invoke.js"></script>
    </div>
    <style>@media (max-width: 728px) { .ad-container:first-child { display: none !important; } .ad-container:nth-child(2) { display: block !important; } }</style>
    
    <header class="header">
        <h1>🥗 Macro Calculator</h1>
    </header>

    <div class="main-container">
        <div class="content-area">
            <div class="card">
                <h2>📊 Your Information</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Age</label>
                        <input type="number" id="age" value="30" oninput="calculate()">
                    </div>
                    <div class="form-group">
                        <label>Gender</label>
                        <select id="gender" onchange="calculate()">
                            <option value="male" selected>Male</option>
                            <option value="female">Female</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Weight (lbs)</label>
                        <input type="number" id="weight" value="170" oninput="calculate()">
                    </div>
                    <div class="form-group">
                        <label>Height (inches)</label>
                        <input type="number" id="height" value="70" oninput="calculate()">
                    </div>
                    <div class="form-group">
                        <label>Activity Level</label>
                        <select id="activity" onchange="calculate()">
                            <option value="1.2">Sedentary</option>
                            <option value="1.375">Lightly Active</option>
                            <option value="1.55" selected>Moderately Active</option>
                            <option value="1.725">Very Active</option>
                            <option value="1.9">Extremely Active</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Goal</label>
                        <select id="goal" onchange="calculate()">
                            <option value="lose">Lose Weight (-500 cal)</option>
                            <option value="maintain" selected>Maintain Weight</option>
                            <option value="gain">Build Muscle (+300 cal)</option>
                        </select>
                    </div>
                </div>
                
                <div class="result-hero">
                    <div class="result-hero-label">Daily Calories</div>
                    <div class="result-hero-value" id="totalCalories">0</div>
                </div>
                
                <div class="macro-grid">
                    <div class="macro-card protein">
                        <div class="macro-value" id="proteinGrams">0g</div>
                        <div class="macro-label">Protein</div>
                        <div class="macro-calories" id="proteinCals">0 calories</div>
                    </div>
                    <div class="macro-card carbs">
                        <div class="macro-value" id="carbsGrams">0g</div>
                        <div class="macro-label">Carbohydrates</div>
                        <div class="macro-calories" id="carbsCals">0 calories</div>
                    </div>
                    <div class="macro-card fat">
                        <div class="macro-value" id="fatGrams">0g</div>
                        <div class="macro-label">Fat</div>
                        <div class="macro-calories" id="fatCals">0 calories</div>
                    </div>
                </div>
            </div>

            <div class="card">
                <h2>⚙️ Customize Ratios</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Protein: <span id="proteinPctDisplay">30%</span></label>
                        <input type="range" id="proteinPct" min="10" max="50" value="30" oninput="updateSliders()">
                    </div>
                    <div class="form-group">
                        <label>Carbs: <span id="carbsPctDisplay">40%</span></label>
                        <input type="range" id="carbsPct" min="10" max="60" value="40" oninput="updateSliders()">
                    </div>
                    <div class="form-group">
                        <label>Fat: <span id="fatPctDisplay">30%</span></label>
                        <input type="range" id="fatPct" min="10" max="50" value="30" oninput="updateSliders()">
                    </div>
                </div>
            </div>

            <div class="ad-container">
                <div class="ad-label">Advertisement</div>
                <script type="text/javascript">atOptions = { 'key': 'ee368c7cdf94f06bc71fdf57fe4124b8', 'format': 'iframe', 'height': 250, 'width': 300, 'params': {} };</script>
                <script type="text/javascript" src="//www.highperformanceformat.com/ee368c7cdf94f06bc71fdf57fe4124b8/invoke.js"></script>
            </div>

            <div class="card">
                <h2>🔗 Related Tools</h2>
                <div class="related-tools">
                    <a href="calorie-calculator.html" class="related-link">🔥 Calorie Calculator</a>
                    <a href="protein-intake-calculator.html" class="related-link">🥩 Protein Calculator</a>
                    <a href="tdee-calculator.html" class="related-link">💪 TDEE Calculator</a>
                    <a href="bmi-calculator.html" class="related-link">⚖️ BMI Calculator</a>
                </div>
            </div>
        </div>

        <div class="sidebar">
            <div class="ad-container">
                <div class="ad-label">Advertisement</div>
                <script type="text/javascript">atOptions = { 'key': 'd4702b3e9743f9cd914a00e5026493f3', 'format': 'iframe', 'height': 600, 'width': 160, 'params': {} };</script>
                <script type="text/javascript" src="//www.highperformanceformat.com/d4702b3e9743f9cd914a00e5026493f3/invoke.js"></script>
            </div>
        </div>
    </div>

    <script>
        function updateSliders() {
            const protein = parseInt(document.getElementById('proteinPct').value);
            const carbs = parseInt(document.getElementById('carbsPct').value);
            const fat = parseInt(document.getElementById('fatPct').value);
            
            document.getElementById('proteinPctDisplay').textContent = protein + '%';
            document.getElementById('carbsPctDisplay').textContent = carbs + '%';
            document.getElementById('fatPctDisplay').textContent = fat + '%';
            
            calculate();
        }
        
        function calculate() {
            const age = parseInt(document.getElementById('age').value) || 30;
            const gender = document.getElementById('gender').value;
            const weight = parseFloat(document.getElementById('weight').value) || 170;
            const height = parseFloat(document.getElementById('height').value) || 70;
            const activity = parseFloat(document.getElementById('activity').value);
            const goal = document.getElementById('goal').value;
            
            const weightKg = weight * 0.453592;
            const heightCm = height * 2.54;
            
            let bmr;
            if (gender === 'male') {
                bmr = 10 * weightKg + 6.25 * heightCm - 5 * age + 5;
            } else {
                bmr = 10 * weightKg + 6.25 * heightCm - 5 * age - 161;
            }
            
            let tdee = bmr * activity;
            
            if (goal === 'lose') tdee -= 500;
            else if (goal === 'gain') tdee += 300;
            
            const proteinPct = parseInt(document.getElementById('proteinPct').value) / 100;
            const carbsPct = parseInt(document.getElementById('carbsPct').value) / 100;
            const fatPct = parseInt(document.getElementById('fatPct').value) / 100;
            
            const proteinCals = tdee * proteinPct;
            const carbsCals = tdee * carbsPct;
            const fatCals = tdee * fatPct;
            
            const proteinGrams = Math.round(proteinCals / 4);
            const carbsGrams = Math.round(carbsCals / 4);
            const fatGrams = Math.round(fatCals / 9);
            
            document.getElementById('totalCalories').textContent = Math.round(tdee).toLocaleString();
            document.getElementById('proteinGrams').textContent = proteinGrams + 'g';
            document.getElementById('carbsGrams').textContent = carbsGrams + 'g';
            document.getElementById('fatGrams').textContent = fatGrams + 'g';
            document.getElementById('proteinCals').textContent = Math.round(proteinCals) + ' calories';
            document.getElementById('carbsCals').textContent = Math.round(carbsCals) + ' calories';
            document.getElementById('fatCals').textContent = Math.round(fatCals) + ' calories';
        }
        
        calculate();
    </script>
</body>
</html>
