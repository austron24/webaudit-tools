    <style>
        :root { --primary: #6366f1; --primary-dark: #4f46e5; --secondary: #22d3ee; --accent: #f59e0b; --bg-dark: #0f172a; --bg-card: #1e293b; --bg-input: #334155; --text-primary: #f1f5f9; --text-secondary: #94a3b8; --border: #475569; --success: #10b981; --protein: #ef4444; --carbs: #f59e0b; --fat: #6366f1; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg-dark); color: var(--text-primary); min-height: 100vh; line-height: 1.6; }
        .ad-container { background: var(--bg-card); padding: 10px; text-align: center; margin: 10px 0; border-radius: 8px; }
        .ad-label { font-size: 10px; color: var(--text-secondary); margin-bottom: 5px; }
        .header { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); padding: 40px 20px; text-align: center; }
        .header h1 { font-size: 2.5rem; margin-bottom: 10px; }
        .main-container { max-width: 1200px; margin: 0 auto; padding: 20px; display: grid; grid-template-columns: 1fr 160px; gap: 20px; }
        .content-area { display: flex; flex-direction: column; gap: 20px; }
        .sidebar { display: flex; flex-direction: column; gap: 20px; }
        .card { background: var(--bg-card); border-radius: 16px; padding: 24px; }
        .card h2 { color: var(--secondary); margin-bottom: 20px; font-size: 1.3rem; }
        .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: var(--text-secondary); }
        input, select { width: 100%; padding: 15px; border: 2px solid var(--border); border-radius: 10px; font-size: 1rem; background: var(--bg-input); color: var(--text-primary); }
        input:focus, select:focus { outline: none; border-color: var(--primary); }
        .gender-toggle { display: flex; gap: 10px; margin-bottom: 20px; }
        .gender-btn { flex: 1; padding: 15px; border: 2px solid var(--border); border-radius: 10px; background: var(--bg-input); color: var(--text-primary); cursor: pointer; text-align: center; font-weight: 600; }
        .gender-btn.active { border-color: var(--primary); background: var(--primary); }
        .calorie-result { background: linear-gradient(135deg, var(--success), #059669); padding: 30px; border-radius: 12px; text-align: center; margin: 20px 0; }
        .calorie-value { font-size: 3rem; font-weight: 800; color: white; }
        .calorie-label { color: rgba(255,255,255,0.8); }
        .macros-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 20px; }
        .macro-card { background: var(--bg-input); padding: 25px; border-radius: 12px; text-align: center; border-top: 4px solid; }
        .macro-card.protein { border-color: var(--protein); }
        .macro-card.carbs { border-color: var(--carbs); }
        .macro-card.fat { border-color: var(--fat); }
        .macro-value { font-size: 2rem; font-weight: 800; }
        .macro-card.protein .macro-value { color: var(--protein); }
        .macro-card.carbs .macro-value { color: var(--carbs); }
        .macro-card.fat .macro-value { color: var(--fat); }
        .macro-label { color: var(--text-secondary); margin-top: 5px; }
        .macro-cals { font-size: 0.9rem; color: var(--text-secondary); margin-top: 5px; }
        .pie-chart { width: 150px; height: 150px; border-radius: 50%; margin: 20px auto; position: relative; }
        .ratio-sliders { margin-top: 20px; }
        .slider-group { margin-bottom: 15px; }
        .slider-label { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .slider { width: 100%; height: 8px; -webkit-appearance: none; background: var(--bg-input); border-radius: 4px; }
        .slider::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; cursor: pointer; }
        .slider.protein::-webkit-slider-thumb { background: var(--protein); }
        .slider.carbs::-webkit-slider-thumb { background: var(--carbs); }
        .slider.fat::-webkit-slider-thumb { background: var(--fat); }
        .related-tools { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-top: 15px; }
        .related-link { display: block; padding: 12px 16px; background: var(--bg-input); border-radius: 8px; color: var(--text-primary); text-decoration: none; }
        .related-link:hover { background: var(--primary); }
        @media (max-width: 968px) { .main-container { grid-template-columns: 1fr; } .sidebar { display: none; } }
        @media (max-width: 640px) { .form-grid { grid-template-columns: 1fr; } .macros-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="ad-container">
        <div class="ad-label">Advertisement</div>
        <script type="text/javascript">atOptions = { 'key': 'b43e7cf5057864a264961884e1f34530', 'format': 'iframe', 'height': 90, 'width': 728, 'params': {} };</script>
        <script type="text/javascript" src="//www.highperformanceformat.com/b43e7cf5057864a264961884e1f34530/invoke.js"></script>
    </div>
    <div class="ad-container" style="display: none;">
        <div class="ad-label">Advertisement</div>
        <script type="text/javascript">atOptions = { 'key': '9f6b66d433cad4c02b643bdd4b7eefc0', 'format': 'iframe', 'height': 50, 'width': 320, 'params': {} };</script>
        <script type="text/javascript" src="//www.highperformanceformat.com/9f6b66d433cad4c02b643bdd4b7eefc0/invoke.js"></script>
    </div>
    <style>@media (max-width: 728px) { .ad-container:first-child { display: none !important; } .ad-container:nth-child(2) { display: block !important; } }</style>
    
    <header class="header">
        <h1>🥗 Macro Calculator</h1>
    </header>

    <div class="main-container">
        <div class="content-area">
            <div class="card">
                <h2>📊 Your Stats</h2>
                <div class="gender-toggle">
                    <button class="gender-btn active" onclick="setGender('male')">👨 Male</button>
                    <button class="gender-btn" onclick="setGender('female')">👩 Female</button>
                </div>
                
                <div class="form-grid">
                    <div class="form-group">
                        <label>Age</label>
                        <input type="number" id="age" value="30" oninput="calculate()">
                    </div>
                    <div class="form-group">
                        <label>Weight (lbs)</label>
                        <input type="number" id="weight" value="170" oninput="calculate()">
                    </div>
                    <div class="form-group">
                        <label>Height (inches)</label>
                        <input type="number" id="height" value="70" oninput="calculate()">
                    </div>
                    <div class="form-group">
                        <label>Activity Level</label>
                        <select id="activity" onchange="calculate()">
                            <option value="1.2">Sedentary (office job)</option>
                            <option value="1.375">Light (1-2x/week)</option>
                            <option value="1.55" selected>Moderate (3-5x/week)</option>
                            <option value="1.725">Active (6-7x/week)</option>
                            <option value="1.9">Very Active (2x/day)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Goal</label>
                        <select id="goal" onchange="calculate()">
                            <option value="-500">Lose Weight (-500 cal)</option>
                            <option value="-250">Slow Cut (-250 cal)</option>
                            <option value="0" selected>Maintain</option>
                            <option value="250">Slow Bulk (+250 cal)</option>
                            <option value="500">Build Muscle (+500 cal)</option>
                        </select>
                    </div>
                </div>
                
                <div class="calorie-result">
                    <div class="calorie-value" id="calories">0</div>
                    <div class="calorie-label">Daily Calories</div>
                </div>
                
                <div class="ratio-sliders">
                    <h3 style="color: var(--secondary); margin-bottom: 15px;">Macro Ratio</h3>
                    <div class="slider-group">
                        <div class="slider-label">
                            <span style="color: var(--protein);">Protein</span>
                            <span id="proteinPct">30%</span>
                        </div>
                        <input type="range" class="slider protein" id="proteinSlider" min="15" max="50" value="30" oninput="updateMacros()">
                    </div>
                    <div class="slider-group">
                        <div class="slider-label">
                            <span style="color: var(--carbs);">Carbs</span>
                            <span id="carbsPct">40%</span>
                        </div>
                        <input type="range" class="slider carbs" id="carbsSlider" min="10" max="60" value="40" oninput="updateMacros()">
                    </div>
                    <div class="slider-group">
                        <div class="slider-label">
                            <span style="color: var(--fat);">Fat</span>
                            <span id="fatPct">30%</span>
                        </div>
                        <input type="range" class="slider fat" id="fatSlider" min="15" max="50" value="30" oninput="updateMacros()">
                    </div>
                </div>
                
                <div class="macros-grid">
                    <div class="macro-card protein">
                        <div class="macro-value" id="proteinGrams">0g</div>
                        <div class="macro-label">Protein</div>
                        <div class="macro-cals" id="proteinCals">0 cal</div>
                    </div>
                    <div class="macro-card carbs">
                        <div class="macro-value" id="carbsGrams">0g</div>
                        <div class="macro-label">Carbs</div>
                        <div class="macro-cals" id="carbsCals">0 cal</div>
                    </div>
                    <div class="macro-card fat">
                        <div class="macro-value" id="fatGrams">0g</div>
                        <div class="macro-label">Fat</div>
                        <div class="macro-cals" id="fatCals">0 cal</div>
                    </div>
                </div>
            </div>

            <div class="ad-container">
                <div class="ad-label">Advertisement</div>
                <script type="text/javascript">atOptions = { 'key': 'ee368c7cdf94f06bc71fdf57fe4124b8', 'format': 'iframe', 'height': 250, 'width': 300, 'params': {} };</script>
                <script type="text/javascript" src="//www.highperformanceformat.com/ee368c7cdf94f06bc71fdf57fe4124b8/invoke.js"></script>
            </div>

            <div class="card">
                <h2>🔗 Related Tools</h2>
                <div class="related-tools">
                    <a href="calorie-calculator.html" class="related-link">🍎 Calorie Calculator</a>
                    <a href="bmi-calculator.html" class="related-link">⚖️ BMI Calculator</a>
                    <a href="body-fat-calculator.html" class="related-link">💪 Body Fat Calculator</a>
                    <a href="ideal-weight-calculator.html" class="related-link">🎯 Ideal Weight</a>
                </div>
            </div>
        </div>

        <div class="sidebar">
            <div class="ad-container">
                <div class="ad-label">Advertisement</div>
                <script type="text/javascript">atOptions = { 'key': 'd4702b3e9743f9cd914a00e5026493f3', 'format': 'iframe', 'height': 600, 'width': 160, 'params': {} };</script>
                <script type="text/javascript" src="//www.highperformanceformat.com/d4702b3e9743f9cd914a00e5026493f3/invoke.js"></script>
            </div>
        </div>
    </div>

    <script>
        let gender = 'male';
        let tdee = 0;
        
        function setGender(g) {
            gender = g;
            document.querySelectorAll('.gender-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            calculate();
        }
        
        function calculate() {
            const age = parseInt(document.getElementById('age').value) || 0;
            const weight = parseFloat(document.getElementById('weight').value) || 0;
            const height = parseFloat(document.getElementById('height').value) || 0;
            const activity = parseFloat(document.getElementById('activity').value) || 1.55;
            const goal = parseInt(document.getElementById('goal').value) || 0;
            
            // Convert to metric
            const weightKg = weight * 0.453592;
            const heightCm = height * 2.54;
            
            // Mifflin-St Jeor Equation
            let bmr;
            if (gender === 'male') {
                bmr = (10 * weightKg) + (6.25 * heightCm) - (5 * age) + 5;
            } else {
                bmr = (10 * weightKg) + (6.25 * heightCm) - (5 * age) - 161;
            }
            
            tdee = Math.round(bmr * activity + goal);
            document.getElementById('calories').textContent = tdee.toLocaleString();
            
            updateMacros();
        }
        
        function updateMacros() {
            const protein = parseInt(document.getElementById('proteinSlider').value);
            const carbs = parseInt(document.getElementById('carbsSlider').value);
            const fat = parseInt(document.getElementById('fatSlider').value);
            
            // Normalize to 100%
            const total = protein + carbs + fat;
            const pPct = protein / total;
            const cPct = carbs / total;
            const fPct = fat / total;
            
            document.getElementById('proteinPct').textContent = Math.round(pPct * 100) + '%';
            document.getElementById('carbsPct').textContent = Math.round(cPct * 100) + '%';
            document.getElementById('fatPct').textContent = Math.round(fPct * 100) + '%';
            
            const proteinCals = tdee * pPct;
            const carbsCals = tdee * cPct;
            const fatCals = tdee * fPct;
            
            const proteinGrams = Math.round(proteinCals / 4);
            const carbsGrams = Math.round(carbsCals / 4);
            const fatGrams = Math.round(fatCals / 9);
            
            document.getElementById('proteinGrams').textContent = proteinGrams + 'g';
            document.getElementById('carbsGrams').textContent = carbsGrams + 'g';
            document.getElementById('fatGrams').textContent = fatGrams + 'g';
            
            document.getElementById('proteinCals').textContent = Math.round(proteinCals) + ' cal';
            document.getElementById('carbsCals').textContent = Math.round(carbsCals) + ' cal';
            document.getElementById('fatCals').textContent = Math.round(fatCals) + ' cal';
        }
        
        calculate();
    </script>
</body>
