<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://quge5.com/88/tag.min.js" data-zone="196361" async data-cfasync="false"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Running Pace Calculator - Pace, Time & Distance</title>
    <meta name="description" content="Free running pace calculator. Calculate your running pace, finish time, or distance for any race or training run.">
    <meta name="keywords" content="running pace calculator, pace calculator, running time, marathon pace, 5k pace">
    <link rel="canonical" href="https://austron24.github.io/webaudit-tools/running-pace-calculator.html">
    <style>
        :root { --primary: #10b981; --primary-dark: #059669; --secondary: #22d3ee; --accent: #f59e0b; --bg-dark: #0f172a; --bg-card: #1e293b; --bg-input: #334155; --text-primary: #f1f5f9; --text-secondary: #94a3b8; --border: #475569; --success: #10b981; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg-dark); color: var(--text-primary); min-height: 100vh; line-height: 1.6; }
        .ad-container { background: var(--bg-card); padding: 10px; text-align: center; margin: 10px 0; border-radius: 8px; }
        .ad-label { font-size: 10px; color: var(--text-secondary); margin-bottom: 5px; }
        .header { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); padding: 40px 20px; text-align: center; }
        .header h1 { font-size: 2.5rem; margin-bottom: 10px; }
        .main-container { max-width: 1200px; margin: 0 auto; padding: 20px; display: grid; grid-template-columns: 1fr 160px; gap: 20px; }
        .content-area { display: flex; flex-direction: column; gap: 20px; }
        .sidebar { display: flex; flex-direction: column; gap: 20px; }
        .card { background: var(--bg-card); border-radius: 16px; padding: 24px; }
        .card h2 { color: var(--secondary); margin-bottom: 20px; font-size: 1.3rem; }
        .form-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: var(--text-secondary); }
        input, select { width: 100%; padding: 15px; border: 2px solid var(--border); border-radius: 10px; font-size: 1rem; background: var(--bg-input); color: var(--text-primary); }
        input:focus, select:focus { outline: none; border-color: var(--primary); }
        .result-hero { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); padding: 35px; border-radius: 16px; text-align: center; margin: 20px 0; }
        .result-hero-value { font-size: 3rem; font-weight: 800; color: white; }
        .result-hero-label { color: rgba(255,255,255,0.8); }
        .results-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 20px; }
        .result-card { background: var(--bg-input); padding: 20px; border-radius: 12px; text-align: center; }
        .result-value { font-size: 1.3rem; font-weight: 700; color: var(--secondary); }
        .result-label { color: var(--text-secondary); margin-top: 5px; font-size: 0.85rem; }
        .breakdown-row { display: flex; justify-content: space-between; padding: 12px 15px; background: var(--bg-input); border-radius: 8px; margin-bottom: 8px; }
        .related-tools { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-top: 15px; }
        .related-link { display: block; padding: 12px 16px; background: var(--bg-input); border-radius: 8px; color: var(--text-primary); text-decoration: none; }
        .related-link:hover { background: var(--primary); }
        @media (max-width: 968px) { .main-container { grid-template-columns: 1fr; } .sidebar { display: none; } }
        @media (max-width: 640px) { .form-grid, .results-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="ad-container">
        <div class="ad-label">Advertisement</div>
    </div>
    <div class="ad-container" style="display: none;">
        <div class="ad-label">Advertisement</div>
    </div>
    <style>@media (max-width: 728px) { .ad-container:first-child { display: none !important; } .ad-container:nth-child(2) { display: block !important; } }</style>

    <header class="header">
        <h1>🏃 Running Pace Calculator</h1>
    </header>

    <div class="main-container">
        <div class="content-area">
            <div class="card">
                <h2>⏱️ Calculate Pace from Time & Distance</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Hours</label>
                        <input type="number" id="hours" value="0" min="0" oninput="calcPace()">
                    </div>
                    <div class="form-group">
                        <label>Minutes</label>
                        <input type="number" id="minutes" value="45" min="0" max="59" oninput="calcPace()">
                    </div>
                    <div class="form-group">
                        <label>Seconds</label>
                        <input type="number" id="seconds" value="0" min="0" max="59" oninput="calcPace()">
                    </div>
                </div>
                <div class="form-group">
                    <label>Distance</label>
                    <select id="distance" onchange="calcPace()">
                        <option value="5">5K (3.1 miles)</option>
                        <option value="10">10K (6.2 miles)</option>
                        <option value="21.0975">Half Marathon (13.1 miles)</option>
                        <option value="42.195">Marathon (26.2 miles)</option>
                        <option value="1.60934">1 Mile</option>
                        <option value="custom">Custom Distance</option>
                    </select>
                </div>
                <div class="form-group" id="customDistGroup" style="display: none;">
                    <label>Custom Distance (km)</label>
                    <input type="number" id="customDist" value="10" step="0.1" oninput="calcPace()">
                </div>

                <div class="result-hero">
                    <div class="result-hero-label">Your Pace</div>
                    <div class="result-hero-value" id="pace">0:00 /km</div>
                </div>

                <div class="results-grid">
                    <div class="result-card">
                        <div class="result-value" id="paceMile">0:00 /mi</div>
                        <div class="result-label">Pace per Mile</div>
                    </div>
                    <div class="result-card">
                        <div class="result-value" id="speed">0 km/h</div>
                        <div class="result-label">Speed</div>
                    </div>
                    <div class="result-card">
                        <div class="result-value" id="speedMph">0 mph</div>
                        <div class="result-label">Speed (mph)</div>
                    </div>
                </div>
            </div>

            <div class="card">
                <h2>🏅 Race Time Predictions</h2>
                <div id="predictions"></div>
            </div>

            <div class="ad-container">
                <div class="ad-label">Advertisement</div>
            </div>

            <div class="card">
                <h2>🔗 Related Tools</h2>
                <div class="related-tools">
                    <a href="calorie-calculator.html" class="related-link">🔥 Calorie</a>
                    <a href="bmi-calculator.html" class="related-link">⚖️ BMI</a>
                    <a href="heart-rate-calculator.html" class="related-link">❤️ Heart Rate</a>
                    <a href="steps-calculator.html" class="related-link">👟 Steps</a>
                </div>
            </div>
        </div>

        <div class="sidebar">
            <div class="ad-container">
                <div class="ad-label">Advertisement</div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('distance').addEventListener('change', function() {
            document.getElementById('customDistGroup').style.display = this.value === 'custom' ? 'block' : 'none';
        });

        function formatTime(totalSeconds) {
            const h = Math.floor(totalSeconds / 3600);
            const m = Math.floor((totalSeconds % 3600) / 60);
            const s = Math.floor(totalSeconds % 60);
            if (h > 0) return h + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
            return m + ':' + String(s).padStart(2, '0');
        }

        function calcPace() {
            const hours = parseInt(document.getElementById('hours').value) || 0;
            const minutes = parseInt(document.getElementById('minutes').value) || 0;
            const seconds = parseInt(document.getElementById('seconds').value) || 0;
            const distSelect = document.getElementById('distance').value;
            const distance = distSelect === 'custom' ? parseFloat(document.getElementById('customDist').value) : parseFloat(distSelect);

            const totalSeconds = hours * 3600 + minutes * 60 + seconds;
            const paceSecsPerKm = distance > 0 ? totalSeconds / distance : 0;
            const paceSecsPerMile = paceSecsPerKm * 1.60934;
            const speedKmh = distance > 0 && totalSeconds > 0 ? (distance / totalSeconds) * 3600 : 0;
            const speedMph = speedKmh / 1.60934;

            document.getElementById('pace').textContent = formatTime(paceSecsPerKm) + ' /km';
            document.getElementById('paceMile').textContent = formatTime(paceSecsPerMile) + ' /mi';
            document.getElementById('speed').textContent = speedKmh.toFixed(1) + ' km/h';
            document.getElementById('speedMph').textContent = speedMph.toFixed(1) + ' mph';

            const races = [
                { name: '5K', dist: 5 },
                { name: '10K', dist: 10 },
                { name: 'Half Marathon', dist: 21.0975 },
                { name: 'Marathon', dist: 42.195 }
            ];
            let predHtml = '';
            races.forEach(r => {
                const time = r.dist * paceSecsPerKm;
                predHtml += '<div class="breakdown-row"><span>' + r.name + '</span><span>' + formatTime(time) + '</span></div>';
            });
            document.getElementById('predictions').innerHTML = predHtml;
        }
        calcPace();
    </script>
</body>
</html>
