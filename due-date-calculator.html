    <header class="header">
        <h1>📅 Due Date Calculator</h1>

    <div class="main-container">
        <div class="content-area">
            <div class="card">
                <div class="tabs">
                    <button class="tab active" onclick="switchTab('add')">Add Days</button>
                    <button class="tab" onclick="switchTab('workback')">Work Back</button>
                    <button class="tab" onclick="switchTab('between')">Days Between</button>
                </div>

                <div id="addTab" class="tab-content active">
                    <h2>➕ Add Days to Date</h2>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Start Date</label>
                            <input type="date" id="addStart" onchange="calculateAdd()">
                        </div>
                        <div class="form-group">
                            <label>Days to Add</label>
                            <input type="number" id="addDays" value="30" min="1" oninput="calculateAdd()">
                        </div>
                        <div class="form-group">
                            <label>Day Type</label>
                            <select id="addType" onchange="calculateAdd()">
                                <option value="calendar">Calendar Days</option>
                                <option value="business">Business Days Only</option>
                            </select>
                        </div>
                    </div>
                    <div class="result-hero">
                        <div class="result-hero-label">Due Date</div>
                        <div class="result-hero-value" id="addResult">-</div>
                    </div>
                </div>

                <div id="workbackTab" class="tab-content">
                    <h2>⏪ Work Back from Due Date</h2>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Due Date</label>
                            <input type="date" id="workDue" onchange="calculateWorkback()">
                        </div>
                        <div class="form-group">
                            <label>Days to Work Back</label>
                            <input type="number" id="workDays" value="14" min="1" oninput="calculateWorkback()">
                        </div>
                        <div class="form-group">
                            <label>Day Type</label>
                            <select id="workType" onchange="calculateWorkback()">
                                <option value="calendar">Calendar Days</option>
                                <option value="business">Business Days Only</option>
                            </select>
                        </div>
                    </div>
                    <div class="result-hero">
                        <div class="result-hero-label">Start By Date</div>
                        <div class="result-hero-value" id="workResult">-</div>
                    </div>
                </div>

                <div id="betweenTab" class="tab-content">
                    <h2>📊 Days Between Dates</h2>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Start Date</label>
                            <input type="date" id="betweenStart" onchange="calculateBetween()">
                        </div>
                        <div class="form-group">
                            <label>End Date</label>
                            <input type="date" id="betweenEnd" onchange="calculateBetween()">
                        </div>
                    </div>
                    <div class="results-grid">

    <script>
        // Set default dates
        const today = new Date();
        document.getElementById('addStart').valueAsDate = today;
        document.getElementById('workDue').valueAsDate = new Date(today.getTime() + 30*24*60*60*1000);
        document.getElementById('betweenStart').valueAsDate = today;
        document.getElementById('betweenEnd').valueAsDate = new Date(today.getTime() + 30*24*60*60*1000);

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tab + 'Tab').classList.add('active');
        }

        function isWeekend(date) {
            const day = date.getDay();
            return day === 0 || day === 6;
        }

        function addBusinessDays(startDate, days) {
            let current = new Date(startDate);
            let added = 0;
            while (added < days) {
                current.setDate(current.getDate() + 1);
                if (!isWeekend(current)) added++;
            }
            return current;
        }

        function subtractBusinessDays(endDate, days) {
            let current = new Date(endDate);
            let subtracted = 0;
            while (subtracted < days) {
                current.setDate(current.getDate() - 1);
                if (!isWeekend(current)) subtracted++;
            }
            return current;
        }

        function formatDate(date) {
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            return date.toLocaleDateString('en-US', options);
        }

        function calculateAdd() {
            const start = new Date(document.getElementById('addStart').value);
            const days = parseInt(document.getElementById('addDays').value) || 0;
            const type = document.getElementById('addType').value;

            if (isNaN(start.getTime())) return;

            let result;
            if (type === 'business') {
                result = addBusinessDays(start, days);
            } else {
                result = new Date(start);
                result.setDate(result.getDate() + days);
            }

            document.getElementById('addResult').textContent = formatDate(result);
        }

        function calculateWorkback() {
            const due = new Date(document.getElementById('workDue').value);
            const days = parseInt(document.getElementById('workDays').value) || 0;
            const type = document.getElementById('workType').value;

            if (isNaN(due.getTime())) return;

            let result;
            if (type === 'business') {
                result = subtractBusinessDays(due, days);
            } else {
                result = new Date(due);
                result.setDate(result.getDate() - days);
            }

            document.getElementById('workResult').textContent = formatDate(result);
        }

        function calculateBetween() {
            const start = new Date(document.getElementById('betweenStart').value);
            const end = new Date(document.getElementById('betweenEnd').value);

            if (isNaN(start.getTime()) || isNaN(end.getTime())) return;

            const msPerDay = 24 * 60 * 60 * 1000;
            const calendarDays = Math.round((end - start) / msPerDay);

            let businessDays = 0;
            let weekendDays = 0;
            let current = new Date(start);
            while (current < end) {
                current.setDate(current.getDate() + 1);
                if (isWeekend(current)) {
                    weekendDays++;
                } else {
                    businessDays++;
                }
            }

            document.getElementById('calendarDays').textContent = calendarDays;
            document.getElementById('businessDays').textContent = businessDays;
            document.getElementById('weekendDays').textContent = weekendDays;
        }

        // Initial calculations
        calculateAdd();
        calculateWorkback();
        calculateBetween();
    </script>
