        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 8px; color: var(--text-secondary); }
        input, select { width: 100%; padding: 15px; border: 2px solid var(--border); border-radius: 10px; font-size: 1rem; background: var(--bg-input); color: var(--text-primary); }
        input:focus, select:focus { outline: none; border-color: var(--primary); }

        .result-hero-value { font-size: 2.5rem; font-weight: 800; color: white; }
        .result-hero-label { color: rgba(255,255,255,0.9); font-size: 1.2rem; }
        .category-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
        .category-btn { padding: 12px; background: var(--bg-input); border: 2px solid var(--border); border-radius: 10px; cursor: pointer; text-align: center; color: var(--text-primary); font-size: 0.9rem; }
        .category-btn.active { border-color: var(--primary); background: var(--primary); }
        .swap-btn { background: var(--accent); color: #000; border: none; padding: 15px 20px; border-radius: 10px; cursor: pointer; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; }
        .common-conversions { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 15px; }
        .common-item { background: var(--bg-input); padding: 12px; border-radius: 8px; font-size: 0.9rem; }
        .related-tools { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-top: 15px; }
        .related-link { display: block; padding: 12px 16px; background: var(--bg-input); border-radius: 8px; color: var(--text-primary); text-decoration: none; }
        .related-link:hover { background: var(--primary); }
        @media (max-width: 968px) { .main-container { grid-template-columns: 1fr; } .sidebar { display: none; } }
        @media (max-width: 640px) { .form-grid { grid-template-columns: 1fr; } .category-grid { grid-template-columns: repeat(2, 1fr); } }
    </style>

        <script type="text/javascript">atOptions = { 'key': '9f6b66d433cad4c02b643bdd4b7eefc0', 'format': 'iframe', 'height': 50, 'width': 320, 'params': {} };</script>

    <div class="main-container">
        <div class="content-area">
            <div class="card">

                <div class="form-grid" style="align-items: end;">
                    <div class="form-group">

                        <input type="number" id="inputValue" value="1" oninput="convert()">
                    </div>
                    <div class="form-group">
                        <label>From</label>
                        <select id="fromUnit" onchange="convert()"></select>
                    </div>
                    <div style="display: flex; justify-content: center;">
                        <button class="swap-btn" onclick="swapUnits()">⇄</button>
                    </div>
                    <div class="form-group">
                        <label>To</label>
                        <select id="toUnit" onchange="convert()"></select>
                    </div>
                </div>
            </div>

            <div class="result-hero">
                <div class="result-hero-label" id="conversionLabel">1 meter =</div>
                <div class="result-hero-value" id="result">3.28084 feet</div>

                <script type="text/javascript" src="https://www.highperformanceformat.com/d4702b3e9743f9cd914a00e5026493f3/invoke.js"></script>
            </div>
        </div>
    </div>

    <script>
        const categories = {
            length: {
                name: 'Length',
                base: 'meter',
                units: {
                    'meter': 1,
                    'kilometer': 1000,
                    'centimeter': 0.01,
                    'millimeter': 0.001,
                    'mile': 1609.344,
                    'yard': 0.9144,
                    'foot': 0.3048,
                    'inch': 0.0254
                }
            },
            weight: {
                name: 'Weight',
                base: 'kilogram',
                units: {
                    'kilogram': 1,
                    'gram': 0.001,
                    'milligram': 0.000001,
                    'pound': 0.453592,
                    'ounce': 0.0283495,
                    'ton': 907.185,
                    'metric ton': 1000
                }
            },
            volume: {
                name: 'Volume',
                base: 'liter',
                units: {
                    'liter': 1,
                    'milliliter': 0.001,
                    'gallon': 3.78541,
                    'quart': 0.946353,
                    'pint': 0.473176,
                    'cup': 0.236588,
                    'fluid ounce': 0.0295735,
                    'cubic meter': 1000,
                    'cubic foot': 28.3168
                }
            },
            temperature: {
                name: 'Temperature',
                base: 'celsius',
                units: { 'celsius': 'C', 'fahrenheit': 'F', 'kelvin': 'K' },
                special: true
            },
            area: {
                name: 'Area',
                base: 'sqmeter',
                units: {
                    'square meter': 1,
                    'square kilometer': 1000000,
                    'square foot': 0.092903,
                    'square yard': 0.836127,
                    'acre': 4046.86,
                    'hectare': 10000,
                    'square mile': 2589988
                }
            },
            speed: {
                name: 'Speed',
                base: 'mps',
                units: {
                    'm/s': 1,
                    'km/h': 0.277778,
                    'mph': 0.44704,
                    'knot': 0.514444,
                    'ft/s': 0.3048
                }
            },
            time: {
                name: 'Time',
                base: 'second',
                units: {
                    'second': 1,
                    'minute': 60,
                    'hour': 3600,
                    'day': 86400,
                    'week': 604800,
                    'month': 2629746,
                    'year': 31556952
                }
            },
            data: {
                name: 'Data',
                base: 'byte',
                units: {
                    'byte': 1,
                    'kilobyte': 1024,
                    'megabyte': 1048576,
                    'gigabyte': 1073741824,
                    'terabyte': 1099511627776
                }
            }
        };

        let currentCategory = 'length';

        function renderCategories() {
            document.getElementById('categoryGrid').innerHTML = Object.entries(categories).map(([key, cat]) => 
                `<div class="category-btn ${key === currentCategory ? 'active' : ''}" onclick="selectCategory('${key}')">${cat.name}</div>`
            ).join('');
        }

        function selectCategory(cat) {
            currentCategory = cat;
            renderCategories();
            populateUnits();
            convert();
        }

        function populateUnits() {
            const cat = categories[currentCategory];
            const options = Object.keys(cat.units).map(u => `<option value="${u}">${u}</option>`).join('');
            document.getElementById('fromUnit').innerHTML = options;
            document.getElementById('toUnit').innerHTML = options;
            document.getElementById('toUnit').selectedIndex = 1;
        }

        function swapUnits() {
            const from = document.getElementById('fromUnit');
            const to = document.getElementById('toUnit');
            [from.value, to.value] = [to.value, from.value];
            convert();
        }

        function convert() {
            const value = parseFloat(document.getElementById('inputValue').value) || 0;
            const fromUnit = document.getElementById('fromUnit').value;
            const toUnit = document.getElementById('toUnit').value;
            const cat = categories[currentCategory];

            let result;
            if (cat.special && currentCategory === 'temperature') {
                // Special handling for temperature
                let celsius;
                if (fromUnit === 'celsius') celsius = value;
                else if (fromUnit === 'fahrenheit') celsius = (value - 32) * 5/9;
                else if (fromUnit === 'kelvin') celsius = value - 273.15;

                if (toUnit === 'celsius') result = celsius;
                else if (toUnit === 'fahrenheit') result = celsius * 9/5 + 32;
                else if (toUnit === 'kelvin') result = celsius + 273.15;
            } else {
                // Standard conversion via base unit
                const inBase = value * cat.units[fromUnit];
                result = inBase / cat.units[toUnit];
            }

            const displayResult = result < 0.001 || result > 1000000 ? result.toExponential(4) : result.toPrecision(6);
            document.getElementById('conversionLabel').textContent = `${value} ${fromUnit} =`;
            document.getElementById('result').textContent = `${displayResult} ${toUnit}`;

            // Common conversions
            const commonHTML = Object.keys(cat.units).slice(0, 6).map(unit => {
                let conv;
                if (cat.special && currentCategory === 'temperature') {
                    let c = fromUnit === 'celsius' ? value : fromUnit === 'fahrenheit' ? (value-32)*5/9 : value - 273.15;
                    if (unit === 'celsius') conv = c;
                    else if (unit === 'fahrenheit') conv = c * 9/5 + 32;
                    else conv = c + 273.15;
                } else {
                    const inBase = value * cat.units[fromUnit];
                    conv = inBase / cat.units[unit];
                }
                return `<div class="common-item">${value} ${fromUnit} = ${conv.toPrecision(4)} ${unit}</div>`;
            }).join('');
            document.getElementById('commonConversions').innerHTML = commonHTML;
        }

        renderCategories();
        populateUnits();
        convert();
    </script>
