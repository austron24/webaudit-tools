    <header class="header">

            <div class="card">
                <h2>🍽️ Fasting Schedule</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Fasting Protocol</label>
                        <select id="protocol" onchange="calculate()">
                            <option value="16:8" selected>16:8 (16hr fast, 8hr eat)</option>
                            <option value="18:6">18:6 (18hr fast, 6hr eat)</option>
                            <option value="20:4">20:4 (20hr fast, 4hr eat)</option>
                            <option value="23:1">OMAD (23hr fast, 1hr eat)</option>
                            <option value="14:10">14:10 (Beginner)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>First Meal Time</label>
                        <input type="time" id="firstMeal" value="12:00" onchange="calculate()">
                    </div>
                </div>

                <div class="result-hero">
                    <div class="result-hero-label">Your Eating Window</div>
                    <div class="result-hero-value" id="eatingWindow">12:00 PM - 8:00 PM</div>
                </div>

                <div class="results-grid">
                    <div class="result-card">
                        <div class="result-value" id="fastingHours">16</div>
                        <div class="result-label">Fasting Hours</div>
                    </div>
                    <div class="result-card">
                        <div class="result-value" id="eatingHours">8</div>
                        <div class="result-label">Eating Hours</div>
                    </div>
                    <div class="result-card">
                        <div class="result-value" id="lastMeal">8:00 PM</div>
                        <div class="result-label">Last Meal By</div>
                    </div>
                    <div class="result-card">

    <script>
        function formatTime(hours, minutes) {
            const h = hours % 24;
            const ampm = h >= 12 ? 'PM' : 'AM';
            const hour12 = h % 12 || 12;
            return hour12 + ':' + String(minutes).padStart(2, '0') + ' ' + ampm;
        }

        function calculate() {
            const protocol = document.getElementById('protocol').value;
            const firstMealTime = document.getElementById('firstMeal').value;
            
            const [fastHours, eatHours] = protocol.split(':').map(Number);
            
            const [startHour, startMin] = firstMealTime.split(':').map(Number);
            const endHour = (startHour + eatHours) % 24;
            
            const firstMealFormatted = formatTime(startHour, startMin);
            const lastMealFormatted = formatTime(endHour, startMin);

            document.getElementById('eatingWindow').textContent = firstMealFormatted + ' - ' + lastMealFormatted;
            document.getElementById('fastingHours').textContent = fastHours;
            document.getElementById('eatingHours').textContent = eatHours;
            document.getElementById('lastMeal').textContent = lastMealFormatted;
            document.getElementById('fastEnds').textContent = firstMealFormatted;

            // Generate schedule
            let html = '';
            const scheduleItems = [
                { time: formatTime((startHour - 2 + 24) % 24, 0), activity: 'Wake up, water/coffee (no calories)', type: '' },
                { time: firstMealFormatted, activity: '🍽️ Eating window opens', type: 'eating' },
                { time: formatTime((startHour + Math.floor(eatHours/2)) % 24, 0), activity: '🍽️ Mid-window meal', type: 'eating' },
                { time: lastMealFormatted, activity: '🍽️ Last meal, eating window closes', type: 'eating' },
                { time: formatTime((endHour + 2) % 24, 0), activity: 'Fasting begins, water/tea only', type: '' },
                { time: formatTime((startHour - 4 + 24) % 24, 0), activity: 'Sleep/Continue fast', type: '' }
            ];

            scheduleItems.forEach(item => {
                html += '<div class="breakdown-row ' + item.type + '"><span>' + item.time + '</span><span>' + item.activity + '</span></div>';
            });

            document.getElementById('schedule').innerHTML = html;
        }
        calculate();
    </script>
