        input:focus, select:focus { outline: none; border-color: var(--primary); }

        .weight-bar { margin-top: 20px; padding: 20px; background: var(--bg-input); border-radius: 12px; }

                <div class="form-grid">
                    <div class="form-group">

                    </div>
                    <div class="form-group">

                        <input type="number" id="currentWeight" value="180" oninput="calculate()">
                    </div>
                    <div class="form-group">
                        <label>Frame Size</label>
                        <select id="frame" onchange="calculate()">
                            <option value="0.9">Small</option>
                            <option value="1.0" selected>Medium</option>

                        </select>
                    </div>

                <div class="result-hero">

    <script>
        let gender = 'male';
        
        function setGender(g) {
            gender = g;
            document.querySelectorAll('.gender-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            calculate();
        }
        
        function calculate() {
            const feet = parseInt(document.getElementById('feet').value) || 5;
            const inches = parseInt(document.getElementById('inches').value) || 0;
            const currentWeight = parseFloat(document.getElementById('currentWeight').value) || 0;
            const frame = parseFloat(document.getElementById('frame').value) || 1.0;
            
            const totalInches = (feet * 12) + inches;
            const heightCm = totalInches * 2.54;
            
            // Various formulas
            let devine, robinson, miller, hamwi;
            
            if (gender === 'male') {
                devine = 50 + 2.3 * (totalInches - 60);
                robinson = 52 + 1.9 * (totalInches - 60);
                miller = 56.2 + 1.41 * (totalInches - 60);
                hamwi = 48 + 2.7 * (totalInches - 60);
            } else {
                devine = 45.5 + 2.3 * (totalInches - 60);
                robinson = 49 + 1.7 * (totalInches - 60);
                miller = 53.1 + 1.36 * (totalInches - 60);
                hamwi = 45.5 + 2.2 * (totalInches - 60);
            }
            
            // Convert to lbs and apply frame
            devine = devine * 2.205 * frame;
            robinson = robinson * 2.205 * frame;
            miller = miller * 2.205 * frame;
            hamwi = hamwi * 2.205 * frame;
            
            const average = (devine + robinson + miller + hamwi) / 4;
            const low = Math.min(devine, robinson, miller, hamwi);
            const high = Math.max(devine, robinson, miller, hamwi);
            
            document.getElementById('idealRange').textContent = Math.round(low) + ' - ' + Math.round(high) + ' lbs';
            
            // Position marker
            const rangeSpan = high - low;
            const center = (low + high) / 2;
            const maxRange = center * 0.4; // 40% range
            let position = 50 + ((currentWeight - center) / maxRange) * 40;
            position = Math.max(5, Math.min(95, position));
            document.getElementById('marker').style.left = position + '%';
            
            // Status
            let status;
            if (currentWeight < low * 0.9) status = 'You are underweight. Consider consulting a healthcare provider.';
            else if (currentWeight < low) status = 'You are slightly below your ideal range.';
            else if (currentWeight <= high) status = 'You are within your ideal weight range! 🎉';
            else if (currentWeight < high * 1.1) status = 'You are slightly above your ideal range.';
            else status = 'You are above your ideal weight. Consider lifestyle changes.';
            document.getElementById('weightStatus').textContent = status;
            
            // Generate formula cards
            const formulas = [
                { name: 'Devine Formula', desc: 'Most commonly used in clinical settings', value: devine },
                { name: 'Robinson Formula', desc: 'Modified version of Devine', value: robinson },
                { name: 'Miller Formula', desc: 'Newer formula with lower estimates', value: miller },
                { name: 'Hamwi Formula', desc: 'Classic formula from 1964', value: hamwi }
            ];
            
            let formulasHtml = '';
            formulas.forEach(f => {
                formulasHtml += `<div class="formula-card">
                    <div>
                        <div class="formula-name">${f.name}</div>
                        <div class="formula-desc">${f.desc}</div>
                    </div>
                    <div class="formula-value">${Math.round(f.value)} lbs</div>
                </div>`;
            });
            document.getElementById('formulas').innerHTML = formulasHtml;
        }
        
        calculate();
    </script>
