<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://quge5.com/88/tag.min.js" data-zone="196361" async data-cfasync="false"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Childcare Cost Calculator - Daycare & Nanny Cost Estimator</title>
    <meta name="description" content="Free childcare cost calculator. Compare costs for daycare centers, home daycares, nannies, and au pairs based on location and child age.">
    <meta name="keywords" content="childcare cost calculator, daycare cost, nanny cost, au pair, babysitter cost, childcare expenses">
    <link rel="canonical" href="https://austron24.github.io/webaudit-tools/childcare-cost-calculator.html">
    <style>
        :root { --primary: #f97316; --primary-dark: #ea580c; --secondary: #22d3ee; --accent: #f59e0b; --bg-dark: #0f172a; --bg-card: #1e293b; --bg-input: #334155; --text-primary: #f1f5f9; --text-secondary: #94a3b8; --border: #475569; --success: #10b981; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg-dark); color: var(--text-primary); min-height: 100vh; line-height: 1.6; }
        .ad-container { background: var(--bg-card); padding: 10px; text-align: center; margin: 10px 0; border-radius: 8px; }
        .ad-label { font-size: 10px; color: var(--text-secondary); margin-bottom: 5px; }
        .header { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); padding: 40px 20px; text-align: center; }
        .header h1 { font-size: 2.5rem; margin-bottom: 10px; }
        .main-container { max-width: 1200px; margin: 0 auto; padding: 20px; display: grid; grid-template-columns: 1fr 160px; gap: 20px; }
        .content-area { display: flex; flex-direction: column; gap: 20px; }
        .sidebar { display: flex; flex-direction: column; gap: 20px; }
        .card { background: var(--bg-card); border-radius: 16px; padding: 24px; }
        .card h2 { color: var(--secondary); margin-bottom: 20px; font-size: 1.3rem; }
        .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 8px; color: var(--text-secondary); }
        input, select { width: 100%; padding: 15px; border: 2px solid var(--border); border-radius: 10px; font-size: 1rem; background: var(--bg-input); color: var(--text-primary); }
        input:focus, select:focus { outline: none; border-color: var(--primary); }
        .result-hero { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); padding: 40px; border-radius: 16px; text-align: center; margin: 20px 0; }
        .result-hero-value { font-size: 2.5rem; font-weight: 800; color: white; }
        .result-hero-label { color: rgba(255,255,255,0.9); font-size: 1.2rem; }
        .results-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 20px; }
        .result-card { background: var(--bg-input); padding: 20px; border-radius: 12px; text-align: center; }
        .result-value { font-size: 1.5rem; font-weight: 700; color: var(--secondary); }
        .result-label { color: var(--text-secondary); margin-top: 5px; font-size: 0.85rem; }
        .compare-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .compare-card { background: var(--bg-input); padding: 20px; border-radius: 12px; }
        .compare-title { color: var(--secondary); font-weight: bold; margin-bottom: 10px; }
        .compare-price { font-size: 1.3rem; font-weight: bold; color: var(--accent); }
        .compare-detail { color: var(--text-secondary); font-size: 0.85rem; margin-top: 5px; }
        .related-tools { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-top: 15px; }
        .related-link { display: block; padding: 12px 16px; background: var(--bg-input); border-radius: 8px; color: var(--text-primary); text-decoration: none; }
        .related-link:hover { background: var(--primary); }
        @media (max-width: 968px) { .main-container { grid-template-columns: 1fr; } .sidebar { display: none; } }
        @media (max-width: 640px) { .form-grid, .results-grid, .compare-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="ad-container">
        <div class="ad-label">Advertisement</div>
    </div>
    <div class="ad-container" style="display: none;">
        <div class="ad-label">Advertisement</div>
    </div>
    <style>@media (max-width: 728px) { .ad-container:first-child { display: none !important; } .ad-container:nth-child(2) { display: block !important; } }</style>

    <header class="header">
        <h1>👶 Childcare Cost Calculator</h1>
    </header>

    <div class="main-container">
        <div class="content-area">
            <div class="card">
                <h2>👨‍👩‍👧 Family Details</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Number of Children</label>
                        <select id="children" onchange="calculate()">
                            <option value="1" selected>1 Child</option>
                            <option value="2">2 Children</option>
                            <option value="3">3 Children</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Youngest Child Age</label>
                        <select id="age" onchange="calculate()">
                            <option value="infant" selected>Infant (0-12 months)</option>
                            <option value="toddler">Toddler (1-2 years)</option>
                            <option value="preschool">Preschool (3-4 years)</option>
                            <option value="school">School Age (5+)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Care Type</label>
                        <select id="careType" onchange="calculate()">
                            <option value="center" selected>Daycare Center</option>
                            <option value="home">Home Daycare</option>
                            <option value="nanny">Full-Time Nanny</option>
                            <option value="nanny_share">Nanny Share</option>
                            <option value="aupair">Au Pair</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Location</label>
                        <select id="location" onchange="calculate()">
                            <option value="rural">Rural Area</option>
                            <option value="suburban" selected>Suburban</option>
                            <option value="urban">Urban</option>
                            <option value="metro">Major Metro (NYC, SF, DC)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Hours Per Week</label>
                        <select id="hours" onchange="calculate()">
                            <option value="20">Part-Time (20 hrs)</option>
                            <option value="40" selected>Full-Time (40 hrs)</option>
                            <option value="50">Extended (50 hrs)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Weeks Per Year</label>
                        <select id="weeks" onchange="calculate()">
                            <option value="48">48 weeks</option>
                            <option value="50" selected>50 weeks</option>
                            <option value="52">52 weeks (year-round)</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="result-hero">
                <div class="result-hero-label">Estimated Annual Childcare Cost</div>
                <div class="result-hero-value" id="annualCost">$0</div>
            </div>

            <div class="results-grid">
                <div class="result-card">
                    <div class="result-value" id="monthlyCost">$0</div>
                    <div class="result-label">Monthly Cost</div>
                </div>
                <div class="result-card">
                    <div class="result-value" id="weeklyCost">$0</div>
                    <div class="result-label">Weekly Cost</div>
                </div>
                <div class="result-card">
                    <div class="result-value" id="hourlyCost">$0</div>
                    <div class="result-label">Hourly Cost</div>
                </div>
            </div>

            <div class="card">
                <h2>📊 Compare Care Options</h2>
                <div class="compare-grid" id="compareGrid"></div>
            </div>

            <div class="ad-container">
                <div class="ad-label">Advertisement</div>
            </div>

            <div class="card">
                <h2>🔗 Related Tools</h2>
                <div class="related-tools">
                    <a href="baby-due-date-calculator.html" class="related-link">🤰 Due Date</a>
                    <a href="budget-calculator.html" class="related-link">💰 Budget</a>
                    <a href="paycheck-calculator.html" class="related-link">💵 Paycheck</a>
                    <a href="savings-goal-calculator.html" class="related-link">🎯 Savings Goal</a>
                </div>
            </div>
        </div>

        <div class="sidebar">
            <div class="ad-container">
                <div class="ad-label">Advertisement</div>
            </div>
        </div>
    </div>

    <script>
        // Weekly costs (national averages for 1 infant, full-time)
        const careTypes = {
            center: { base: 300, name: 'Daycare Center', desc: 'Licensed facility' },
            home: { base: 225, name: 'Home Daycare', desc: 'In-home provider' },
            nanny: { base: 700, name: 'Full-Time Nanny', desc: 'Private in-home' },
            nanny_share: { base: 450, name: 'Nanny Share', desc: 'Shared with family' },
            aupair: { base: 350, name: 'Au Pair', desc: 'Live-in caregiver' }
        };

        const ageMults = { infant: 1.3, toddler: 1.1, preschool: 1.0, school: 0.7 };
        const locationMults = { rural: 0.7, suburban: 1.0, urban: 1.3, metro: 1.7 };
        const childMults = { 1: 1.0, 2: 1.7, 3: 2.3 }; // Not quite linear - some discount for multiples

        function calculate() {
            const children = document.getElementById('children').value;
            const age = document.getElementById('age').value;
            const careType = document.getElementById('careType').value;
            const location = document.getElementById('location').value;
            const hours = parseInt(document.getElementById('hours').value);
            const weeks = parseInt(document.getElementById('weeks').value);

            const care = careTypes[careType];
            const ageMult = ageMults[age];
            const locMult = locationMults[location];
            const childMult = childMults[children];
            const hoursMult = hours / 40;

            const weeklyBase = care.base * ageMult * locMult * childMult * hoursMult;
            const annualCost = weeklyBase * weeks;
            const monthlyCost = annualCost / 12;
            const hourlyCost = weeklyBase / hours;

            document.getElementById('annualCost').textContent = '$' + Math.round(annualCost).toLocaleString();
            document.getElementById('monthlyCost').textContent = '$' + Math.round(monthlyCost).toLocaleString();
            document.getElementById('weeklyCost').textContent = '$' + Math.round(weeklyBase);
            document.getElementById('hourlyCost').textContent = '$' + hourlyCost.toFixed(2);

            // Comparison grid
            let compareHTML = '';
            for (const [key, type] of Object.entries(careTypes)) {
                const weekly = type.base * ageMult * locMult * childMult * hoursMult;
                const annual = weekly * weeks;
                const isSelected = key === careType;
                compareHTML += `
                    <div class="compare-card" style="${isSelected ? 'border: 2px solid var(--secondary);' : ''}">
                        <div class="compare-title">${type.name}</div>
                        <div class="compare-price">$${Math.round(annual).toLocaleString()}/yr</div>
                        <div class="compare-detail">${type.desc} • $${Math.round(weekly)}/week</div>
                    </div>
                `;
            }
            document.getElementById('compareGrid').innerHTML = compareHTML;
        }

        calculate();
    </script>
</body>
</html>
