    <header class="header">
        <h1>📋 Tax Bracket Calculator</h1>
    </header>

    <div class="main-container">
        <div class="content-area">
            <div class="card">
                <h2>💵 Income Information</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Annual Taxable Income ($)</label>
                        <input type="number" id="income" value="85000" oninput="calculate()">
                    </div>
                    <div class="form-group">
                        <label>Filing Status</label>
                        <select id="status" onchange="calculate()">
                            <option value="single">Single</option>
                            <option value="married">Married Filing Jointly</option>
                            <option value="head">Head of Household</option>
                        </select>
                    </div>
                </div>
                
                <div class="results-grid">
                    <div class="result-card highlight">
                        <div class="result-value" id="bracket">0%</div>
                        <div class="result-label">Marginal Tax Rate</div>
                    </div>
                    <div class="result-card">
                        <div class="result-value" id="effectiveRate">0%</div>
                        <div class="result-label">Effective Tax Rate</div>
                    </div>
                    <div class="result-card">
                        <div class="result-value" id="totalTax">$0</div>
                        <div class="result-label">Total Federal Tax</div>
                    </div>
                </div>
                
                <div class="bracket-bar">
                    <h3 style="color: var(--secondary); margin-bottom: 10px;">Tax by Bracket</h3>
                    <div class="bar-segment" id="barSegment"></div>
                </div>
            </div>

            <div class="card">
                <h2>📊 2024 Federal Tax Brackets</h2>
                <div class="brackets-table" id="bracketsTable"></div>
            </div>

            </div>

            <div class="card">
                <h2>🔗 Related Tools</h2>
                <div class="related-tools">
                    <a href="paycheck-calculator.html" class="related-link">💵 Paycheck Calculator</a>
                    <a href="salary-calculator.html" class="related-link">💰 Salary Calculator</a>
                    <a href="tax-calculator.html" class="related-link">🧾 Tax Calculator</a>
                    <a href="retirement-calculator.html" class="related-link">👴 Retirement</a>
                </div>
            </div>
        </div>

        <div class="sidebar">
            </div>
        </div>
    </div>

    <script>
        const brackets2024 = {
            single: [
                { min: 0, max: 11600, rate: 0.10 },
                { min: 11600, max: 47150, rate: 0.12 },
                { min: 47150, max: 100525, rate: 0.22 },
                { min: 100525, max: 191950, rate: 0.24 },
                { min: 191950, max: 243725, rate: 0.32 },
                { min: 243725, max: 609350, rate: 0.35 },
                { min: 609350, max: Infinity, rate: 0.37 }
            ],
            married: [
                { min: 0, max: 23200, rate: 0.10 },
                { min: 23200, max: 94300, rate: 0.12 },
                { min: 94300, max: 201050, rate: 0.22 },
                { min: 201050, max: 383900, rate: 0.24 },
                { min: 383900, max: 487450, rate: 0.32 },
                { min: 487450, max: 731200, rate: 0.35 },
                { min: 731200, max: Infinity, rate: 0.37 }
            ],
            head: [
                { min: 0, max: 16550, rate: 0.10 },
                { min: 16550, max: 63100, rate: 0.12 },
                { min: 63100, max: 100500, rate: 0.22 },
                { min: 100500, max: 191950, rate: 0.24 },
                { min: 191950, max: 243700, rate: 0.32 },
                { min: 243700, max: 609350, rate: 0.35 },
                { min: 609350, max: Infinity, rate: 0.37 }
            ]
        };
        
        const colors = ['#10b981', '#22d3ee', '#6366f1', '#a855f7', '#ec4899', '#f59e0b', '#ef4444'];
        
        function calculate() {
            const income = parseFloat(document.getElementById('income').value) || 0;
            const status = document.getElementById('status').value;
            const brackets = brackets2024[status];
            
            let totalTax = 0;
            let currentBracket = 0;
            const taxByBracket = [];
            
            for (let i = 0; i < brackets.length; i++) {
                const bracket = brackets[i];
                if (income > bracket.min) {
                    const taxableInBracket = Math.min(income, bracket.max) - bracket.min;
                    const taxInBracket = taxableInBracket * bracket.rate;
                    totalTax += taxInBracket;
                    if (income > bracket.min) currentBracket = i;
                    if (taxInBracket > 0) {
                        taxByBracket.push({ rate: bracket.rate, amount: taxInBracket });
                    }
                }
            }
            
            const effectiveRate = income > 0 ? (totalTax / income * 100) : 0;
            
            document.getElementById('bracket').textContent = (brackets[currentBracket].rate * 100) + '%';
            document.getElementById('effectiveRate').textContent = effectiveRate.toFixed(1) + '%';
            document.getElementById('totalTax').textContent = '$' + totalTax.toLocaleString(undefined, {maximumFractionDigits: 0});
            
            // Generate bar
            let barHtml = '';
            taxByBracket.forEach((t, i) => {
                const width = (t.amount / totalTax * 100);
                barHtml += `<div style="width: ${width}%; background: ${colors[i]};">${(t.rate * 100)}%</div>`;
            });
            document.getElementById('barSegment').innerHTML = barHtml;
            
            // Generate table
            let tableHtml = '<table><thead><tr><th>Rate</th><th>Income Range</th><th>Tax in Bracket</th></tr></thead><tbody>';
            for (let i = 0; i < brackets.length; i++) {
                const b = brackets[i];
                const isCurrent = i === currentBracket;
                const taxable = income > b.min ? Math.min(income, b.max) - b.min : 0;
                const tax = taxable * b.rate;
                const maxStr = b.max === Infinity ? '+' : '$' + b.max.toLocaleString();
                tableHtml += `<tr class="${isCurrent ? 'current' : ''}">
                    <td>${(b.rate * 100)}%</td>
                    <td>$${b.min.toLocaleString()} - ${maxStr}</td>
                    <td>${tax > 0 ? '$' + tax.toLocaleString(undefined, {maximumFractionDigits: 0}) : '-'}</td>
                </tr>`;
            }
            tableHtml += '</tbody></table>';
            document.getElementById('bracketsTable').innerHTML = tableHtml;
        }
        
        calculate();
    </script>
