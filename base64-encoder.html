    <header class="header">
        <h1>🔐 Base64 Encoder & Decoder</h1>

    <div class="main-container">
        <div class="content-area">
            <div class="card">
                <h2>🔄 Convert Base64</h2>
                <div class="tabs">
                    <div class="tab active" onclick="setMode('encode')">Encode</div>
                    <div class="tab" onclick="setMode('decode')">Decode</div>
                </div>
                
                <div class="form-group">
                    <label id="inputLabel">Text to Encode</label>
                    <textarea id="inputText" placeholder="Enter your text here..."></textarea>
                </div>
                
                <button class="swap-btn" onclick="swapValues()">⇅</button>
                
                <div class="form-group">
                    <label id="outputLabel">Base64 Output</label>
                    <textarea id="outputText" readonly placeholder="Result will appear here..."></textarea>
                </div>
                
                <div class="action-buttons">
                    <button class="action-btn primary" onclick="convert()">🔄 Convert</button>
                    <button class="action-btn success" onclick="copyOutput()">📋 Copy Result</button>
                    <button class="action-btn secondary" onclick="clearAll()">🗑️ Clear</button>
                </div>
                
                <div class="stats">
                    <div class="stat">
                        <div class="stat-label">Input Length</div>
                        <div class="stat-value" id="inputLength">0 chars</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">Output Length</div>
                        <div class="stat-value" id="outputLength">0 chars</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">Size Change</div>
                        <div class="stat-value" id="sizeChange">0%</div>
                    </div>
                </div>

    <script>
        let mode = 'encode';

        function setMode(newMode) {
            mode = newMode;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            
            if (mode === 'encode') {
                document.getElementById('inputLabel').textContent = 'Text to Encode';
                document.getElementById('outputLabel').textContent = 'Base64 Output';
                document.getElementById('inputText').placeholder = 'Enter your text here...';
            } else {
                document.getElementById('inputLabel').textContent = 'Base64 to Decode';
                document.getElementById('outputLabel').textContent = 'Decoded Text';
                document.getElementById('inputText').placeholder = 'Enter Base64 string here...';
            }
            convert();
        }

        function convert() {
            const input = document.getElementById('inputText').value;
            let output = '';
            
            try {
                if (mode === 'encode') {
                    output = btoa(unescape(encodeURIComponent(input)));
                } else {
                    output = decodeURIComponent(escape(atob(input)));
                }
                document.getElementById('outputText').value = output;
            } catch (e) {
                document.getElementById('outputText').value = 'Error: Invalid input for ' + mode + 'ing';
            }
            
            updateStats();
        }

        function swapValues() {
            const input = document.getElementById('inputText').value;
            const output = document.getElementById('outputText').value;
            document.getElementById('inputText').value = output;
            document.getElementById('outputText').value = input;
            mode = mode === 'encode' ? 'decode' : 'encode';
            setMode(mode);
        }

        function copyOutput() {
            const output = document.getElementById('outputText');
            output.select();
            document.execCommand('copy');
        }

        function clearAll() {
            document.getElementById('inputText').value = '';
            document.getElementById('outputText').value = '';
            updateStats();
        }

        function updateStats() {
            const inputLen = document.getElementById('inputText').value.length;
            const outputLen = document.getElementById('outputText').value.length;
            const change = inputLen > 0 ? Math.round((outputLen - inputLen) / inputLen * 100) : 0;
            
            document.getElementById('inputLength').textContent = inputLen + ' chars';
            document.getElementById('outputLength').textContent = outputLen + ' chars';
            document.getElementById('sizeChange').textContent = (change >= 0 ? '+' : '') + change + '%';
        }

        document.getElementById('inputText').addEventListener('input', convert);
    </script>
