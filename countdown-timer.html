    <header class="header">
        <h1>⏳ Countdown Timer</h1>
        <p>Create countdowns for events, holidays, and special occasions.</p>
    </header>

    <div class="main-container">
        <div class="content-area">
            <div class="card">
                <div class="countdown-display">
                    <div class="event-name" id="eventName">Your Event</div>
                    <div class="countdown-units">
                        <div class="countdown-unit">
                            <div class="countdown-value" id="days">0</div>
                            <div class="countdown-label">Days</div>
                        </div>
                        <div class="countdown-unit">
                            <div class="countdown-value" id="hours">0</div>
                            <div class="countdown-label">Hours</div>
                        </div>
                        <div class="countdown-unit">
                            <div class="countdown-value" id="minutes">0</div>
                            <div class="countdown-label">Minutes</div>
                        </div>
                        <div class="countdown-unit">
                            <div class="countdown-value" id="seconds">0</div>
                            <div class="countdown-label">Seconds</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card">
                <h2>⚙️ Set Your Countdown</h2>
                <div class="form-group">
                    <label>Event Name</label>
                    <input type="text" id="eventInput" placeholder="My Event" oninput="updateEventName()">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Date</label>
                        <input type="date" id="dateInput" onchange="startCountdown()">
                    </div>
                    <div class="form-group">
                        <label>Time (optional)</label>
                        <input type="time" id="timeInput" onchange="startCountdown()">
                    </div>
                </div>
                
                <h3 style="color: var(--text-secondary); margin-bottom: 15px;">Quick Presets</h3>
                <div class="presets">
                    <button class="preset-btn" onclick="setPreset('newyear')">🎆 New Year</button>
                    <button class="preset-btn" onclick="setPreset('christmas')">🎄 Christmas</button>
                    <button class="preset-btn" onclick="setPreset('valentine')">❤️ Valentine's</button>
                    <button class="preset-btn" onclick="setPreset('halloween')">🎃 Halloween</button>
                </div>
            </div>

            </div>

            <div class="card">
                <h2>🔗 Related Tools</h2>
                <div class="related-tools">
                    <a href="date-calculator.html" class="related-link">📅 Date Calculator</a>
                    <a href="age-calculator.html" class="related-link">🎂 Age Calculator</a>
                    <a href="stopwatch.html" class="related-link">⏱️ Stopwatch</a>
                    <a href="pomodoro-timer.html" class="related-link">🍅 Pomodoro Timer</a>
                    <a href="time-zone-converter.html" class="related-link">🌍 Time Zones</a>
                </div>
            </div>
        </div>

        <div class="sidebar">
            </div>
        </div>
    </div>

    <script>
        let targetDate = null;
        let interval = null;
        
        function updateEventName() {
            const name = document.getElementById('eventInput').value || 'Your Event';
            document.getElementById('eventName').textContent = name;
        }
        
        function startCountdown() {
            const date = document.getElementById('dateInput').value;
            const time = document.getElementById('timeInput').value || '00:00';
            
            if (!date) return;
            
            targetDate = new Date(date + 'T' + time);
            
            if (interval) clearInterval(interval);
            interval = setInterval(updateCountdown, 1000);
            updateCountdown();
        }
        
        function updateCountdown() {
            if (!targetDate) return;
            
            const now = new Date();
            const diff = targetDate - now;
            
            if (diff <= 0) {
                document.getElementById('days').textContent = '0';
                document.getElementById('hours').textContent = '0';
                document.getElementById('minutes').textContent = '0';
                document.getElementById('seconds').textContent = '0';
                clearInterval(interval);
                return;
            }
            
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);
            
            document.getElementById('days').textContent = days;
            document.getElementById('hours').textContent = hours;
            document.getElementById('minutes').textContent = minutes;
            document.getElementById('seconds').textContent = seconds;
        }
        
        function setPreset(type) {
            const now = new Date();
            let year = now.getFullYear();
            let month, day, name;
            
            switch(type) {
                case 'newyear':
                    month = '01'; day = '01'; name = '🎆 New Year'; year++;
                    break;
                case 'christmas':
                    month = '12'; day = '25'; name = '🎄 Christmas';
                    if (now.getMonth() === 11 && now.getDate() > 25) year++;
                    break;
                case 'valentine':
                    month = '02'; day = '14'; name = "❤️ Valentine's Day";
                    if (now.getMonth() > 1 || (now.getMonth() === 1 && now.getDate() > 14)) year++;
                    break;
                case 'halloween':
                    month = '10'; day = '31'; name = '🎃 Halloween';
                    if (now.getMonth() > 9 || (now.getMonth() === 9 && now.getDate() > 31)) year++;
                    break;
            }
            
            document.getElementById('eventInput').value = name;
            document.getElementById('dateInput').value = `${year}-${month}-${day}`;
            document.getElementById('timeInput').value = '00:00';
            updateEventName();
            startCountdown();
        }
        
        // Set default to tomorrow
        const tomorrow = new Date();
        tomorrow.setDate(tomorrow.getDate() + 1);
        document.getElementById('dateInput').value = tomorrow.toISOString().split('T')[0];
        startCountdown();
    </script>
