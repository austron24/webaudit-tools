        :root { --primary: #6366f1; --primary-dark: #4f46e5; --secondary: #22d3ee; --accent: #f59e0b; --bg-dark: #0f172a; --bg-card: #1e293b; --bg-input: #334155; --text-primary: #f1f5f9; --text-secondary: #94a3b8; --border: #475569; --success: #10b981; --error: #ef4444; }

        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg-dark); color: var(--text-primary); min-height: 100vh; line-height: 1.6; }
        .ad-container { background: var(--bg-card); padding: 10px; text-align: center; margin: 10px 0; border-radius: 8px; }
        .ad-label { font-size: 10px; color: var(--text-secondary); margin-bottom: 5px; }
        .header { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); padding: 40px 20px; text-align: center; }
        .header h1 { font-size: 2.5rem; margin-bottom: 10px; }
        .main-container { max-width: 1200px; margin: 0 auto; padding: 20px; display: grid; grid-template-columns: 1fr 160px; gap: 20px; }
        .content-area { display: flex; flex-direction: column; gap: 20px; }
        .sidebar { display: flex; flex-direction: column; gap: 20px; }
        .card { background: var(--bg-card); border-radius: 16px; padding: 24px; }
        .card h2 { color: var(--secondary); margin-bottom: 20px; font-size: 1.3rem; }
        .comparison-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 6px; color: var(--text-secondary); font-size: 0.9rem; }
        input { width: 100%; padding: 12px; border: 2px solid var(--border); border-radius: 8px; font-size: 1rem; background: var(--bg-input); color: var(--text-primary); }
        input:focus { outline: none; border-color: var(--primary); }
        .section-title { color: var(--secondary); font-size: 1.1rem; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 2px solid var(--border); }
        .rent-section .section-title { color: var(--error); }
        .buy-section .section-title { color: var(--success); }
        .verdict { margin-top: 20px; padding: 30px; border-radius: 16px; text-align: center; }
        .verdict.rent { background: linear-gradient(135deg, var(--error), #dc2626); }
        .verdict.buy { background: linear-gradient(135deg, var(--success), #059669); }
        .verdict-title { font-size: 1.5rem; font-weight: 800; color: white; margin-bottom: 10px; }
        .verdict-savings { font-size: 1.2rem; color: rgba(255,255,255,0.9); }
        .results-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .result-card { background: var(--bg-input); padding: 20px; border-radius: 12px; text-align: center; }
        .result-value { font-size: 1.5rem; font-weight: 700; }
        .result-label { color: var(--text-secondary); margin-top: 5px; font-size: 0.9rem; }
        .rent-value { color: var(--error); }
        .buy-value { color: var(--success); }
        .related-tools { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-top: 15px; }
        .related-link { display: block; padding: 12px 16px; background: var(--bg-input); border-radius: 8px; color: var(--text-primary); text-decoration: none; }
        .related-link:hover { background: var(--primary); }
        @media (max-width: 968px) { .main-container { grid-template-columns: 1fr; } .sidebar { display: none; } }
        @media (max-width: 640px) { .comparison-grid { grid-template-columns: 1fr; } .results-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

        <div class="ad-label">Advertisement</div>

        <script type="text/javascript" src="//www.highperformanceformat.com/b43e7cf5057864a264961884e1f34530/invoke.js"></script>
    </div>
    <div class="ad-container" style="display: none;">
        <div class="ad-label">Advertisement</div>
        <script type="text/javascript">atOptions = { 'key': '9f6b66d433cad4c02b643bdd4b7eefc0', 'format': 'iframe', 'height': 50, 'width': 320, 'params': {} };</script>
        <script type="text/javascript" src="//www.highperformanceformat.com/9f6b66d433cad4c02b643bdd4b7eefc0/invoke.js"></script>
    </div>
    <style>@media (max-width: 728px) { .ad-container:first-child { display: none !important; } .ad-container:nth-child(2) { display: block !important; } }</style>
    
    <header class="header">
        <h1>🏠 Rent vs Buy Calculator</h1>
    </header>

    <div class="main-container">
        <div class="content-area">
            <div class="card">
                <h2>📊 Compare Your Options</h2>
                <div class="comparison-grid">
                    <div class="rent-section">
                        <div class="section-title">🏢 Renting</div>
                        <div class="form-group">
                            <label>Monthly Rent ($)</label>
                            <input type="number" id="monthlyRent" value="2000" oninput="calculate()">
                        </div>
                        <div class="form-group">
                            <label>Annual Rent Increase (%)</label>
                            <input type="number" id="rentIncrease" value="3" step="0.5" oninput="calculate()">
                        </div>
                        <div class="form-group">
                            <label>Renter's Insurance ($/month)</label>
                            <input type="number" id="rentersInsurance" value="25" oninput="calculate()">
                        </div>
                    </div>
                    
                    <div class="buy-section">
                        <div class="section-title">🏡 Buying</div>
                        <div class="form-group">
                            <label>Home Price ($)</label>
                            <input type="number" id="homePrice" value="400000" oninput="calculate()">
                        </div>
                        <div class="form-group">
                            <label>Down Payment (%)</label>
                            <input type="number" id="downPayment" value="20" oninput="calculate()">
                        </div>
                        <div class="form-group">
                            <label>Interest Rate (%)</label>
                            <input type="number" id="interestRate" value="6.5" step="0.1" oninput="calculate()">
                        </div>
                        <div class="form-group">
                            <label>Property Tax (%/year)</label>
                            <input type="number" id="propertyTax" value="1.2" step="0.1" oninput="calculate()">
                        </div>
                        <div class="form-group">
                            <label>Home Insurance ($/month)</label>
                            <input type="number" id="homeInsurance" value="150" oninput="calculate()">
                        </div>
                        <div class="form-group">
                            <label>HOA ($/month)</label>
                            <input type="number" id="hoa" value="0" oninput="calculate()">
                        </div>
                    </div>
                </div>
                
                <div class="form-group" style="margin-top: 20px;">
                    <label>Years to Compare</label>
                    <input type="number" id="years" value="7" min="1" max="30" oninput="calculate()">
                </div>
                
                <div class="verdict" id="verdict">
                    <div class="verdict-title" id="verdictTitle">Calculating...</div>
                    <div class="verdict-savings" id="verdictSavings"></div>
                </div>
                
                <div class="results-grid">
                    <div class="result-card">
                        <div class="result-value rent-value" id="totalRentCost">$0</div>
                        <div class="result-label">Total Rent Cost</div>
                    </div>
                    <div class="result-card">
                        <div class="result-value buy-value" id="totalBuyCost">$0</div>
                        <div class="result-label">Total Buy Cost</div>
                    </div>
                    <div class="result-card">
                        <div class="result-value" id="monthlyMortgage">$0</div>
                        <div class="result-label">Monthly Mortgage</div>
                    </div>
                    <div class="result-card">
                        <div class="result-value" id="equityBuilt">$0</div>
                        <div class="result-label">Equity Built</div>
                    </div>
                </div>
            </div>

            <div class="ad-container">
                <div class="ad-label">Advertisement</div>
                <script type="text/javascript">atOptions = { 'key': 'ee368c7cdf94f06bc71fdf57fe4124b8', 'format': 'iframe', 'height': 250, 'width': 300, 'params': {} };</script>
                <script type="text/javascript" src="//www.highperformanceformat.com/ee368c7cdf94f06bc71fdf57fe4124b8/invoke.js"></script>
            </div>

            <div class="card">
                <h2>🔗 Related Tools</h2>
                <div class="related-tools">
                    <a href="mortgage-calculator.html" class="related-link">🏠 Mortgage Calculator</a>
                    <a href="home-value-calculator.html" class="related-link">💰 Home Value</a>
                    <a href="amortization-calculator.html" class="related-link">📊 Amortization</a>
                    <a href="savings-goal-calculator.html" class="related-link">🎯 Savings Goal</a>
                </div>
            </div>
        </div>

        <div class="sidebar">
            <div class="ad-container">
                <div class="ad-label">Advertisement</div>
                <script type="text/javascript">atOptions = { 'key': 'd4702b3e9743f9cd914a00e5026493f3', 'format': 'iframe', 'height': 600, 'width': 160, 'params': {} };</script>
                <script type="text/javascript" src="//www.highperformanceformat.com/d4702b3e9743f9cd914a00e5026493f3/invoke.js"></script>
            </div>
        </div>
    </div>

    <script>
        function calculate() {
            const monthlyRent = parseFloat(document.getElementById('monthlyRent').value) || 0;
            const rentIncrease = parseFloat(document.getElementById('rentIncrease').value) / 100 || 0;
            const rentersInsurance = parseFloat(document.getElementById('rentersInsurance').value) || 0;
            
            const homePrice = parseFloat(document.getElementById('homePrice').value) || 0;
            const downPaymentPct = parseFloat(document.getElementById('downPayment').value) / 100 || 0;
            const interestRate = parseFloat(document.getElementById('interestRate').value) / 100 || 0;
            const propertyTax = parseFloat(document.getElementById('propertyTax').value) / 100 || 0;
            const homeInsurance = parseFloat(document.getElementById('homeInsurance').value) || 0;
            const hoa = parseFloat(document.getElementById('hoa').value) || 0;
            const years = parseInt(document.getElementById('years').value) || 7;
            
            // Calculate mortgage
            const downPayment = homePrice * downPaymentPct;
            const loanAmount = homePrice - downPayment;
            const monthlyRate = interestRate / 12;
            const numPayments = 30 * 12;
            
            let monthlyMortgage = 0;
            if (monthlyRate > 0) {
                monthlyMortgage = loanAmount * (monthlyRate * Math.pow(1 + monthlyRate, numPayments)) / (Math.pow(1 + monthlyRate, numPayments) - 1);
            } else {
                monthlyMortgage = loanAmount / numPayments;
            }
            
            const monthlyPropertyTax = (homePrice * propertyTax) / 12;
            const totalMonthlyBuy = monthlyMortgage + monthlyPropertyTax + homeInsurance + hoa;
            
            // Calculate total costs over years
            let totalRentCost = 0;
            let currentRent = monthlyRent + rentersInsurance;
            for (let y = 0; y < years; y++) {
                totalRentCost += currentRent * 12;
                currentRent *= (1 + rentIncrease);
            }
            
            const totalBuyCost = downPayment + (totalMonthlyBuy * 12 * years);
            
            // Calculate equity built (simplified)
            let balance = loanAmount;
            for (let m = 0; m < years * 12; m++) {
                const interest = balance * monthlyRate;
                const principal = monthlyMortgage - interest;
                balance -= principal;
            }
            const equityBuilt = downPayment + (loanAmount - balance);
            
            // Net cost considering equity
            const netBuyCost = totalBuyCost - equityBuilt;
            
            document.getElementById('totalRentCost').textContent = '$' + totalRentCost.toLocaleString(undefined, {maximumFractionDigits: 0});
            document.getElementById('totalBuyCost').textContent = '$' + totalBuyCost.toLocaleString(undefined, {maximumFractionDigits: 0});
            document.getElementById('monthlyMortgage').textContent = '$' + totalMonthlyBuy.toFixed(0);
            document.getElementById('equityBuilt').textContent = '$' + equityBuilt.toLocaleString(undefined, {maximumFractionDigits: 0});
            
            const verdict = document.getElementById('verdict');
            const savings = Math.abs(netBuyCost - totalRentCost);
            
            if (netBuyCost < totalRentCost) {
                verdict.className = 'verdict buy';
                document.getElementById('verdictTitle').textContent = '🏡 Buying is Better!';
                document.getElementById('verdictSavings').textContent = `You could save $${savings.toLocaleString(undefined, {maximumFractionDigits: 0})} over ${years} years`;
            } else {
                verdict.className = 'verdict rent';
                document.getElementById('verdictTitle').textContent = '🏢 Renting is Better!';
                document.getElementById('verdictSavings').textContent = `You could save $${savings.toLocaleString(undefined, {maximumFractionDigits: 0})} over ${years} years`;
            }
        }
        
        calculate();
    </script>
