<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Coin Flip & Dice Roller - Random Decision Maker</title>
    <meta name="description" content="Flip a coin or roll dice online. Heads or tails, multiple dice types (D4, D6, D8, D10, D12, D20). Free random decision maker.">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #f59e0b 100%);
            min-height: 100vh;
            color: #f8fafc;
        }
        .container { max-width: 700px; margin: 0 auto; padding: 40px 20px; }
        header { text-align: center; margin-bottom: 30px; }
        h1 { font-size: 36px; margin-bottom: 10px; }
        .subtitle { font-size: 16px; opacity: 0.9; }
        .tabs {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 25px;
        }
        .tab {
            padding: 12px 30px;
            background: rgba(255,255,255,0.2);
            border: none;
            border-radius: 50px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab.active { background: white; color: #f59e0b; }
        .tab:hover:not(.active) { background: rgba(255,255,255,0.3); }
        .panel {
            background: white;
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            color: #1e293b;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            display: none;
        }
        .panel.active { display: block; }
        .coin {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            margin: 30px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            background: linear-gradient(145deg, #fcd34d, #f59e0b);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.6s;
        }
        .coin.flipping {
            animation: flip 0.6s ease-out;
        }
        @keyframes flip {
            0% { transform: rotateY(0); }
            50% { transform: rotateY(1800deg) scale(0.8); }
            100% { transform: rotateY(3600deg); }
        }
        .result-text {
            font-size: 36px;
            font-weight: bold;
            color: #f59e0b;
            margin: 20px 0;
        }
        .stats {
            display: flex;
            gap: 30px;
            justify-content: center;
            margin-top: 20px;
            color: #64748b;
        }
        .stat span { font-weight: bold; color: #1e293b; }
        .dice-options {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .dice-btn {
            padding: 10px 20px;
            border: 3px solid #e2e8f0;
            background: white;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .dice-btn.active {
            border-color: #f59e0b;
            background: #fef3c7;
        }
        .dice-btn:hover { border-color: #f59e0b; }
        .dice-display {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 30px 0;
        }
        .die {
            width: 80px;
            height: 80px;
            background: linear-gradient(145deg, #fcd34d, #f59e0b);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            color: white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .die.rolling {
            animation: roll 0.5s ease-out;
        }
        @keyframes roll {
            0%, 100% { transform: rotate(0); }
            25% { transform: rotate(20deg); }
            75% { transform: rotate(-20deg); }
        }
        .dice-count {
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
            margin-bottom: 15px;
        }
        .dice-count label { color: #64748b; }
        .dice-count input {
            width: 60px;
            padding: 8px;
            text-align: center;
            border: 2px solid #e2e8f0;
            border-radius: 6px;
            font-size: 16px;
        }
        .total {
            font-size: 24px;
            color: #f59e0b;
            margin-top: 15px;
        }
        .btn {
            padding: 18px 50px;
            border: none;
            border-radius: 50px;
            font-size: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            background: #f59e0b;
            color: white;
            margin-top: 20px;
        }
        .btn:hover { background: #d97706; transform: scale(1.05); }
        .tools-promo {
            background: white;
            border-radius: 12px;
            padding: 20px;
            color: #1e293b;
            margin-top: 25px;
        }
        .tools-promo h4 { color: #f59e0b; margin-bottom: 10px; }
        .tools-promo a {
            display: inline-block;
            margin: 5px 10px 5px 0;
            color: #d97706;
            text-decoration: none;
        }
        .tools-promo a:hover { text-decoration: underline; }
        footer { text-align: center; padding: 30px 20px; opacity: 0.8; font-size: 14px; }
        footer a { color: #fcd34d; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Coin Flip & Dice</h1>
            <p class="subtitle">Make random decisions instantly</p>
        </header>

        <div class="tabs">
            <button class="tab active" onclick="showTab('coin')">🪙 Coin Flip</button>
            <button class="tab" onclick="showTab('dice')">🎲 Dice Roller</button>
        </div>

        <div class="panel active" id="coinPanel">
            <div class="coin" id="coin">🪙</div>
            <div class="result-text" id="coinResult">Flip the coin!</div>
            <button class="btn" onclick="flipCoin()">Flip Coin</button>
            <div class="stats">
                <div>Heads: <span id="headsCount">0</span></div>
                <div>Tails: <span id="tailsCount">0</span></div>
                <div>Total: <span id="totalFlips">0</span></div>
            </div>
        </div>

        <div class="panel" id="dicePanel">
            <div class="dice-options">
                <button class="dice-btn active" onclick="setDice(6, this)">D6</button>
                <button class="dice-btn" onclick="setDice(4, this)">D4</button>
                <button class="dice-btn" onclick="setDice(8, this)">D8</button>
                <button class="dice-btn" onclick="setDice(10, this)">D10</button>
                <button class="dice-btn" onclick="setDice(12, this)">D12</button>
                <button class="dice-btn" onclick="setDice(20, this)">D20</button>
                <button class="dice-btn" onclick="setDice(100, this)">D100</button>
            </div>
            <div class="dice-count">
                <label>Number of dice:</label>
                <input type="number" id="diceCount" value="1" min="1" max="10">
            </div>
            <div class="dice-display" id="diceDisplay">
                <div class="die">?</div>
            </div>
            <div class="total" id="diceTotal"></div>
            <button class="btn" onclick="rollDice()">Roll Dice</button>
        </div>

        <div class="tools-promo">
            <h4>More Random Tools</h4>
            <a href="random-number.html">Random Number</a>
            <a href="uuid-generator.html">UUID Generator</a>
            <a href="password-generator.html">Password Generator</a>
            <a href="index.html">View All 60+ Tools</a>
        </div>
    </div>

    <footer>
        <p>Coin Flip & Dice by WebAudit Pro</p>
        <p><a href="index.html">More Free Tools</a> | <a href="https://fiverr.com/austron24">Professional Audits</a></p>
    </footer>

    <script>
        let headsCount = 0;
        let tailsCount = 0;
        let currentDice = 6;

        function showTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(tab + 'Panel').classList.add('active');
        }

        function flipCoin() {
            const coin = document.getElementById('coin');
            const result = document.getElementById('coinResult');

            coin.classList.add('flipping');

            setTimeout(() => {
                const isHeads = Math.random() < 0.5;
                coin.textContent = isHeads ? '👑' : '🦅';
                result.textContent = isHeads ? 'HEADS!' : 'TAILS!';

                if (isHeads) headsCount++;
                else tailsCount++;

                document.getElementById('headsCount').textContent = headsCount;
                document.getElementById('tailsCount').textContent = tailsCount;
                document.getElementById('totalFlips').textContent = headsCount + tailsCount;

                coin.classList.remove('flipping');
            }, 600);
        }

        function setDice(sides, btn) {
            currentDice = sides;
            document.querySelectorAll('.dice-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function rollDice() {
            const count = parseInt(document.getElementById('diceCount').value) || 1;
            const display = document.getElementById('diceDisplay');
            const results = [];

            for (let i = 0; i < count; i++) {
                results.push(Math.floor(Math.random() * currentDice) + 1);
            }

            display.innerHTML = results.map(r =>
                `<div class="die rolling">${r}</div>`
            ).join('');

            const total = results.reduce((a, b) => a + b, 0);
            document.getElementById('diceTotal').textContent =
                count > 1 ? `Total: ${total}` : '';

            setTimeout(() => {
                document.querySelectorAll('.die').forEach(d => d.classList.remove('rolling'));
            }, 500);
        }
    </script>
</body>
</html>
