    <header class="header">
        <h1>Heart Rate Zone Calculator</h1>
    </header>

    <div class="main-container">
        <div class="content-area">
            <div class="card">
                <h2>Your Information</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Age (years)</label>
                        <input type="number" id="age" value="30" min="10" max="100" oninput="calculate()">
                    </div>
                    <div class="form-group">
                        <label>Resting Heart Rate (bpm)</label>
                        <input type="number" id="restingHR" value="65" min="40" max="120" oninput="calculate()">
                    </div>
                    <div class="form-group">
                        <label>Calculation Method</label>
                        <select id="method" onchange="calculate()">
                            <option value="standard">Standard (220-age)</option>
                            <option value="tanaka">Tanaka (208-0.7×age)</option>
                            <option value="karvonen" selected>Karvonen (Heart Rate Reserve)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Fitness Level</label>
                        <select id="fitness" onchange="calculate()">
                            <option value="beginner">Beginner</option>
                            <option value="intermediate" selected>Intermediate</option>
                            <option value="advanced">Advanced</option>
                            <option value="athlete">Athlete</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="result-hero">
                <div class="result-hero-label">Maximum Heart Rate</div>
                <div class="result-hero-value" id="maxHR">0 bpm</div>
            </div>

            <div class="card">
                <h2>Your Training Zones</h2>
                <div class="zone-grid" id="zoneGrid"></div>
            </div>

                    <a href="calorie-calculator.html" class="related-link">Calorie Calculator</a>

                    <a href="running-pace-calculator.html" class="related-link">Running Pace</a>
                    <a href="tdee-calculator.html" class="related-link">TDEE Calculator</a>
                </div>
            </div>
        </div>

        <div class="sidebar">
            </div>
        </div>
    </div>

    <script>
        const zones = [
            { num: 1, name: 'Recovery Zone', desc: 'Very light activity, warm-up/cool-down', low: 50, high: 60 },
            { num: 2, name: 'Fat Burn Zone', desc: 'Light exercise, builds endurance', low: 60, high: 70 },
            { num: 3, name: 'Aerobic Zone', desc: 'Moderate exercise, improves cardiovascular fitness', low: 70, high: 80 },
            { num: 4, name: 'Anaerobic Zone', desc: 'Hard exercise, increases performance', low: 80, high: 90 },
            { num: 5, name: 'VO2 Max Zone', desc: 'Maximum effort, short bursts only', low: 90, high: 100 }
        ];

        function calculate() {
            const age = parseInt(document.getElementById('age').value) || 30;
            const restingHR = parseInt(document.getElementById('restingHR').value) || 65;
            const method = document.getElementById('method').value;
            const fitness = document.getElementById('fitness').value;

            let maxHR;
            if (method === 'standard') {
                maxHR = 220 - age;
            } else if (method === 'tanaka') {
                maxHR = 208 - (0.7 * age);
            } else {
                maxHR = 220 - age;
            }

            document.getElementById('maxHR').textContent = Math.round(maxHR) + ' bpm';

            let zoneHTML = '';
            zones.forEach(zone => {
                let lowHR, highHR;
                if (method === 'karvonen') {
                    const hrReserve = maxHR - restingHR;
                    lowHR = Math.round((hrReserve * zone.low / 100) + restingHR);
                    highHR = Math.round((hrReserve * zone.high / 100) + restingHR);
                } else {
                    lowHR = Math.round(maxHR * zone.low / 100);
                    highHR = Math.round(maxHR * zone.high / 100);
                }
                
                zoneHTML += `
                    <div class="zone-card zone-${zone.num}">
                        <div class="zone-number">Z${zone.num}</div>
                        <div>
                            <div class="zone-name">${zone.name}</div>
                            <div class="zone-desc">${zone.desc}</div>
                        </div>
                        <div class="zone-range">${lowHR}-${highHR} bpm</div>
                    </div>
                `;
            });
            document.getElementById('zoneGrid').innerHTML = zoneHTML;
        }

        calculate();
    </script>
