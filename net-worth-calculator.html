    <header class="header">
        <h1>💎 Net Worth Calculator</h1>

            <div class="result-hero" id="netWorthHero">
                <div class="result-hero-label">Your Net Worth</div>
                <div class="result-hero-value" id="netWorth">$0</div>
            </div>

            <div class="results-grid">
                <div class="result-card assets">
                    <div class="result-value" id="totalAssets">$0</div>
                    <div class="result-label">Total Assets</div>
                </div>
                <div class="result-card liabilities">
                    <div class="result-value" id="totalLiabilities">$0</div>
                    <div class="result-label">Total Liabilities</div>
                </div>
                <div class="result-card">
                    <div class="result-value" id="debtToAsset">0%</div>
                    <div class="result-label">Debt-to-Asset Ratio</div>
                </div>
            </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label>Cash & Checking ($)</label>
                        <input type="number" id="cash" value="5000" oninput="calculate()">
                    </div>
                    <div class="form-group">
                        <label>Savings Accounts ($)</label>
                        <input type="number" id="savings" value="15000" oninput="calculate()">
                    </div>
                    <div class="form-group">
                        <label>Investments ($)</label>
                        <input type="number" id="investments" value="50000" oninput="calculate()">
                    </div>
                    <div class="form-group">
                        <label>Retirement Accounts ($)</label>
                        <input type="number" id="retirement" value="75000" oninput="calculate()">
                    </div>
                    <div class="form-group">
                        <label>Home Value ($)</label>
                        <input type="number" id="homeValue" value="350000" oninput="calculate()">
                    </div>
                    <div class="form-group">
                        <label>Vehicle Value ($)</label>
                        <input type="number" id="vehicleValue" value="25000" oninput="calculate()">
                    </div>
                    <div class="form-group">
                        <label>Other Real Estate ($)</label>
                        <input type="number" id="otherRealEstate" value="0" oninput="calculate()">
                    </div>
                    <div class="form-group">
                        <label>Other Assets ($)</label>
                        <input type="number" id="otherAssets" value="5000" oninput="calculate()">
                    </div>
                </div>
                <div class="section-total">
                    <span>Total Assets</span>
                    <span style="color: var(--success);" id="assetTotal">$0</span>
                </div>
            </div>

            <div class="card">
                <h2 style="color: #ef4444;">📉 Liabilities</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Mortgage Balance ($)</label>
                        <input type="number" id="mortgage" value="250000" oninput="calculate()">
                    </div>
                    <div class="form-group">
                        <label>Auto Loans ($)</label>
                        <input type="number" id="autoLoans" value="15000" oninput="calculate()">
                    </div>
                    <div class="form-group">
                        <label>Student Loans ($)</label>
                        <input type="number" id="studentLoans" value="25000" oninput="calculate()">
                    </div>
                    <div class="form-group">
                        <label>Credit Card Debt ($)</label>
                        <input type="number" id="creditCards" value="5000" oninput="calculate()">
                    </div>
                    <div class="form-group">
                        <label>Personal Loans ($)</label>
                        <input type="number" id="personalLoans" value="0" oninput="calculate()">
                    </div>
                    <div class="form-group">
                        <label>Other Debts ($)</label>
                        <input type="number" id="otherDebts" value="0" oninput="calculate()">
                    </div>
                </div>
                <div class="section-total">
                    <span>Total Liabilities</span>
                    <span style="color: #ef4444;" id="liabilityTotal">$0</span>
                </div>
            </div>

    <script>
        function calculate() {
            const cash = parseFloat(document.getElementById('cash').value) || 0;
            const savings = parseFloat(document.getElementById('savings').value) || 0;
            const investments = parseFloat(document.getElementById('investments').value) || 0;
            const retirement = parseFloat(document.getElementById('retirement').value) || 0;
            const homeValue = parseFloat(document.getElementById('homeValue').value) || 0;
            const vehicleValue = parseFloat(document.getElementById('vehicleValue').value) || 0;
            const otherRealEstate = parseFloat(document.getElementById('otherRealEstate').value) || 0;
            const otherAssets = parseFloat(document.getElementById('otherAssets').value) || 0;

            const mortgage = parseFloat(document.getElementById('mortgage').value) || 0;
            const autoLoans = parseFloat(document.getElementById('autoLoans').value) || 0;
            const studentLoans = parseFloat(document.getElementById('studentLoans').value) || 0;
            const creditCards = parseFloat(document.getElementById('creditCards').value) || 0;
            const personalLoans = parseFloat(document.getElementById('personalLoans').value) || 0;
            const otherDebts = parseFloat(document.getElementById('otherDebts').value) || 0;

            const totalAssets = cash + savings + investments + retirement + homeValue + vehicleValue + otherRealEstate + otherAssets;
            const totalLiabilities = mortgage + autoLoans + studentLoans + creditCards + personalLoans + otherDebts;
            const netWorth = totalAssets - totalLiabilities;
            const debtToAsset = totalAssets > 0 ? (totalLiabilities / totalAssets) * 100 : 0;

            document.getElementById('netWorth').textContent = (netWorth >= 0 ? '$' : '-$') + Math.abs(Math.round(netWorth)).toLocaleString();
            document.getElementById('totalAssets').textContent = '$' + Math.round(totalAssets).toLocaleString();
            document.getElementById('totalLiabilities').textContent = '$' + Math.round(totalLiabilities).toLocaleString();
            document.getElementById('assetTotal').textContent = '$' + Math.round(totalAssets).toLocaleString();
            document.getElementById('liabilityTotal').textContent = '$' + Math.round(totalLiabilities).toLocaleString();
            document.getElementById('debtToAsset').textContent = debtToAsset.toFixed(1) + '%';

            const heroEl = document.getElementById('netWorthHero');
            heroEl.classList.remove('positive', 'negative');
            if (netWorth > 0) heroEl.classList.add('positive');
            else if (netWorth < 0) heroEl.classList.add('negative');
        }
        calculate();
    </script>
