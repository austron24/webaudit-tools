<body>
    </div>
    </div>

    <header class="header">
        <h1>Square Footage Calculator</h1>
    </header>

    <div class="main-container">
        <div class="content-area">
            <div class="card">
                <h2>Select Shape</h2>
                <div class="shape-selector">
                    <div class="shape-btn active" onclick="selectShape('rectangle')">Rectangle</div>
                    <div class="shape-btn" onclick="selectShape('circle')">Circle</div>
                    <div class="shape-btn" onclick="selectShape('triangle')">Triangle</div>
                    <div class="shape-btn" onclick="selectShape('trapezoid')">Trapezoid</div>
                </div>

                <div id="rectangleForm" class="shape-form">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Length</label>
                            <input type="number" id="rectLength" value="12" min="0" step="0.1" oninput="calculate()">
                        </div>
                        <div class="form-group">
                            <label>Width</label>
                            <input type="number" id="rectWidth" value="10" min="0" step="0.1" oninput="calculate()">
                        </div>
                    </div>
                </div>

                <div id="circleForm" class="shape-form" style="display:none;">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Radius (or Diameter/2)</label>
                            <input type="number" id="circleRadius" value="5" min="0" step="0.1" oninput="calculate()">
                        </div>
                    </div>
                </div>

                <div id="triangleForm" class="shape-form" style="display:none;">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Base</label>
                            <input type="number" id="triBase" value="10" min="0" step="0.1" oninput="calculate()">
                        </div>
                        <div class="form-group">
                            <label>Height</label>
                            <input type="number" id="triHeight" value="8" min="0" step="0.1" oninput="calculate()">
                        </div>
                    </div>
                </div>

                <div id="trapezoidForm" class="shape-form" style="display:none;">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Top Width</label>
                            <input type="number" id="trapTop" value="8" min="0" step="0.1" oninput="calculate()">
                        </div>
                        <div class="form-group">
                            <label>Bottom Width</label>
                            <input type="number" id="trapBottom" value="12" min="0" step="0.1" oninput="calculate()">
                        </div>
                        <div class="form-group">
                            <label>Height</label>
                            <input type="number" id="trapHeight" value="6" min="0" step="0.1" oninput="calculate()">
                        </div>
                    </div>
                </div>

                <div class="form-grid" style="margin-top: 15px;">
                    <div class="form-group">
                        <label>Unit</label>
                        <select id="unit" onchange="calculate()">
                            <option value="ft" selected>Feet</option>
                            <option value="in">Inches</option>
                            <option value="m">Meters</option>
                            <option value="cm">Centimeters</option>
                            <option value="yd">Yards</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="result-hero">
                <div class="result-hero-label">Total Area</div>
                <div class="result-hero-value" id="totalArea">120 sq ft</div>
            </div>

            <div class="results-grid">
                <div class="result-card">
                    <div class="result-value" id="sqMeters">11.15</div>
                    <div class="result-label">Square Meters</div>
                </div>
                <div class="result-card">
                    <div class="result-value" id="sqYards">13.33</div>
                    <div class="result-label">Square Yards</div>
                </div>
                <div class="result-card">
                    <div class="result-value" id="acres">0.003</div>
                    <div class="result-label">Acres</div>
                </div>
            </div>

            <div class="card">
                <h2>Multiple Rooms Calculator</h2>
                <div id="roomList"></div>
                <button class="btn" onclick="addRoom()" style="margin-top: 15px;">+ Add Current Room</button>
                <div style="margin-top: 20px; padding-top: 15px; border-top: 1px solid var(--border);">
                    <div style="display: flex; justify-content: space-between; font-size: 1.2rem;">
                        <span>Total All Rooms:</span>
                        <span id="grandTotal" style="font-weight: bold; color: var(--success);">0 sq ft</span>
                    </div>
                </div>
            </div>

            </div>

            <div class="card">
                <h2>Related Tools</h2>
                <div class="related-tools">
                    <a href="flooring-calculator.html" class="related-link">Flooring Calculator</a>
                    <a href="paint-calculator.html" class="related-link">Paint Calculator</a>
                    <a href="tile-calculator.html" class="related-link">Tile Calculator</a>
                    <a href="carpet-calculator.html" class="related-link">Carpet Calculator</a>
                </div>
            </div>
        </div>

        <div class="sidebar">
            </div>
        </div>
    </div>

    <script>
        let currentShape = 'rectangle';
        let rooms = [];

        const conversions = {
            ft: 1,
            in: 0.00694444,
            m: 10.7639,
            cm: 0.00107639,
            yd: 9
        };

        function selectShape(shape) {
            currentShape = shape;
            document.querySelectorAll('.shape-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            document.querySelectorAll('.shape-form').forEach(form => form.style.display = 'none');
            document.getElementById(shape + 'Form').style.display = 'block';
            calculate();
        }

        function calculate() {
            const unit = document.getElementById('unit').value;
            const conv = conversions[unit];
            let area = 0;
            let dims = '';

            if (currentShape === 'rectangle') {
                const length = parseFloat(document.getElementById('rectLength').value) || 0;
                const width = parseFloat(document.getElementById('rectWidth').value) || 0;
                area = length * width * conv;
                dims = `${length} × ${width} ${unit}`;
            } else if (currentShape === 'circle') {
                const radius = parseFloat(document.getElementById('circleRadius').value) || 0;
                area = Math.PI * radius * radius * conv;
                dims = `radius ${radius} ${unit}`;
            } else if (currentShape === 'triangle') {
                const base = parseFloat(document.getElementById('triBase').value) || 0;
                const height = parseFloat(document.getElementById('triHeight').value) || 0;
                area = 0.5 * base * height * conv;
                dims = `${base} × ${height} ${unit}`;
            } else if (currentShape === 'trapezoid') {
                const top = parseFloat(document.getElementById('trapTop').value) || 0;
                const bottom = parseFloat(document.getElementById('trapBottom').value) || 0;
                const height = parseFloat(document.getElementById('trapHeight').value) || 0;
                area = 0.5 * (top + bottom) * height * conv;
                dims = `${top}/${bottom} × ${height} ${unit}`;
            }

            document.getElementById('totalArea').textContent = area.toFixed(2) + ' sq ft';
            document.getElementById('sqMeters').textContent = (area * 0.092903).toFixed(2);
            document.getElementById('sqYards').textContent = (area / 9).toFixed(2);
            document.getElementById('acres').textContent = (area / 43560).toFixed(4);

            return { area, dims, shape: currentShape };
        }

        function addRoom() {
            const result = calculate();
            if (result.area > 0) {
                rooms.push({
                    name: `Room ${rooms.length + 1}`,
                    area: result.area,
                    dims: result.dims,
                    shape: result.shape
                });
                renderRooms();
            }
        }

        function removeRoom(index) {
            rooms.splice(index, 1);
            renderRooms();
        }

        function renderRooms() {
            const container = document.getElementById('roomList');
            container.innerHTML = rooms.map((room, i) => `
                <div class="room-item">
                    <div class="room-info">
                        <div class="room-name">${room.name} (${room.shape})</div>
                        <div class="room-dims">${room.dims}</div>
                    </div>
                    <div class="room-sqft">${room.area.toFixed(2)} sq ft</div>
                    <button class="btn btn-remove" onclick="removeRoom(${i})">×</button>
                </div>
            `).join('');

            const total = rooms.reduce((sum, r) => sum + r.area, 0);
            document.getElementById('grandTotal').textContent = total.toFixed(2) + ' sq ft';
        }

        calculate();
    </script>
</body>
