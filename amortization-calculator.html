<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amortization Calculator - Loan Payment Schedule</title>
    <meta name="description" content="Free amortization calculator. Generate loan payment schedules. See principal vs interest breakdown for mortgages and loans.">
    <meta name="keywords" content="amortization calculator, loan schedule, mortgage amortization, payment schedule, loan calculator">
    <link rel="canonical" href="https://austron24.github.io/webaudit-tools/amortization-calculator.html">
    <style>
        :root { --primary: #6366f1; --primary-dark: #4f46e5; --secondary: #22d3ee; --accent: #f59e0b; --bg-dark: #0f172a; --bg-card: #1e293b; --bg-input: #334155; --text-primary: #f1f5f9; --text-secondary: #94a3b8; --border: #475569; --success: #10b981; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg-dark); color: var(--text-primary); min-height: 100vh; line-height: 1.6; }
        .ad-container { background: var(--bg-card); padding: 10px; text-align: center; margin: 10px 0; border-radius: 8px; }
        .ad-label { font-size: 10px; color: var(--text-secondary); margin-bottom: 5px; }
        .header { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); padding: 40px 20px; text-align: center; }
        .header h1 { font-size: 2.5rem; margin-bottom: 10px; }
        .main-container { max-width: 1200px; margin: 0 auto; padding: 20px; display: grid; grid-template-columns: 1fr 160px; gap: 20px; }
        .content-area { display: flex; flex-direction: column; gap: 20px; }
        .sidebar { display: flex; flex-direction: column; gap: 20px; }
        .card { background: var(--bg-card); border-radius: 16px; padding: 24px; }
        .card h2 { color: var(--secondary); margin-bottom: 20px; font-size: 1.3rem; }
        .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: var(--text-secondary); }
        input { width: 100%; padding: 15px; border: 2px solid var(--border); border-radius: 10px; font-size: 1rem; background: var(--bg-input); color: var(--text-primary); }
        input:focus { outline: none; border-color: var(--primary); }
        .results-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 20px; }
        .result-card { background: var(--bg-input); padding: 25px; border-radius: 12px; text-align: center; }
        .result-card.highlight { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); }
        .result-value { font-size: 2rem; font-weight: 800; color: var(--secondary); }
        .result-card.highlight .result-value { color: white; }
        .result-label { color: var(--text-secondary); margin-top: 5px; }
        .result-card.highlight .result-label { color: rgba(255,255,255,0.8); }
        .schedule { margin-top: 20px; max-height: 400px; overflow-y: auto; }
        .schedule table { width: 100%; border-collapse: collapse; }
        .schedule th, .schedule td { padding: 12px; text-align: right; border-bottom: 1px solid var(--border); }
        .schedule th { background: var(--bg-input); position: sticky; top: 0; }
        .schedule th:first-child, .schedule td:first-child { text-align: left; }
        .schedule tr:hover { background: var(--bg-input); }
        .related-tools { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-top: 15px; }
        .related-link { display: block; padding: 12px 16px; background: var(--bg-input); border-radius: 8px; color: var(--text-primary); text-decoration: none; }
        .related-link:hover { background: var(--primary); }
        @media (max-width: 968px) { .main-container { grid-template-columns: 1fr; } .sidebar { display: none; } }
        @media (max-width: 640px) { .form-grid { grid-template-columns: 1fr; } .results-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="ad-container">
        <div class="ad-label">Advertisement</div>
        <script type="text/javascript">atOptions = { 'key': 'b43e7cf5057864a264961884e1f34530', 'format': 'iframe', 'height': 90, 'width': 728, 'params': {} };</script>
        <script type="text/javascript" src="//www.highperformanceformat.com/b43e7cf5057864a264961884e1f34530/invoke.js"></script>
    </div>
    <div class="ad-container" style="display: none;">
        <div class="ad-label">Advertisement</div>
        <script type="text/javascript">atOptions = { 'key': '9f6b66d433cad4c02b643bdd4b7eefc0', 'format': 'iframe', 'height': 50, 'width': 320, 'params': {} };</script>
        <script type="text/javascript" src="//www.highperformanceformat.com/9f6b66d433cad4c02b643bdd4b7eefc0/invoke.js"></script>
    </div>
    <style>@media (max-width: 728px) { .ad-container:first-child { display: none !important; } .ad-container:nth-child(2) { display: block !important; } }</style>
    
    <header class="header">
        <h1>📊 Amortization Calculator</h1>
    </header>

    <div class="main-container">
        <div class="content-area">
            <div class="card">
                <h2>💰 Loan Details</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Loan Amount ($)</label>
                        <input type="number" id="principal" value="250000" oninput="calculate()">
                    </div>
                    <div class="form-group">
                        <label>Interest Rate (%)</label>
                        <input type="number" id="rate" value="6.5" step="0.1" oninput="calculate()">
                    </div>
                    <div class="form-group">
                        <label>Loan Term (Years)</label>
                        <input type="number" id="years" value="30" oninput="calculate()">
                    </div>
                    <div class="form-group">
                        <label>Start Date</label>
                        <input type="month" id="startDate" oninput="calculate()">
                    </div>
                </div>
                
                <div class="results-grid">
                    <div class="result-card highlight">
                        <div class="result-value" id="monthlyPayment">$0</div>
                        <div class="result-label">Monthly Payment</div>
                    </div>
                    <div class="result-card">
                        <div class="result-value" id="totalInterest">$0</div>
                        <div class="result-label">Total Interest</div>
                    </div>
                    <div class="result-card">
                        <div class="result-value" id="totalCost">$0</div>
                        <div class="result-label">Total Cost</div>
                    </div>
                </div>
            </div>

            <div class="card">
                <h2>📅 Payment Schedule</h2>
                <div class="schedule" id="schedule"></div>
            </div>

            <div class="ad-container">
                <div class="ad-label">Advertisement</div>
                <script type="text/javascript">atOptions = { 'key': 'ee368c7cdf94f06bc71fdf57fe4124b8', 'format': 'iframe', 'height': 250, 'width': 300, 'params': {} };</script>
                <script type="text/javascript" src="//www.highperformanceformat.com/ee368c7cdf94f06bc71fdf57fe4124b8/invoke.js"></script>
            </div>

            <div class="card">
                <h2>🔗 Related Tools</h2>
                <div class="related-tools">
                    <a href="mortgage-calculator.html" class="related-link">🏠 Mortgage Calculator</a>
                    <a href="loan-calculator.html" class="related-link">💵 Loan Calculator</a>
                    <a href="compound-interest-calculator.html" class="related-link">📈 Compound Interest</a>
                    <a href="debt-payoff-calculator.html" class="related-link">💳 Debt Payoff</a>
                </div>
            </div>
        </div>

        <div class="sidebar">
            <div class="ad-container">
                <div class="ad-label">Advertisement</div>
                <script type="text/javascript">atOptions = { 'key': 'd4702b3e9743f9cd914a00e5026493f3', 'format': 'iframe', 'height': 600, 'width': 160, 'params': {} };</script>
                <script type="text/javascript" src="//www.highperformanceformat.com/d4702b3e9743f9cd914a00e5026493f3/invoke.js"></script>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('startDate').value = new Date().toISOString().slice(0, 7);
        
        function calculate() {
            const principal = parseFloat(document.getElementById('principal').value) || 0;
            const annualRate = parseFloat(document.getElementById('rate').value) / 100 || 0;
            const years = parseInt(document.getElementById('years').value) || 0;
            const startDate = document.getElementById('startDate').value;
            
            const monthlyRate = annualRate / 12;
            const numPayments = years * 12;
            
            let monthlyPayment = 0;
            if (monthlyRate > 0) {
                monthlyPayment = principal * (monthlyRate * Math.pow(1 + monthlyRate, numPayments)) / (Math.pow(1 + monthlyRate, numPayments) - 1);
            } else {
                monthlyPayment = principal / numPayments;
            }
            
            const totalCost = monthlyPayment * numPayments;
            const totalInterest = totalCost - principal;
            
            document.getElementById('monthlyPayment').textContent = '$' + monthlyPayment.toFixed(2);
            document.getElementById('totalInterest').textContent = '$' + totalInterest.toLocaleString(undefined, {maximumFractionDigits: 0});
            document.getElementById('totalCost').textContent = '$' + totalCost.toLocaleString(undefined, {maximumFractionDigits: 0});
            
            // Generate schedule
            let balance = principal;
            let html = '<table><thead><tr><th>Month</th><th>Payment</th><th>Principal</th><th>Interest</th><th>Balance</th></tr></thead><tbody>';
            
            const start = startDate ? new Date(startDate + '-01') : new Date();
            
            for (let i = 1; i <= Math.min(numPayments, 360); i++) {
                const interestPayment = balance * monthlyRate;
                const principalPayment = monthlyPayment - interestPayment;
                balance -= principalPayment;
                if (balance < 0) balance = 0;
                
                const date = new Date(start);
                date.setMonth(date.getMonth() + i - 1);
                const monthLabel = date.toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
                
                html += `<tr>
                    <td>${monthLabel}</td>
                    <td>$${monthlyPayment.toFixed(2)}</td>
                    <td>$${principalPayment.toFixed(2)}</td>
                    <td>$${interestPayment.toFixed(2)}</td>
                    <td>$${balance.toFixed(2)}</td>
                </tr>`;
            }
            
            html += '</tbody></table>';
            document.getElementById('schedule').innerHTML = html;
        }
        
        calculate();
    </script>
</body>
</html>
