    </div>

    <header class="header">
        <h1>📊 Grade Calculator</h1>
    </header>

    <div class="main-container">
        <div class="content-area">
            <div class="card">
                <h2>📝 Grade Categories</h2>
                <div id="categoriesContainer">
                    <div class="category-card">
                        <div class="category-header">
                            <div class="form-group">
                                <label>Category Name</label>
                                <input type="text" class="category-name" value="Homework" oninput="calculate()">
                            </div>
                            <div class="form-group">
                                <label>Weight (%)</label>
                                <input type="number" class="category-weight" value="20" step="5" oninput="calculate()">
                            </div>
                            <button class="btn btn-remove" onclick="removeCategory(this)">✕</button>
                        </div>
                        <div class="grades-container">
                            <div class="grade-row">
                                <div class="form-group">
                                    <label>Score</label>
                                    <input type="number" class="score" value="90" step="1" oninput="calculate()">
                                </div>
                                <div class="form-group">
                                    <label>Out of</label>
                                    <input type="number" class="max-score" value="100" step="1" oninput="calculate()">
                                </div>
                                <button class="btn btn-remove btn-sm" onclick="removeGrade(this)">✕</button>
                            </div>
                        </div>
                        <button class="btn btn-add btn-sm" onclick="addGrade(this)">+ Add Grade</button>
                    </div>
                    <div class="category-card">
                        <div class="category-header">
                            <div class="form-group">
                                <label>Category Name</label>
                                <input type="text" class="category-name" value="Tests" oninput="calculate()">
                            </div>
                            <div class="form-group">
                                <label>Weight (%)</label>
                                <input type="number" class="category-weight" value="50" step="5" oninput="calculate()">
                            </div>
                            <button class="btn btn-remove" onclick="removeCategory(this)">✕</button>
                        </div>
                        <div class="grades-container">
                            <div class="grade-row">
                                <div class="form-group">
                                    <label>Score</label>
                                    <input type="number" class="score" value="85" step="1" oninput="calculate()">
                                </div>
                                <div class="form-group">
                                    <label>Out of</label>
                                    <input type="number" class="max-score" value="100" step="1" oninput="calculate()">
                                </div>
                                <button class="btn btn-remove btn-sm" onclick="removeGrade(this)">✕</button>
                            </div>
                        </div>
                        <button class="btn btn-add btn-sm" onclick="addGrade(this)">+ Add Grade</button>
                    </div>
                    <div class="category-card">
                        <div class="category-header">
                            <div class="form-group">
                                <label>Category Name</label>
                                <input type="text" class="category-name" value="Final Exam" oninput="calculate()">
                            </div>
                            <div class="form-group">
                                <label>Weight (%)</label>
                                <input type="number" class="category-weight" value="30" step="5" oninput="calculate()">
                            </div>
                            <button class="btn btn-remove" onclick="removeCategory(this)">✕</button>
                        </div>
                        <div class="grades-container">
                            <div class="grade-row">
                                <div class="form-group">
                                    <label>Score</label>
                                    <input type="number" class="score" value="" placeholder="TBD" step="1" oninput="calculate()">
                                </div>
                                <div class="form-group">
                                    <label>Out of</label>
                                    <input type="number" class="max-score" value="100" step="1" oninput="calculate()">
                                </div>
                                <button class="btn btn-remove btn-sm" onclick="removeGrade(this)">✕</button>
                            </div>
                        </div>
                        <button class="btn btn-add btn-sm" onclick="addGrade(this)">+ Add Grade</button>
                    </div>
                </div>
                <button class="btn btn-add" onclick="addCategory()">+ Add Category</button>

                <div class="result-hero">
                    <div class="result-hero-label">Current Grade</div>
                    <div class="result-hero-value" id="currentGrade">0%</div>
                </div>

                <div class="results-grid">
                    <div class="result-card">
                        <div class="result-value" id="letterGrade">A</div>
                        <div class="result-label">Letter Grade</div>
                    </div>
                    <div class="result-card">
                        <div class="result-value" id="totalWeight">0%</div>
                        <div class="result-label">Weight Completed</div>
                    </div>
                    <div class="result-card">
                        <div class="result-value" id="pointsEarned">0/0</div>
                        <div class="result-label">Points Earned</div>
                    </div>
                </div>

                <div class="final-calc">
                    <h3 style="color: var(--accent); margin-bottom: 15px;">🎯 What Do I Need on the Final?</h3>
                    <div class="final-grid">
                        <div class="form-group">
                            <label>Desired Grade (%)</label>
                            <input type="number" id="desiredGrade" value="90" step="1" oninput="calcFinalNeeded()">
                        </div>
                        <div class="form-group">
                            <label>Final Weight (%)</label>
                            <input type="number" id="finalWeight" value="30" step="5" oninput="calcFinalNeeded()">
                        </div>
                        <div class="form-group">
                            <label>Score Needed</label>
                            <input type="text" id="neededScore" value="0%" readonly style="background: var(--success); font-weight: bold; text-align: center;">
                        </div>
                    </div>
                </div>
            </div>

            </div>

            <div class="card">
                <h2>🔗 Related Tools</h2>
                <div class="related-tools">
                    <a href="gpa-calculator.html" class="related-link">📚 GPA Calculator</a>
                    <a href="percentage-calculator.html" class="related-link">📊 Percentage</a>
                    <a href="college-cost-calculator.html" class="related-link">🎓 College Cost</a>
                    <a href="average-calculator.html" class="related-link">🔢 Average</a>
                </div>
            </div>
        </div>

        <div class="sidebar">
            </div>
        </div>
    </div>

    <script>
        function addCategory() {
            const container = document.getElementById('categoriesContainer');
            const card = document.createElement('div');
            card.className = 'category-card';
            card.innerHTML = `
                <div class="category-header">
                    <div class="form-group">
                        <label>Category Name</label>
                        <input type="text" class="category-name" value="New Category" oninput="calculate()">
                    </div>
                    <div class="form-group">
                        <label>Weight (%)</label>
                        <input type="number" class="category-weight" value="10" step="5" oninput="calculate()">
                    </div>
                    <button class="btn btn-remove" onclick="removeCategory(this)">✕</button>
                </div>
                <div class="grades-container">
                    <div class="grade-row">
                        <div class="form-group">
                            <label>Score</label>
                            <input type="number" class="score" value="" step="1" oninput="calculate()">
                        </div>
                        <div class="form-group">
                            <label>Out of</label>
                            <input type="number" class="max-score" value="100" step="1" oninput="calculate()">
                        </div>
                        <button class="btn btn-remove btn-sm" onclick="removeGrade(this)">✕</button>
                    </div>
                </div>
                <button class="btn btn-add btn-sm" onclick="addGrade(this)">+ Add Grade</button>
            `;
            container.appendChild(card);
            calculate();
        }

        function removeCategory(btn) {
            const cards = document.querySelectorAll('.category-card');
            if (cards.length > 1) {
                btn.closest('.category-card').remove();
                calculate();
            }
        }

        function addGrade(btn) {
            const container = btn.previousElementSibling;
            const row = document.createElement('div');
            row.className = 'grade-row';
            row.innerHTML = `
                <div class="form-group">
                    <label>Score</label>
                    <input type="number" class="score" value="" step="1" oninput="calculate()">
                </div>
                <div class="form-group">
                    <label>Out of</label>
                    <input type="number" class="max-score" value="100" step="1" oninput="calculate()">
                </div>
                <button class="btn btn-remove btn-sm" onclick="removeGrade(this)">✕</button>
            `;
            container.appendChild(row);
        }

        function removeGrade(btn) {
            const container = btn.closest('.grades-container');
            if (container.querySelectorAll('.grade-row').length > 1) {
                btn.closest('.grade-row').remove();
                calculate();
            }
        }

        function getLetterGrade(pct) {
            if (pct >= 93) return 'A';
            if (pct >= 90) return 'A-';
            if (pct >= 87) return 'B+';
            if (pct >= 83) return 'B';
            if (pct >= 80) return 'B-';
            if (pct >= 77) return 'C+';
            if (pct >= 73) return 'C';
            if (pct >= 70) return 'C-';
            if (pct >= 67) return 'D+';
            if (pct >= 63) return 'D';
            if (pct >= 60) return 'D-';
            return 'F';
        }

        function calculate() {
            const categories = document.querySelectorAll('.category-card');
            let totalWeightedGrade = 0;
            let totalWeightUsed = 0;
            let totalPoints = 0;
            let totalPossible = 0;
            
            categories.forEach(cat => {
                const weight = parseFloat(cat.querySelector('.category-weight').value) || 0;
                const scores = cat.querySelectorAll('.score');
                const maxScores = cat.querySelectorAll('.max-score');
                
                let catPoints = 0;
                let catMax = 0;
                let hasGrades = false;
                
                scores.forEach((score, i) => {
                    const s = parseFloat(score.value);
                    const m = parseFloat(maxScores[i].value) || 100;
                    if (!isNaN(s)) {
                        catPoints += s;
                        catMax += m;
                        hasGrades = true;
                    }
                });
                
                if (hasGrades && catMax > 0) {
                    const catPct = (catPoints / catMax) * 100;
                    totalWeightedGrade += catPct * (weight / 100);
                    totalWeightUsed += weight;
                    totalPoints += catPoints;
                    totalPossible += catMax;
                }
            });
            
            const currentGrade = totalWeightUsed > 0 ? (totalWeightedGrade / totalWeightUsed) * 100 : 0;
            
            document.getElementById('currentGrade').textContent = currentGrade.toFixed(1) + '%';
            document.getElementById('letterGrade').textContent = getLetterGrade(currentGrade);
            document.getElementById('totalWeight').textContent = totalWeightUsed.toFixed(0) + '%';
            document.getElementById('pointsEarned').textContent = totalPoints.toFixed(0) + '/' + totalPossible.toFixed(0);
            
            calcFinalNeeded();
        }

        function calcFinalNeeded() {
            const categories = document.querySelectorAll('.category-card');
            let currentWeightedGrade = 0;
            let currentWeight = 0;
            
            categories.forEach(cat => {
                const weight = parseFloat(cat.querySelector('.category-weight').value) || 0;
                const scores = cat.querySelectorAll('.score');
                const maxScores = cat.querySelectorAll('.max-score');
                
                let catPoints = 0;
                let catMax = 0;
                let hasGrades = false;
                
                scores.forEach((score, i) => {
                    const s = parseFloat(score.value);
                    const m = parseFloat(maxScores[i].value) || 100;
                    if (!isNaN(s)) {
                        catPoints += s;
                        catMax += m;
                        hasGrades = true;
                    }
                });
                
                if (hasGrades && catMax > 0) {
                    currentWeightedGrade += (catPoints / catMax) * weight;
                    currentWeight += weight;
                }
            });
            
            const desiredGrade = parseFloat(document.getElementById('desiredGrade').value) || 0;
            const finalWeight = parseFloat(document.getElementById('finalWeight').value) || 0;
            
            const neededOnFinal = (desiredGrade - currentWeightedGrade) / finalWeight * 100;
            
            document.getElementById('neededScore').value = neededOnFinal > 100 ? 'Not Possible' : 
                                                           neededOnFinal < 0 ? 'Already Achieved!' :
                                                           neededOnFinal.toFixed(1) + '%';
        }

        calculate();
    </script>
