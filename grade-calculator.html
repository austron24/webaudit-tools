<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Calculator - Calculate Your Final Grade</title>
    <meta name="description" content="Free grade calculator. Calculate your class grade with weighted assignments. Find what you need on the final exam.">
    <meta name="keywords" content="grade calculator, final grade calculator, weighted grade, class grade, GPA calculator">
    <link rel="canonical" href="https://austron24.github.io/webaudit-tools/grade-calculator.html">
    <style>
        :root { --primary: #6366f1; --primary-dark: #4f46e5; --secondary: #22d3ee; --accent: #f59e0b; --bg-dark: #0f172a; --bg-card: #1e293b; --bg-input: #334155; --text-primary: #f1f5f9; --text-secondary: #94a3b8; --border: #475569; --success: #10b981; --error: #ef4444; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg-dark); color: var(--text-primary); min-height: 100vh; line-height: 1.6; }
        .ad-container { background: var(--bg-card); padding: 10px; text-align: center; margin: 10px 0; border-radius: 8px; }
        .ad-label { font-size: 10px; color: var(--text-secondary); margin-bottom: 5px; }
        .header { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); padding: 40px 20px; text-align: center; }
        .header h1 { font-size: 2.5rem; margin-bottom: 10px; }
        .main-container { max-width: 1200px; margin: 0 auto; padding: 20px; display: grid; grid-template-columns: 1fr 160px; gap: 20px; }
        .content-area { display: flex; flex-direction: column; gap: 20px; }
        .sidebar { display: flex; flex-direction: column; gap: 20px; }
        .card { background: var(--bg-card); border-radius: 16px; padding: 24px; }
        .card h2 { color: var(--secondary); margin-bottom: 20px; font-size: 1.3rem; }
        .grade-row { display: grid; grid-template-columns: 2fr 1fr 1fr auto; gap: 10px; margin-bottom: 10px; align-items: end; }
        .form-group { margin-bottom: 0; }
        .form-group label { display: block; margin-bottom: 8px; color: var(--text-secondary); font-size: 0.85rem; }
        input { width: 100%; padding: 12px; border: 2px solid var(--border); border-radius: 8px; font-size: 1rem; background: var(--bg-input); color: var(--text-primary); }
        input:focus { outline: none; border-color: var(--primary); }
        .add-btn, .remove-btn { padding: 12px 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .add-btn { background: var(--success); color: white; width: 100%; margin-top: 15px; }
        .remove-btn { background: var(--error); color: white; }
        .grade-list { margin-top: 15px; }
        .grade-item { display: grid; grid-template-columns: 2fr 1fr 1fr auto; gap: 10px; padding: 12px 15px; background: var(--bg-input); border-radius: 8px; margin-bottom: 8px; align-items: center; }
        .results-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 20px; }
        .result-card { background: var(--bg-input); padding: 25px; border-radius: 12px; text-align: center; }
        .result-card.highlight { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); }
        .result-value { font-size: 2.5rem; font-weight: 800; color: var(--secondary); }
        .result-card.highlight .result-value { color: white; }
        .result-label { color: var(--text-secondary); margin-top: 5px; }
        .result-card.highlight .result-label { color: rgba(255,255,255,0.8); }
        .final-exam { margin-top: 20px; padding: 20px; background: var(--bg-input); border-radius: 12px; }
        .final-exam h3 { color: var(--accent); margin-bottom: 15px; }
        .final-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; }
        .related-tools { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-top: 15px; }
        .related-link { display: block; padding: 12px 16px; background: var(--bg-input); border-radius: 8px; color: var(--text-primary); text-decoration: none; }
        .related-link:hover { background: var(--primary); }
        @media (max-width: 968px) { .main-container { grid-template-columns: 1fr; } .sidebar { display: none; } }
        @media (max-width: 640px) { .grade-row, .grade-item { grid-template-columns: 1fr; } .results-grid, .final-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="ad-container">
        <div class="ad-label">Advertisement</div>
        <script type="text/javascript">atOptions = { 'key': 'b43e7cf5057864a264961884e1f34530', 'format': 'iframe', 'height': 90, 'width': 728, 'params': {} };</script>
        <script type="text/javascript" src="//www.highperformanceformat.com/b43e7cf5057864a264961884e1f34530/invoke.js"></script>
    </div>
    <div class="ad-container" style="display: none;">
        <div class="ad-label">Advertisement</div>
        <script type="text/javascript">atOptions = { 'key': '9f6b66d433cad4c02b643bdd4b7eefc0', 'format': 'iframe', 'height': 50, 'width': 320, 'params': {} };</script>
        <script type="text/javascript" src="//www.highperformanceformat.com/9f6b66d433cad4c02b643bdd4b7eefc0/invoke.js"></script>
    </div>
    <style>@media (max-width: 728px) { .ad-container:first-child { display: none !important; } .ad-container:nth-child(2) { display: block !important; } }</style>
    
    <header class="header">
        <h1>📚 Grade Calculator</h1>
    </header>

    <div class="main-container">
        <div class="content-area">
            <div class="card">
                <h2>📝 Add Assignments</h2>
                <div class="grade-row">
                    <div class="form-group">
                        <label>Assignment Name</label>
                        <input type="text" id="assignName" placeholder="Midterm Exam">
                    </div>
                    <div class="form-group">
                        <label>Grade (%)</label>
                        <input type="number" id="assignGrade" placeholder="85">
                    </div>
                    <div class="form-group">
                        <label>Weight (%)</label>
                        <input type="number" id="assignWeight" placeholder="25">
                    </div>
                </div>
                <button class="add-btn" onclick="addAssignment()">+ Add Assignment</button>
                
                <div class="grade-list" id="gradeList"></div>
                
                <div class="results-grid">
                    <div class="result-card highlight">
                        <div class="result-value" id="currentGrade">0%</div>
                        <div class="result-label">Current Grade</div>
                    </div>
                    <div class="result-card">
                        <div class="result-value" id="letterGrade">-</div>
                        <div class="result-label">Letter Grade</div>
                    </div>
                    <div class="result-card">
                        <div class="result-value" id="weightUsed">0%</div>
                        <div class="result-label">Weight Used</div>
                    </div>
                </div>
                
                <div class="final-exam">
                    <h3>🎯 Final Exam Calculator</h3>
                    <p style="color: var(--text-secondary); margin-bottom: 15px;">What do you need on the final?</p>
                    <div class="final-grid">
                        <div class="form-group">
                            <label>Desired Grade (%)</label>
                            <input type="number" id="desiredGrade" value="90" oninput="calculateFinal()">
                        </div>
                        <div class="form-group">
                            <label>Final Weight (%)</label>
                            <input type="number" id="finalWeight" value="20" oninput="calculateFinal()">
                        </div>
                        <div class="form-group">
                            <label>Needed on Final</label>
                            <input type="text" id="neededGrade" readonly style="background: var(--bg-dark); font-weight: 700; color: var(--accent);">
                        </div>
                    </div>
                </div>
            </div>

            <div class="ad-container">
                <div class="ad-label">Advertisement</div>
                <script type="text/javascript">atOptions = { 'key': 'ee368c7cdf94f06bc71fdf57fe4124b8', 'format': 'iframe', 'height': 250, 'width': 300, 'params': {} };</script>
                <script type="text/javascript" src="//www.highperformanceformat.com/ee368c7cdf94f06bc71fdf57fe4124b8/invoke.js"></script>
            </div>

            <div class="card">
                <h2>🔗 Related Tools</h2>
                <div class="related-tools">
                    <a href="gpa-calculator.html" class="related-link">📊 GPA Calculator</a>
                    <a href="percentage-calculator.html" class="related-link">📈 Percentage Calculator</a>
                    <a href="study-timer.html" class="related-link">⏱️ Study Timer</a>
                </div>
            </div>
        </div>

        <div class="sidebar">
            <div class="ad-container">
                <div class="ad-label">Advertisement</div>
                <script type="text/javascript">atOptions = { 'key': 'd4702b3e9743f9cd914a00e5026493f3', 'format': 'iframe', 'height': 600, 'width': 160, 'params': {} };</script>
                <script type="text/javascript" src="//www.highperformanceformat.com/d4702b3e9743f9cd914a00e5026493f3/invoke.js"></script>
            </div>
        </div>
    </div>

    <script>
        let assignments = [];
        
        function addAssignment() {
            const name = document.getElementById('assignName').value || 'Assignment';
            const grade = parseFloat(document.getElementById('assignGrade').value);
            const weight = parseFloat(document.getElementById('assignWeight').value);
            
            if (!isNaN(grade) && !isNaN(weight)) {
                assignments.push({ name, grade, weight });
                document.getElementById('assignName').value = '';
                document.getElementById('assignGrade').value = '';
                document.getElementById('assignWeight').value = '';
                renderList();
                calculate();
            }
        }
        
        function removeAssignment(index) {
            assignments.splice(index, 1);
            renderList();
            calculate();
        }
        
        function renderList() {
            document.getElementById('gradeList').innerHTML = assignments.map((a, i) => `
                <div class="grade-item">
                    <span>${a.name}</span>
                    <span>${a.grade}%</span>
                    <span>${a.weight}%</span>
                    <button class="remove-btn" onclick="removeAssignment(${i})">×</button>
                </div>
            `).join('');
        }
        
        function calculate() {
            if (assignments.length === 0) {
                document.getElementById('currentGrade').textContent = '0%';
                document.getElementById('letterGrade').textContent = '-';
                document.getElementById('weightUsed').textContent = '0%';
                calculateFinal();
                return;
            }
            
            let totalWeight = 0;
            let weightedSum = 0;
            
            assignments.forEach(a => {
                totalWeight += a.weight;
                weightedSum += a.grade * a.weight;
            });
            
            const currentGrade = totalWeight > 0 ? weightedSum / totalWeight : 0;
            
            let letter = 'F';
            if (currentGrade >= 93) letter = 'A';
            else if (currentGrade >= 90) letter = 'A-';
            else if (currentGrade >= 87) letter = 'B+';
            else if (currentGrade >= 83) letter = 'B';
            else if (currentGrade >= 80) letter = 'B-';
            else if (currentGrade >= 77) letter = 'C+';
            else if (currentGrade >= 73) letter = 'C';
            else if (currentGrade >= 70) letter = 'C-';
            else if (currentGrade >= 67) letter = 'D+';
            else if (currentGrade >= 60) letter = 'D';
            
            document.getElementById('currentGrade').textContent = currentGrade.toFixed(1) + '%';
            document.getElementById('letterGrade').textContent = letter;
            document.getElementById('weightUsed').textContent = totalWeight.toFixed(0) + '%';
            
            calculateFinal();
        }
        
        function calculateFinal() {
            const desired = parseFloat(document.getElementById('desiredGrade').value) || 0;
            const finalWeight = parseFloat(document.getElementById('finalWeight').value) || 0;
            
            let totalWeight = assignments.reduce((sum, a) => sum + a.weight, 0);
            let weightedSum = assignments.reduce((sum, a) => sum + a.grade * a.weight, 0);
            
            // (weightedSum + needed * finalWeight) / (totalWeight + finalWeight) = desired
            // weightedSum + needed * finalWeight = desired * (totalWeight + finalWeight)
            // needed * finalWeight = desired * (totalWeight + finalWeight) - weightedSum
            // needed = (desired * (totalWeight + finalWeight) - weightedSum) / finalWeight
            
            if (finalWeight > 0) {
                const needed = (desired * (totalWeight + finalWeight) - weightedSum) / finalWeight;
                if (needed > 100) {
                    document.getElementById('neededGrade').value = 'Not possible';
                } else if (needed < 0) {
                    document.getElementById('neededGrade').value = '0% (already met!)';
                } else {
                    document.getElementById('neededGrade').value = needed.toFixed(1) + '%';
                }
            } else {
                document.getElementById('neededGrade').value = '-';
            }
        }
        
        // Add sample data
        assignments = [
            { name: 'Homework', grade: 92, weight: 20 },
            { name: 'Midterm', grade: 85, weight: 30 },
            { name: 'Quiz Average', grade: 88, weight: 15 }
        ];
        renderList();
        calculate();
    </script>
</body>
</html>
