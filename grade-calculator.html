<head>

    <link rel="canonical" href="https://austron24.github.io/webaudit-tools/grade-calculator.html">
    <style>
        :root { --primary: #6366f1; --primary-dark: #4f46e5; --secondary: #22d3ee; --accent: #f59e0b; --bg-dark: #0f172a; --bg-card: #1e293b; --bg-input: #334155; --text-primary: #f1f5f9; --text-secondary: #94a3b8; --border: #475569; --success: #10b981; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg-dark); color: var(--text-primary); min-height: 100vh; line-height: 1.6; }
        .ad-container { background: var(--bg-card); padding: 10px; text-align: center; margin: 10px 0; border-radius: 8px; }
        .ad-label { font-size: 10px; color: var(--text-secondary); margin-bottom: 5px; }
        .header { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); padding: 40px 20px; text-align: center; }
        .header h1 { font-size: 2.5rem; margin-bottom: 10px; }
        .main-container { max-width: 1200px; margin: 0 auto; padding: 20px; display: grid; grid-template-columns: 1fr 160px; gap: 20px; }
        .content-area { display: flex; flex-direction: column; gap: 20px; }
        .sidebar { display: flex; flex-direction: column; gap: 20px; }
        .card { background: var(--bg-card); border-radius: 16px; padding: 24px; }
        .card h2 { color: var(--secondary); margin-bottom: 20px; font-size: 1.3rem; }
        .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 8px; color: var(--text-secondary); }
        input { width: 100%; padding: 15px; border: 2px solid var(--border); border-radius: 10px; font-size: 1rem; background: var(--bg-input); color: var(--text-primary); }
        input:focus { outline: none; border-color: var(--primary); }
        .result-hero { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); padding: 35px; border-radius: 16px; text-align: center; margin: 20px 0; }
        .result-hero-value { font-size: 3rem; font-weight: 800; color: white; }
        .result-hero-label { color: rgba(255,255,255,0.8); }
        .results-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 20px; }
        .result-card { background: var(--bg-input); padding: 20px; border-radius: 12px; text-align: center; }
        .result-value { font-size: 1.3rem; font-weight: 700; color: var(--secondary); }
        .result-label { color: var(--text-secondary); margin-top: 5px; font-size: 0.85rem; }
        .breakdown-row { display: flex; justify-content: space-between; padding: 12px 15px; background: var(--bg-input); border-radius: 8px; margin-bottom: 8px; }
        .related-tools { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-top: 15px; }
        .related-link { display: block; padding: 12px 16px; background: var(--bg-input); border-radius: 8px; color: var(--text-primary); text-decoration: none; }
        .related-link:hover { background: var(--primary); }
        @media (max-width: 968px) { .main-container { grid-template-columns: 1fr; } .sidebar { display: none; } }
        @media (max-width: 640px) { .form-grid, .results-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="ad-container">
        <div class="ad-label">Advertisement</div>
        <script type="text/javascript">atOptions = { 'key': 'b43e7cf5057864a264961884e1f34530', 'format': 'iframe', 'height': 90, 'width': 728, 'params': {} };</script>
        <script type="text/javascript" src="//www.highperformanceformat.com/b43e7cf5057864a264961884e1f34530/invoke.js"></script>
    </div>
    <div class="ad-container" style="display: none;">
        <div class="ad-label">Advertisement</div>
        <script type="text/javascript">atOptions = { 'key': '9f6b66d433cad4c02b643bdd4b7eefc0', 'format': 'iframe', 'height': 50, 'width': 320, 'params': {} };</script>
        <script type="text/javascript" src="//www.highperformanceformat.com/9f6b66d433cad4c02b643bdd4b7eefc0/invoke.js"></script>
    </div>
    <style>@media (max-width: 728px) { .ad-container:first-child { display: none !important; } .ad-container:nth-child(2) { display: block !important; } }</style>

    <header class="header">
        <h1>📝 Grade Calculator</h1>
    </header>

    <div class="main-container">
        <div class="content-area">
            <div class="card">
                <h2>📊 Current Grades</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Current Grade (%)</label>
                        <input type="number" id="currentGrade" value="85" step="0.1" oninput="calculate()">
                    </div>
                    <div class="form-group">
                        <label>Final Exam Weight (%)</label>
                        <input type="number" id="finalWeight" value="20" oninput="calculate()">
                    </div>
                    <div class="form-group">
                        <label>Desired Final Grade (%)</label>
                        <input type="number" id="desiredGrade" value="90" step="0.1" oninput="calculate()">
                    </div>
                    <div class="form-group">
                        <label>Final Exam Score (%)</label>
                        <input type="number" id="finalScore" value="95" step="0.1" oninput="calculate()">
                    </div>
                </div>

                <div class="result-hero">
                    <div class="result-hero-label">Final Class Grade</div>
                    <div class="result-hero-value" id="finalGrade">0%</div>
                </div>

                <div class="results-grid">
                    <div class="result-card">
                        <div class="result-value" id="letterGrade">--</div>
                        <div class="result-label">Letter Grade</div>
                    </div>
                    <div class="result-card">
                        <div class="result-value" id="neededScore">--</div>
                        <div class="result-label">Need on Final</div>
                    </div>
                    <div class="result-card">
                        <div class="result-value" id="possible">--</div>
                        <div class="result-label">Goal Achievable?</div>
                    </div>
                </div>
            </div>

            <div class="card">
                <h2>🎯 What You Need for Each Grade</h2>
                <div id="gradeNeeds"></div>
            </div>

            <div class="ad-container">
                <div class="ad-label">Advertisement</div>
                <script type="text/javascript">atOptions = { 'key': 'ee368c7cdf94f06bc71fdf57fe4124b8', 'format': 'iframe', 'height': 250, 'width': 300, 'params': {} };</script>
                <script type="text/javascript" src="//www.highperformanceformat.com/ee368c7cdf94f06bc71fdf57fe4124b8/invoke.js"></script>
            </div>

            <div class="card">
                <h2>🔗 Related Tools</h2>
                <div class="related-tools">
                    <a href="gpa-calculator.html" class="related-link">🎓 GPA Calculator</a>
                    <a href="percentage-calculator.html" class="related-link">📊 Percentage</a>
                    <a href="college-cost-calculator.html" class="related-link">🏫 College Cost</a>
                    <a href="student-loan-calculator.html" class="related-link">💰 Student Loan</a>
                </div>
            </div>
        </div>

        <div class="sidebar">
            <div class="ad-container">
                <div class="ad-label">Advertisement</div>
                <script type="text/javascript">atOptions = { 'key': 'd4702b3e9743f9cd914a00e5026493f3', 'format': 'iframe', 'height': 600, 'width': 160, 'params': {} };</script>
                <script type="text/javascript" src="//www.highperformanceformat.com/d4702b3e9743f9cd914a00e5026493f3/invoke.js"></script>
            </div>
        </div>
    </div>

    <script>
        function getLetterGrade(pct) {
            if (pct >= 93) return 'A';
            if (pct >= 90) return 'A-';
            if (pct >= 87) return 'B+';
            if (pct >= 83) return 'B';
            if (pct >= 80) return 'B-';
            if (pct >= 77) return 'C+';
            if (pct >= 73) return 'C';
            if (pct >= 70) return 'C-';
            if (pct >= 67) return 'D+';
            if (pct >= 60) return 'D';
            return 'F';
        }

        function calculate() {
            const current = parseFloat(document.getElementById('currentGrade').value) || 0;
            const finalWeight = parseFloat(document.getElementById('finalWeight').value) / 100 || 0.2;
            const desired = parseFloat(document.getElementById('desiredGrade').value) || 0;
            const finalScore = parseFloat(document.getElementById('finalScore').value) || 0;

            const currentWeight = 1 - finalWeight;
            const finalGrade = (current * currentWeight) + (finalScore * finalWeight);
            const neededScore = (desired - (current * currentWeight)) / finalWeight;

            document.getElementById('finalGrade').textContent = finalGrade.toFixed(1) + '%';
            document.getElementById('letterGrade').textContent = getLetterGrade(finalGrade);
            document.getElementById('neededScore').textContent = neededScore.toFixed(1) + '%';
            document.getElementById('possible').textContent = neededScore <= 100 ? 'Yes ✓' : 'No ✗';
            document.getElementById('possible').style.color = neededScore <= 100 ? 'var(--success)' : '#ef4444';

            const grades = [
                { letter: 'A', min: 93 },
                { letter: 'A-', min: 90 },
                { letter: 'B+', min: 87 },
                { letter: 'B', min: 83 },
                { letter: 'B-', min: 80 },
                { letter: 'C+', min: 77 },
                { letter: 'C', min: 73 }
            ];

            let needsHtml = '';
            grades.forEach(g => {
                const need = (g.min - (current * currentWeight)) / finalWeight;
                const status = need <= 100 ? (need < 0 ? 'Already have it' : need.toFixed(1) + '%') : 'Not possible';
                const color = need <= 100 ? 'var(--text-primary)' : '#ef4444';
                needsHtml += '<div class="breakdown-row"><span>' + g.letter + ' (' + g.min + '%+)</span><span style="color: ' + color + ';">' + status + '</span></div>';
            });
            document.getElementById('gradeNeeds').innerHTML = needsHtml;
        }
        calculate();
    </script>
</body>
</html>
