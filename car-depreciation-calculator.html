    <header class="header">
        <h1>📉 Car Depreciation Calculator</h1>
    </header>

    <div class="main-container">
        <div class="content-area">
            <div class="card">
                <h2>🚗 Vehicle Information</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Purchase Price ($)</label>
                        <input type="number" id="price" value="35000" step="1000" oninput="calculate()">
                    </div>
                    <div class="form-group">
                        <label>Vehicle Age (years)</label>
                        <input type="number" id="age" value="3" min="0" max="20" oninput="calculate()">
                    </div>
                    <div class="form-group">
                        <label>Annual Mileage</label>
                        <input type="number" id="mileage" value="12000" step="1000" oninput="calculate()">
                    </div>
                    <div class="form-group">
                        <label>Vehicle Type</label>
                        <select id="type" onchange="calculate()">
                            <option value="economy">Economy Car</option>
                            <option value="sedan" selected>Sedan/SUV</option>
                            <option value="luxury">Luxury</option>
                            <option value="truck">Truck</option>
                            <option value="electric">Electric</option>
                        </select>
                    </div>
                </div>

                <div class="result-hero">
                    <div class="result-hero-label">Current Value</div>
                    <div class="result-hero-value" id="currentValue">$0</div>
                </div>

                <div class="results-grid">
                    <div class="result-card">
                        <div class="result-value" id="valueLost">$0</div>
                        <div class="result-label">Value Lost</div>
                    </div>
                    <div class="result-card">
                        <div class="result-value" id="percentLost">0%</div>
                        <div class="result-label">% Depreciated</div>
                    </div>
                    <div class="result-card">
                        <div class="result-value" id="annualLoss">$0</div>
                        <div class="result-label">Annual Loss</div>
                    </div>
                </div>
            </div>

            <div class="card">
                <h2>📊 Value Over Time</h2>
                <div id="timeline"></div>
            </div>

            </div>

            <div class="card">
                <h2>🔗 Related Tools</h2>
                <div class="related-tools">
                    <a href="auto-loan-calculator.html" class="related-link">💵 Auto Loan</a>
                    <a href="car-lease-calculator.html" class="related-link">🚗 Car Lease</a>
                    <a href="gas-mileage-calculator.html" class="related-link">⛽ Gas Mileage</a>
                    <a href="insurance-calculator.html" class="related-link">🛡️ Insurance</a>
                </div>
            </div>
        </div>

        <div class="sidebar">
            </div>
        </div>
    </div>

    <script>
        const depRates = {
            economy: [0.10, 0.15, 0.12, 0.10, 0.08, 0.07, 0.06, 0.05, 0.04, 0.04],
            sedan: [0.15, 0.15, 0.12, 0.10, 0.08, 0.07, 0.06, 0.05, 0.04, 0.04],
            luxury: [0.20, 0.18, 0.15, 0.12, 0.10, 0.08, 0.07, 0.06, 0.05, 0.05],
            truck: [0.12, 0.12, 0.10, 0.08, 0.07, 0.06, 0.05, 0.05, 0.04, 0.04],
            electric: [0.15, 0.15, 0.12, 0.10, 0.08, 0.07, 0.06, 0.05, 0.04, 0.04]
        };

        function calculate() {
            const price = parseFloat(document.getElementById('price').value) || 0;
            const age = parseInt(document.getElementById('age').value) || 0;
            const type = document.getElementById('type').value;
            const rates = depRates[type];

            let values = [price];
            let value = price;
            for (let y = 0; y < 10; y++) {
                value *= (1 - rates[y]);
                values.push(value);
            }

            const currentValue = values[Math.min(age, 10)];
            const valueLost = price - currentValue;
            const percentLost = price > 0 ? (valueLost / price * 100) : 0;
            const annualLoss = age > 0 ? valueLost / age : 0;

            document.getElementById('currentValue').textContent = '$' + Math.round(currentValue).toLocaleString();
            document.getElementById('valueLost').textContent = '$' + Math.round(valueLost).toLocaleString();
            document.getElementById('percentLost').textContent = Math.round(percentLost) + '%';
            document.getElementById('annualLoss').textContent = '$' + Math.round(annualLoss).toLocaleString();

            let html = '';
            for (let y = 0; y <= 5; y++) {
                const val = values[y];
                const pct = price > 0 ? (val / price * 100) : 0;
                const highlight = y === age ? 'border: 2px solid var(--primary);' : '';
                html += '<div class="breakdown-row" style="' + highlight + '"><span>Year ' + y + '</span><span>$' + Math.round(val).toLocaleString() + ' (' + Math.round(pct) + '%)</span></div>';
            }
            document.getElementById('timeline').innerHTML = html;
        }
        calculate();
    </script>
