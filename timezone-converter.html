    <script>
        const cities = [
            { name: 'New York', offset: -5 },
            { name: 'London', offset: 0 },
            { name: 'Tokyo', offset: 9 },
            { name: 'Sydney', offset: 10 },
            { name: 'Dubai', offset: 4 },
            { name: 'Los Angeles', offset: -8 }
        ];

        function updateCurrentTime() {
            const now = new Date();
            document.getElementById('currentTime').textContent = now.toLocaleTimeString();
            document.getElementById('currentDate').textContent = now.toLocaleDateString('en-US', {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
        }

        function updateWorldClocks() {
            const now = new Date();
            const container = document.getElementById('worldClocks');
            container.innerHTML = cities.map(city => {
                const cityTime = new Date(now.getTime() + (city.offset * 60 + now.getTimezoneOffset()) * 60000);
                return `
                    <div class="clock-item">
                        <div class="city">${city.name}</div>
                        <div class="time">${cityTime.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' })}</div>
                        <div class="offset">UTC${city.offset >= 0 ? '+' : ''}${city.offset}</div>
                    </div>
                `;
            }).join('');
        }

        function convertTime() {
            const fromTime = document.getElementById('fromTime').value;
            const fromOffset = parseFloat(document.getElementById('fromTz').value);
            const toOffset = parseFloat(document.getElementById('toTz').value);

            if (!fromTime) return;

            const [hours, minutes] = fromTime.split(':').map(Number);
            const diffHours = toOffset - fromOffset;

            let newHours = hours + diffHours;
            let dayDiff = '';

            if (newHours >= 24) {
                newHours -= 24;
                dayDiff = 'Next day';
            } else if (newHours < 0) {
                newHours += 24;
                dayDiff = 'Previous day';
            } else {
                dayDiff = 'Same day';
            }

            const resultHours = Math.floor(newHours);
            const resultMins = minutes + ((newHours % 1) * 60);

            document.getElementById('resultTime').textContent =
                `${String(resultHours).padStart(2, '0')}:${String(Math.round(resultMins)).padStart(2, '0')}`;
            document.getElementById('resultInfo').textContent = dayDiff;
        }

        document.getElementById('fromTime').addEventListener('input', convertTime);
        document.getElementById('fromTz').addEventListener('change', convertTime);
        document.getElementById('toTz').addEventListener('change', convertTime);

        updateCurrentTime();
        updateWorldClocks();
        convertTime();
        setInterval(updateCurrentTime, 1000);
        setInterval(updateWorldClocks, 60000);
    </script>
