                        <label>Monthly Payment ($)</label>
                        <input type="number" id="payment" value="150" oninput="calculate()">

                        <input type="number" id="extra" value="0" oninput="calculate()">
                    </div>

                    <div class="result-hero-label">Time to Pay Off</div>

                        <div class="result-label">Total Interest</div>
                    </div>
                    <div class="result-card">
                        <div class="result-value" id="totalPaid">$0</div>
                        <div class="result-label">Total Paid</div>
                    </div>
                    <div class="result-card">
                        <div class="result-value" id="payoffDate">--</div>
                        <div class="result-label">Payoff Date</div>
                    </div>
                    <div class="result-card">
                        <div class="result-value" id="interestPct">0%</div>
                        <div class="result-label">Interest % of Total</div>
                    </div>
                </div>
            </div>

            <div class="savings-card" id="savingsCard" style="display: none;">
                <div class="savings-label">With Extra Payments You Save</div>
                <div class="savings-value" id="savings">$0</div>
                <div class="savings-label" id="timeSaved">and 0 months</div>
            </div>

            <div class="card">
                <h2>💡 Payoff Strategies</h2>
                <div id="strategies"></div>
            </div>

    <script>
        function calcPayoff(balance, apr, payment) {
            const monthlyRate = apr / 100 / 12;
            let months = 0;
            let totalInterest = 0;
            let remaining = balance;
            
            while (remaining > 0 && months < 600) {
                const interest = remaining * monthlyRate;
                totalInterest += interest;
                remaining = remaining + interest - payment;
                months++;
                if (payment <= remaining * monthlyRate) {
                    return { months: Infinity, totalInterest: Infinity };
                }
            }
            return { months, totalInterest };
        }

        function calculate() {
            const balance = parseFloat(document.getElementById('balance').value) || 0;
            const apr = parseFloat(document.getElementById('apr').value) || 0;
            const payment = parseFloat(document.getElementById('payment').value) || 0;
            const extra = parseFloat(document.getElementById('extra').value) || 0;

            const baseResult = calcPayoff(balance, apr, payment);
            const extraResult = calcPayoff(balance, apr, payment + extra);

            const months = extraResult.months;
            const totalInterest = extraResult.totalInterest;
            const totalPaid = balance + totalInterest;
            const interestPct = totalPaid > 0 ? (totalInterest / totalPaid) * 100 : 0;

            const years = Math.floor(months / 12);
            const remainingMonths = months % 12;
            let timeDisplay = '';
            if (months >= 600) {
                timeDisplay = 'Never (payment too low)';
            } else if (years > 0 && remainingMonths > 0) {
                timeDisplay = years + ' yr ' + remainingMonths + ' mo';
            } else if (years > 0) {
                timeDisplay = years + ' years';
            } else {
                timeDisplay = months + ' months';
            }

            const payoffDate = new Date();
            payoffDate.setMonth(payoffDate.getMonth() + months);
            const dateStr = payoffDate.toLocaleDateString('en-US', { month: 'short', year: 'numeric' });

            document.getElementById('payoffTime').textContent = timeDisplay;
            document.getElementById('totalInterest').textContent = '$' + Math.round(totalInterest).toLocaleString();
            document.getElementById('totalPaid').textContent = '$' + Math.round(totalPaid).toLocaleString();
            document.getElementById('payoffDate').textContent = months < 600 ? dateStr : 'Never';
            document.getElementById('interestPct').textContent = interestPct.toFixed(1) + '%';

            const savingsCard = document.getElementById('savingsCard');
            if (extra > 0 && baseResult.months < 600) {
                const savedInterest = baseResult.totalInterest - extraResult.totalInterest;
                const savedMonths = baseResult.months - extraResult.months;
                document.getElementById('savings').textContent = '$' + Math.round(savedInterest).toLocaleString();
                document.getElementById('timeSaved').textContent = 'and ' + savedMonths + ' months faster!';
                savingsCard.style.display = 'block';
            } else {
                savingsCard.style.display = 'none';
            }

            const strategies = [
                { payment: payment * 1.5, label: 'Pay 50% more' },
                { payment: payment * 2, label: 'Double payments' },
                { payment: balance / 12, label: 'Pay off in 1 year' },
                { payment: balance / 24, label: 'Pay off in 2 years' }
            ];

            let strategiesHtml = '';
            strategies.forEach(s => {
                if (s.payment > payment) {
                    const result = calcPayoff(balance, apr, s.payment);
                    if (result.months < 600) {
                        strategiesHtml += '<div class="breakdown-row"><span>' + s.label + '</span><span>$' + Math.round(s.payment) + '/mo</span><span style="color: var(--success);">' + result.months + ' months</span></div>';
                    }
                }
            });
            document.getElementById('strategies').innerHTML = strategiesHtml || '<p style="color: var(--text-secondary);">Enter your balance and payment to see strategies.</p>';
        }
        calculate();
    </script>
