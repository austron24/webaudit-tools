    <style>
        :root { --primary: #f472b6; --primary-dark: #ec4899; --secondary: #22d3ee; --accent: #f59e0b; --bg-dark: #0f172a; --bg-card: #1e293b; --bg-input: #334155; --text-primary: #f1f5f9; --text-secondary: #94a3b8; --border: #475569; --success: #10b981; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg-dark); color: var(--text-primary); min-height: 100vh; line-height: 1.6; }

        .header h1 { font-size: 2.5rem; margin-bottom: 10px; }
        .main-container { max-width: 1200px; margin: 0 auto; padding: 20px; display: grid; grid-template-columns: 1fr 160px; gap: 20px; }
        .content-area { display: flex; flex-direction: column; gap: 20px; }
        .sidebar { display: flex; flex-direction: column; gap: 20px; }
        .card { background: var(--bg-card); border-radius: 16px; padding: 24px; }
        .card h2 { color: var(--secondary); margin-bottom: 20px; font-size: 1.3rem; }
        .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: var(--text-secondary); }
        input, select { width: 100%; padding: 15px; border: 2px solid var(--border); border-radius: 10px; font-size: 1rem; background: var(--bg-input); color: var(--text-primary); }
        input:focus, select:focus { outline: none; border-color: var(--primary); }
        .result-hero { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); padding: 35px; border-radius: 16px; text-align: center; margin: 20px 0; }
        .result-hero-value { font-size: 3rem; font-weight: 800; color: white; }
        .result-hero-label { color: rgba(255,255,255,0.8); }
        .results-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 20px; }
        .result-card { background: var(--bg-input); padding: 20px; border-radius: 12px; text-align: center; }
        .result-value { font-size: 1.3rem; font-weight: 700; color: var(--secondary); }
        .result-label { color: var(--text-secondary); margin-top: 5px; font-size: 0.85rem; }
        .budget-breakdown { margin-top: 20px; }
        .budget-row { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: var(--bg-input); border-radius: 8px; margin-bottom: 10px; }
        .budget-bar { height: 6px; background: var(--bg-dark); border-radius: 3px; margin-top: 8px; overflow: hidden; }
        .budget-fill { height: 100%; background: var(--primary); border-radius: 3px; }
        .related-tools { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-top: 15px; }
        .related-link { display: block; padding: 12px 16px; background: var(--bg-input); border-radius: 8px; color: var(--text-primary); text-decoration: none; }
        .related-link:hover { background: var(--primary); }
        @media (max-width: 968px) { .main-container { grid-template-columns: 1fr; } .sidebar { display: none; } }
        @media (max-width: 640px) { .form-grid, .results-grid { grid-template-columns: 1fr; } }
    </style>
    <script>(function(s){s.dataset.zone='10379224',s.src='https://nap5k.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
</head>
<body>
    </div>
    </div>
    
    <header class="header">
        <h1>💒 Wedding Budget Calculator</h1>
    </header>

    <div class="main-container">
        <div class="content-area">
            <div class="card">
                <h2>💍 Wedding Details</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Total Budget ($)</label>
                        <input type="number" id="totalBudget" value="30000" oninput="calculate()">
                    </div>
                    <div class="form-group">
                        <label>Guest Count</label>
                        <input type="number" id="guestCount" value="100" oninput="calculate()">
                    </div>
                    <div class="form-group">
                        <label>Wedding Style</label>
                        <select id="style" onchange="calculate()">
                            <option value="budget">Budget-Friendly</option>
                            <option value="moderate" selected>Moderate</option>
                            <option value="upscale">Upscale</option>
                            <option value="luxury">Luxury</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Location Type</label>
                        <select id="location" onchange="calculate()">
                            <option value="rural">Rural/Small Town</option>
                            <option value="suburban" selected>Suburban</option>
                            <option value="city">Major City</option>
                            <option value="destination">Destination</option>
                        </select>
                    </div>
                </div>
                
                <div class="result-hero">
                    <div class="result-hero-label">Cost Per Guest</div>
                    <div class="result-hero-value" id="perGuest">$0</div>
                </div>
                
                <div class="results-grid">
                    <div class="result-card">
                        <div class="result-value" id="estimatedTotal">$0</div>
                        <div class="result-label">Estimated Total</div>
                    </div>
                    <div class="result-card">
                        <div class="result-value" id="budgetStatus">On Budget</div>
                        <div class="result-label">Budget Status</div>
                    </div>
                    <div class="result-card">
                        <div class="result-value" id="difference">$0</div>
                        <div class="result-label">Over/Under</div>
                    </div>
                </div>
            </div>

            <div class="card">
                <h2>📊 Budget Breakdown</h2>
                <div class="budget-breakdown" id="breakdown"></div>
            </div>

            </div>

            <div class="card">
                <h2>🔗 Related Tools</h2>
                <div class="related-tools">
                    <a href="savings-goal-calculator.html" class="related-link">💰 Savings Goal</a>
                    <a href="budget-calculator.html" class="related-link">📊 Budget Planner</a>
                    <a href="loan-calculator.html" class="related-link">🏦 Loan Calculator</a>
                    <a href="tip-calculator.html" class="related-link">💵 Tip Calculator</a>
                </div>
            </div>
        </div>

        <div class="sidebar">
            </div>
        </div>
    </div>

    <script>
        const categories = [
            { name: '🏛️ Venue & Catering', percent: 0.45, icon: '🏛️' },
            { name: '📸 Photography/Video', percent: 0.12, icon: '📸' },
            { name: '💐 Flowers & Decor', percent: 0.08, icon: '💐' },
            { name: '🎵 Music/Entertainment', percent: 0.08, icon: '🎵' },
            { name: '👗 Attire & Beauty', percent: 0.08, icon: '👗' },
            { name: '🍰 Cake & Desserts', percent: 0.03, icon: '🍰' },
            { name: '💌 Invitations/Paper', percent: 0.03, icon: '💌' },
            { name: '💍 Rings', percent: 0.03, icon: '💍' },
            { name: '🎁 Favors & Gifts', percent: 0.03, icon: '🎁' },
            { name: '🚗 Transportation', percent: 0.02, icon: '🚗' },
            { name: '💼 Miscellaneous', percent: 0.05, icon: '💼' }
        ];
        
        function calculate() {
            const totalBudget = parseFloat(document.getElementById('totalBudget').value) || 0;
            const guestCount = parseInt(document.getElementById('guestCount').value) || 1;
            const style = document.getElementById('style').value;
            const location = document.getElementById('location').value;
            
            let multiplier = 1.0;
            if (style === 'budget') multiplier *= 0.7;
            else if (style === 'upscale') multiplier *= 1.3;
            else if (style === 'luxury') multiplier *= 1.8;
            
            if (location === 'rural') multiplier *= 0.8;
            else if (location === 'city') multiplier *= 1.3;
            else if (location === 'destination') multiplier *= 1.5;
            
            const basePerGuest = 250 * multiplier;
            const estimatedTotal = basePerGuest * guestCount;
            const perGuest = totalBudget / guestCount;
            const difference = totalBudget - estimatedTotal;
            
            document.getElementById('perGuest').textContent = '$' + Math.round(perGuest).toLocaleString();
            document.getElementById('estimatedTotal').textContent = '$' + Math.round(estimatedTotal).toLocaleString();
            document.getElementById('difference').textContent = (difference >= 0 ? '+' : '') + '$' + Math.round(difference).toLocaleString();
            
            const statusEl = document.getElementById('budgetStatus');
            if (difference >= 0) {
                statusEl.textContent = 'Under Budget ✓';
                statusEl.style.color = '#10b981';
            } else {
                statusEl.textContent = 'Over Budget ⚠️';
                statusEl.style.color = '#ef4444';
            }
            
            let breakdownHtml = '';
            categories.forEach(cat => {
                const amount = Math.round(totalBudget * cat.percent);
                breakdownHtml += `
                    <div class="budget-row">
                        <div style="flex: 1;">
                            <div style="display: flex; justify-content: space-between;">
                                <span>${cat.name}</span>
                                <span style="color: var(--secondary); font-weight: 700;">$${amount.toLocaleString()}</span>
                            </div>
                            <div class="budget-bar">
                                <div class="budget-fill" style="width: ${cat.percent * 100}%;"></div>
                            </div>
                            <div style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 4px;">${(cat.percent * 100).toFixed(0)}% of budget</div>
                        </div>
                    </div>
                `;
            });
            document.getElementById('breakdown').innerHTML = breakdownHtml;
        }
        
        calculate();
    </script>
</body>
</html>
